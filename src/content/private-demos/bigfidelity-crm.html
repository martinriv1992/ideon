<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Fidelity · CRM (demo)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--act:#fff;--sfg:#cfe3e8;--sfgon:#fff;--non:rgba(255,255,255,.16);--nhov:rgba(255,255,255,.08);--pt:#0E4A5C;--p:#0E4A5C;--fg:#12303A;--ac:#FF6B57;--bg:#F4F8F9;--mut:#5d7882;--bd:#dfe9ec;--ok:#1f9d74;--warn:#e8a317}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:14px;line-height:1.45}
#app{display:flex;min-height:100vh}
.side{width:236px;background:var(--p);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;flex:none;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px;font-weight:800;font-size:15px;line-height:1.1}
.brand small{display:block;font-weight:500;opacity:.7;font-size:11px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:var(--sfg);padding:10px 12px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;text-align:left}
.nav button:hover{background:var(--nhov)}
.nav button.on{background:var(--non);color:var(--sfgon)}
.nav svg,.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sfoot{margin-top:auto;font-size:12px;color:var(--sfg)}
.sfoot select{width:100%;margin:6px 0;background:rgba(0,0,0,.25);color:#fff;border:1px solid rgba(255,255,255,.25)}
main{flex:1;min-width:0;padding:24px 30px 40px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:24px;font-weight:800;color:var(--pt)}
h2{font-size:16px;margin:0 0 12px;font-weight:700}
h3{margin:0 0 14px;font-size:18px;color:var(--pt)}
.mut{color:var(--mut);margin:2px 0 0;font-size:13px}
.ha{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--p)}
.kpi.hot:before{background:#d64545}
.kpi span{font-size:12px;color:var(--mut);font-weight:600}
.kpi b{display:block;font-size:22px;margin-top:4px;color:var(--pt)}
.kpi.hot b{color:#d64545}
.kpi small{color:var(--mut)}
.g2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.btn{border:0;background:var(--ac);color:var(--act);font:inherit;font-weight:700;padding:9px 16px;border-radius:10px;cursor:pointer}
.btn:hover{filter:brightness(.95)}
.btn.sec{background:var(--p);color:#fff}
.btn.ghost{background:#fff;color:var(--pt);border:1px solid var(--bd)}
.btn.danger{background:#d6402c}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
input,select,textarea{font:inherit;color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;background:#fff;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(14,74,92,.25);border-color:var(--pt)}
label{display:block;font-weight:600;font-size:12px;color:var(--mut);margin-bottom:12px}
label input,label select,label textarea{display:block;width:100%;margin-top:4px;font-weight:400;font-size:14px}
.fb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fb input{min-width:200px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:10px;border-bottom:1px solid #eef3f5;vertical-align:middle}
tr.cl{cursor:pointer}tr.cl:hover td{background:#f7fbfc}
.num{text-align:right;white-space:nowrap}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700;background:#e6f0f3;color:var(--pt)}
.chip.ok{background:#dcf4ea;color:#157a58}.chip.bad{background:#ffe3df;color:#c2402e}.chip.w{background:#fff1d1;color:#9a6a00}
.row{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;background:#fff}
.row.late{border-color:#f0a59a;background:#fff3f1}
.row.now{border-color:#f3c46a;background:#fffaf0}
.grow{flex:1;min-width:0}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--bd);background:#fff;padding:7px 14px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer;color:var(--mut)}
.tabs button.on{background:var(--p);color:#fff;border-color:var(--pt)}
.kan{display:grid;grid-template-columns:repeat(6,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px}
.col{background:#e9f1f3;border-radius:14px;padding:10px;min-height:200px}
.col h4{margin:2px 4px 8px;font-size:13px;display:flex;justify-content:space-between;color:var(--pt)}
.col .tot{font-size:11px;color:var(--mut);margin:0 4px 8px}
.kc{background:#fff;border-radius:12px;padding:10px;margin-bottom:8px;border:1px solid var(--bd);cursor:grab;box-shadow:0 1px 2px rgba(14,74,92,.05)}
.kc b{display:block;font-size:13px}
.kc .m{font-size:12px;color:var(--mut);display:flex;justify-content:space-between;margin-top:4px}
.kc select{width:100%;margin-top:6px;padding:3px 6px;font-size:12px}
.bar{height:8px;background:#e3edf0;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--p);border-radius:9px}
.bar i.c{background:var(--ac)}
.tl{border-left:2px solid var(--bd);margin-left:6px;padding-left:14px}
.tl div{position:relative;margin-bottom:12px}
.tl div:before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--ac)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
#modal{position:fixed;inset:0;background:rgba(18,48,58,.55);display:none;justify-content:center;align-items:flex-start;padding:28px 12px;overflow:auto;z-index:50}
#modal.on{display:flex}
.box{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.box.wide{max-width:880px}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.err{color:#c2402e;font-weight:600;min-height:18px}
.totals{margin:12px 0 0 auto;max-width:300px}
.totals div{display:flex;justify-content:space-between;padding:4px 0}
.totals .t{border-top:2px solid var(--p);font-weight:800;font-size:17px;color:var(--pt);margin-top:4px;padding-top:8px}
.doc h2{font-size:22px;color:var(--pt)}
.doc .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--ac);padding-bottom:12px;margin-bottom:14px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--fg);color:#fff;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.3s;z-index:99}
#toast.on{opacity:1}
.demo{background:#fff1ee;color:#b0412f;border:1px dashed var(--ac);border-radius:10px;padding:6px 12px;font-size:12px;font-weight:600;margin-bottom:16px;display:inline-block}
textarea.big{width:100%;min-height:160px;font-family:monospace;font-size:12px}
.empty{text-align:center;color:var(--mut);padding:24px}
@media(max-width:860px){
#app{flex-direction:column}
.side{width:100%;height:auto;position:static;padding:10px;flex-direction:column}
.nav{flex-direction:row;overflow-x:auto;gap:4px}
.nav button{width:auto;white-space:nowrap;padding:8px 12px}
.brand{padding-bottom:4px}
.sfoot{margin:0}
main{padding:16px 14px 30px}
.g2,.grid2{grid-template-columns:1fr}
}
@media print{
#app,#toast{display:none!important}
body{background:#fff}
#modal{position:static;background:none;padding:0;display:block}
.box{box-shadow:none;max-width:none;padding:0}
.noprint{display:none!important}
}

.blogo{display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:11px;background:var(--ac);color:var(--act);font-weight:800;overflow:hidden}
.blogo img{width:100%;height:100%;object-fit:contain;background:#fff;padding:2px}
#bfBtn{position:fixed;right:16px;bottom:16px;z-index:60;border:0;border-radius:99px;padding:10px 14px;background:#111;color:#fff;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:.35}
#bfBtn:hover{opacity:1}
#bfPanel{position:fixed;right:16px;bottom:64px;z-index:61;width:300px;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.2);display:none}
#bfPanel.on{display:block}#bfPanel h4{margin:0 0 10px}#bfPanel label{display:block;margin:0 0 10px;font-size:12px;font-weight:600}
#bfPanel input[type=text]{width:100%}#bfPanel input[type=color]{width:100%;height:34px;border:1px solid var(--bd);border-radius:8px;padding:2px}
.side .blogo img{background:#fff}
</style>
</head>
<body>
<div id="app">
<aside class="side">
<div class="brand"><span class="blogo" data-s="34"></span><div><span class="bname" style="font-size:18px;letter-spacing:-.3px">big fidelity</span><small>CRM · demo de Ideonapp</small></div></div>
<nav class="nav" id="nav"></nav>
<div class="sfoot"><label style="color:var(--sfg);margin:0">Usuario de demostración<select id="usel" onchange="setUser(this.value)"></select></label>Datos de ejemplo ficticios.</div>
</aside>
<main id="main"></main>
</div>
<div id="modal" onclick="if(event.target===this)closeM()"></div>
<div id="toast"></div>
<script>
const KEY='ideon-crm-bigfidelity-v1';
const ETAPAS=['Prospecto','Contactado','Propuesta','Negociación','Ganada','Perdida'];
const SUG={Prospecto:10,Contactado:25,Propuesta:50,'Negociación':75,Ganada:100,Perdida:0};
const TIPOS=['Llamada','Reunión','Correo','WhatsApp'];
const SECT=['Cafeterías','Gastronomía','Belleza y estética','Retail','Gimnasios','Heladerías','Farmacias'];
const CIU=['Buenos Aires','Córdoba','Rosario','Mendoza','La Plata','Mar del Plata'];
const PRE={clientes:'c',contactos:'p',oportunidades:'o',vendedores:'v',tareas:'t',productos:'g',cotizaciones:'q'};
const $=s=>document.querySelector(s);
const pad=(n,l=4)=>String(n).padStart(l,'0');
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const dd=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const cop=n=>'$ '+Math.round(n||0).toLocaleString('es-AR');
const fd=s=>s?s.split('-').reverse().join('/'):'—';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const noacc=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');

function seed(){
const s={seq:1000,user:'v1',iva:21,emp:{nombre:'Big Fidelity (demo)',nit:'30-00000000-0',dir:'Av. Ficticia 123, Buenos Aires',tel:'11 5555 0100',email:'ventas@bigfidelity.example'}};
s.vendedores=[['v1','Laura Benítez','Gerente comercial','Buenos Aires',0],['v2','Andrés Romero','Vendedor','Buenos Aires',2e6],['v3','Camila Ortiz','Vendedor','Córdoba',1.8e6],['v4','Julián Pereyra','Vendedor','Rosario',2.5e6],['v5','Martina Duarte','Vendedor','Mendoza',1.5e6]].map(([id,n,r,c,m])=>({id,nombre:n,email:noacc(n.split(' ')[0].toLowerCase())+'@bigfidelity.example',rol:r,ciudad:c,metaMensual:m,estado:'Activo'}));
const SV=['v2','v3','v4','v5'];
const EMP=['Café Tostado Norte','Burger Patio','Estudio Glow Belleza','Tienda Andén','Gimnasio Pulso','Helados Brisa','Farmacia del Parque','Café Medialuna','Parrilla La Esquina','Nails & Co. Studio','Almacén Ceibo','Fit Box Centro'];
s.clientes=EMP.map((e,i)=>({id:'c'+(i+1),empresa:e,nit:`30-71${100+i}${200+i}-${i%9}`,sector:SECT[i%7],ciudad:CIU[i%6],vendedor:SV[i%4],estado:['Activo','Activo','Prospecto','Activo','Inactivo','Activo'][i%6]}));
const NOM=['Sofía Acosta','Mateo Fernández','Valentina Ríos','Santiago Peña','Delfina Cruz','Felipe Aguirre','Isabella Gómez','Joaquín Lara','Natalia Paz','Tomás Giménez','Paula Molina','Diego Sosa','Julieta Mora','Bautista Herrera','Lucía Franco','Agustín Duarte','Mariana Toro','Nicolás Bravo','Florencia Luna','Ricardo Pinto'];
const CAR=['Dueño/a','Encargada de marketing','Gerente de sucursal','Socio/a','Administración','Responsable de operaciones'];
s.contactos=NOM.map((n,i)=>({id:'p'+(i+1),nombre:n,cliente:'c'+(i%12+1),cargo:CAR[i%6],email:noacc(n.split(' ')[0].toLowerCase())+'.'+i+'@demo.example',telefono:'11 5555 01'+pad(i,2)}));
const ET=['Prospecto','Contactado','Propuesta','Negociación','Ganada','Prospecto','Contactado','Propuesta','Negociación','Perdida','Ganada','Prospecto','Contactado','Propuesta','Negociación','Ganada','Perdida','Prospecto','Contactado','Propuesta','Negociación','Ganada','Contactado','Propuesta'];
const VAL=[12,8,25,40,6,18,30,9,22,15,35,5],TT=['Plan Pro anual','Tarjeta de sellos digital','Programa de puntos','Multi-sucursal','Campaña de cumpleaños','Cupones y referidos','Integración con POS','Renovación anual'];
const dom=new Date().getDate();
s.oportunidades=ET.map((e,i)=>({id:'o'+(i+1),titulo:TT[i%8]+' — '+EMP[i%12].split(' ')[0],cliente:'c'+(i%12+1),valor:VAL[i%12]*1e5,probabilidad:SUG[e],etapa:e,cierre:dd(5+i*3),vendedor:SV[i%4],motivoPerdida:e==='Perdida'?'Prefirieron seguir con tarjetas de cartón (ejemplo)':'',creada:dd(-(10+i*2)),cerradaEn:e==='Ganada'?(i===21?dd(-dom-3):dd(-(i%dom))):''}));
const PR=[['Plan Inicial (mensual)','Suscripción',45000],['Plan Pro (mensual)','Suscripción',89000],['Plan Multi-sucursal (mensual)','Suscripción',160000],['Diseño de tarjeta Google/Apple Wallet','Servicios',120000],['Campaña de lanzamiento','Servicios',80000],['Integración con POS','Servicios',250000],['Capacitación del equipo','Servicios',40000],['Display QR de mostrador','Material',15000]];
s.productos=PR.map((p,i)=>({id:'g'+(i+1),sku:'BF-'+pad(i+1,3),nombre:p[0],categoria:p[1],precio:p[2],estado:i===7?'Inactivo':'Activo'}));
const OFF=[-4,-2,0,0,1,3,-1,0,5,8],TA=['Llamar para confirmar propuesta','Enviar cotización actualizada','Mostrar la tarjeta en el local','Escribir por WhatsApp para agendar demo','Revisar alta del programa con el dueño'];
s.tareas=Array.from({length:30},(_,i)=>{const h=i%5===4;return{id:'t'+(i+1),titulo:TA[i%5],tipo:TIPOS[i%4],fecha:h?dd(-(i%4+1)):dd(OFF[i%10]),cliente:'c'+(i%12+1),opp:i<24?'o'+(i+1):'',vendedor:SV[i%4],estado:h?'Hecha':'Pendiente',resultado:h?'Cliente confirmó interés (ejemplo)':''}});
const qc=(L,p)=>{let sub=0,de=0;L.forEach(l=>{sub+=l.q*l.pr;de+=l.q*l.pr*l.d/100});const b=sub-de,iv=b*p/100;return{sub,desc:de,base:b,iva:iv,total:b+iv}};
s.cotizaciones=Array.from({length:10},(_,i)=>{const es=['Borrador','Enviada','Aceptada','Rechazada'][i%4];const lines=[0,1].slice(0,i%2+1).map(k=>{const p=PR[(i+k*3)%8];return{p:'g'+((i+k*3)%8+1),n:p[0],q:(i%3)+1,pr:p[2],d:(i%4)*5}});const c=qc(lines,21);return{id:'q'+(i+1),numero:'COT-'+pad(i+1),cliente:'c'+(i+1),opp:es==='Aceptada'?'':'o'+(i+1),fecha:dd(-(i*3+1)),lines,items:lines.map(l=>l.q+'× '+l.n).join('; '),descuento:c.sub?Math.round(c.desc/c.sub*100):0,ivaP:21,total:c.total,estado:es}});
const RES=['Quedó en revisar la propuesta (ejemplo)','Pidió precio para 3 sucursales (ejemplo)','Le gustó la tarjeta en Wallet (ejemplo)','Confirmó reunión con su socio (ejemplo)'];
s.acts=Array.from({length:16},(_,i)=>({id:'a'+i,tipo:TIPOS[i%4],fecha:dd(-(i+1)),cliente:'c'+(i%12+1),vendedor:SV[i%4],resultado:RES[i%4]}));
s.campanas=seedCamp(s);
return s}

function load(){try{const j=localStorage.getItem(KEY);if(j){const o=JSON.parse(j);if(o&&o.clientes&&o.vendedores&&o.acts)return o}}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(),ui={view:'dashboard',f:{},fv:'',tab:'Hoy',cli:null,etapa:'',q:null,qid:''};
if(!S.campanas){S.campanas=seedCamp(S)}
const byId=(l,id)=>S[l].find(x=>x.id===id);
const cn=id=>(byId('clientes',id)||{}).empresa||'—';
const vn=id=>(byId('vendedores',id)||{}).nombre||'—';
const cur=()=>byId('vendedores',S.user)||S.vendedores[0];
const mgr=()=>cur().rol==='Gerente comercial';
const sv=()=>mgr()?ui.fv:cur().id;
const sellers=()=>S.vendedores.filter(v=>v.rol==='Vendedor');
const uid=p=>p+(++S.seq);
const okV=v=>!sv()||v===sv();
const oppS=()=>S.oportunidades.filter(o=>okV(o.vendedor));
const cliS=()=>S.clientes.filter(c=>okV(c.vendedor));
const tarS=()=>S.tareas.filter(t=>okV(t.vendedor));
const actS=()=>S.acts.filter(a=>okV(a.vendedor));
const contS=()=>S.contactos.filter(p=>okV((byId('clientes',p.cliente)||{}).vendedor));
const cotS=()=>S.cotizaciones.filter(q=>okV((byId('clientes',q.cliente)||{}).vendedor));
const ventasMes=(vid,m)=>S.oportunidades.filter(o=>o.etapa==='Ganada'&&(o.cerradaEn||'').startsWith(m)&&(!vid||o.vendedor===vid)).reduce((s,o)=>s+o.valor,0);
const logAct=(tipo,cliente,vendedor,resultado)=>S.acts.unshift({id:uid('a'),tipo,fecha:today(),cliente,vendedor,resultado});
const qcalc=(L,p)=>{let sub=0,de=0;L.forEach(l=>{sub+=l.q*l.pr;de+=l.q*l.pr*l.d/100});const b=sub-de,iv=b*p/100;return{sub,desc:de,base:b,iva:iv,total:b+iv}};
const F=k=>ui.f[ui.view+k]||'';
function setF(k,v){ui.f[ui.view+k]=v;render()}
const so=(L,sel)=>L.map(x=>{const a=Array.isArray(x)?x:[x,x];return`<option value="${esc(a[0])}" ${a[0]==sel?'selected':''}>${esc(a[1])}</option>`}).join('');
const fsel=(k,l,L)=>`<select id="s_${k}" onchange="setF('${k}',this.value)"><option value="">${l}</option>${so(L,F(k))}</select>`;
const chipE=e=>`<span class="chip ${{Ganada:'ok',Aceptada:'ok',Activo:'ok',Hecha:'ok',Perdida:'bad',Rechazada:'bad',Inactivo:'bad',Enviada:'w',Propuesta:'w','Negociación':'w'}[e]||''}">${esc(e)}</span>`;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}
function modal(h,w){$('#modal').innerHTML=`<div class="box ${w?'wide':''}">${h}</div>`;$('#modal').classList.add('on')}
function closeM(){$('#modal').classList.remove('on');$('#modal').innerHTML=''}
function ask(msg,fn,lbl){ask.fn=fn;modal(`<h3>Confirmar</h3><p>${msg}</p><div class="btns"><button class="btn ghost" onclick="closeM()">Cancelar</button><button class="btn danger" onclick="const f=ask.fn;closeM();f()">${lbl||'Eliminar'}</button></div>`)}

oportunidades(o,id){

dl('contactos-'+today()+'.vcf',L.map(p=>{const n=(p.nombre||'').split(' '),fn=n.shift(),ln=n.join(' ');return['BEGIN:VCARD','VERSION:3.0',`N:${v(ln)};${v(fn)};;;`,`FN:${v(p.nombre)}`,`ORG:${v(cn(p.cliente))}`,p.cargo?`TITLE:${v(p.cargo)}`:'',p.email?`EMAIL;TYPE=WORK:${p.email}`:'',p.telefono?`TEL;TYPE=CELL:+${waNum(p)}`:'','END:VCARD'].filter(Boolean).join('\r\n')}).join('\r\n'),'text/vcard;charset=utf-8')}
else{const t=L.map(p=>p.email).filter(Boolean).join('; ');try{navigator.clipboard.writeText(t)}catch(e){}closeM();toast(L.length+' correos copiados');return}

const kS=()=>S.campanas.filter(k=>mgr()||k.creador===cur().id);
const oppK=id=>S.oportunidades.filter(o=>o.campana===id);
/** Destinatarios del segmento: contactos visibles que cumplen los filtros y tienen el dato del canal. */
function segC(sg,canal){
return contS().filter(p=>{const c=pCli(p);
if(sg.sector&&c.sector!==sg.sector)return false;if(sg.ciudad&&c.ciudad!==sg.ciudad)return false;if(sg.estado&&c.estado!==sg.estado)return false;
if(sg.vendedor&&c.vendedor!==sg.vendedor)return false;if(sg.cargo&&!(p.cargo||'').toLowerCase().includes(sg.cargo.toLowerCase()))return false;
if(sg.etapa&&!S.oportunidades.some(o=>o.cliente===c.id&&o.etapa===sg.etapa))return false;
return canal==='WhatsApp'?Boolean(p.telefono):Boolean(p.email)})}
function segTxt(sg){const t=[sg.sector,sg.ciudad,sg.estado&&('clientes '+sg.estado.toLowerCase()+'s'),sg.etapa&&('oportunidad en '+sg.etapa),sg.vendedor&&vn(sg.vendedor),sg.cargo&&('cargo «'+sg.cargo+'»')].filter(Boolean);return t.length?t.join(' · '):'Todos mis contactos'}
function autoProg(){let n=0;S.campanas.forEach(k=>{if(k.estado==='Programada'&&k.prog&&k.prog<=today()){enviarK(k,true);n++}});if(n)save()}

V.campanas=()=>{autoProg();
const L=kS(),env=L.filter(k=>k.estado==='Enviada'),dest=env.reduce((s,k)=>s+k.dest.length,0),resp=env.reduce((s,k)=>s+k.dest.filter(d=>d.st==='Respondió').length,0);
const ops=L.reduce((s,k)=>s+oppK(k.id).length,0),val=L.reduce((s,k)=>s+oppK(k.id).reduce((a,o)=>a+o.valor,0),0);
return head('Campañas','Correos y mensajes de WhatsApp a segmentos de tus contactos',`<button class="btn" onclick="campForm()">+ Nueva campaña</button>`)+
`<div class="kpis"><div class="kpi"><span>Campañas enviadas</span><b>${env.length}</b></div><div class="kpi"><span>Contactos alcanzados</span><b>${dest}</b></div><div class="kpi hot"><span>Tasa de respuesta</span><b>${dest?Math.round(resp/dest*100):0}%</b></div><div class="kpi"><span>Oportunidades generadas</span><b>${ops} · ${cop(val)}</b></div></div>
<div class="card">`+tbl(['Campaña','Canal','Segmento','Estado','#Destinatarios','#Respuestas','#Oportunidades',''],L.slice().sort((a,b)=>(b.fecha||b.prog||'9').localeCompare(a.fecha||a.prog||'9')).map(k=>{const r=k.dest.filter(d=>d.st==='Respondió').length;
return`<tr><td><b>${esc(k.nombre)}</b><br><span class="mut">${k.estado==='Enviada'?'Enviada el '+fd(k.fecha):k.estado==='Programada'?'Programada para el '+fd(k.prog):'Borrador'}</span></td><td>${chipK(k.canal)}</td><td>${esc(segTxt(k.seg))}</td><td>${chipK(k.estado)}</td><td class="num">${k.estado==='Enviada'?k.dest.length:segC(k.seg,k.canal).length}</td><td class="num">${k.estado==='Enviada'?r:'—'}</td><td class="num">${oppK(k.id).length}</td>
<td class="acts">${k.estado==='Enviada'?`<button class="btn sm sec" onclick="campVer('${k.id}')">Ver resultados</button>`:`<button class="btn sm sec" onclick="campForm('${k.id}')">Editar</button>`}<button class="btn sm ghost" onclick="campDup('${k.id}')">Duplicar</button><button class="btn sm ghost" onclick="campDel('${k.id}')">Eliminar</button></td></tr>`}).join(''),'Aún no hay campañas. Crea la primera con «+ Nueva campaña».')+`</div>
<div class="card"><h2>Cómo funciona</h2><p class="mut">Elige a quién escribir con filtros (sector, ciudad, estado, etapa de la oportunidad, cargo), redacta el mensaje con variables como {nombre} o {empresa} y envíalo o prográmalo. Cada envío queda en el historial del cliente; marca quién respondió y convierte las respuestas en oportunidades. <b>Demostración:</b> el envío se simula; en tu versión se conecta a tu correo (Gmail, Outlook o SMTP) o a WhatsApp Business.</p></div>`};

function campGuardar(id,enviar){
const k=campLeer();
if(!k.nombre){$('#cerr').textContent='Ponle un nombre a la campaña.';return}
if(!k.mensaje.trim()||k.mensaje.trim()==='Hola {nombre},'){$('#cerr').textContent='Escribe el mensaje.';return}
if(k.canal==='Correo'&&!k.asunto&&enviar){$('#cerr').textContent='Escribe el asunto del correo.';return}
if(enviar&&!segC(k.seg,k.canal).length){$('#cerr').textContent='Ningún contacto cumple el segmento.';return}

if(!r){r={id:uid('k'),creador:cur().id,estado:'Borrador',fecha:'',dest:[]};S.campanas.push(r)}

tbl(['Contacto','Empresa','Estado',''],k.dest.map(d=>{const p=byId('contactos',d.p);if(!p)return'';const m=perso(k.mensaje,p);

d.st=d.st==='Respondió'?'Enviado':'Respondió';if(d.st==='Respondió')logAct(k.canal,d.c,(byId('clientes',d.c)||{}).vendedor,`${p?p.nombre:'Contacto'} respondió a la campaña «${k.nombre}»`);save();campVer(kid);render()}

V.ajustes=()=>{const M=mgr(),e=S.emp,d=M?'':'disabled';
return head('Ajustes','Usuario de demostración, empresa y datos')+
`<div class="card"><h2>Usuario de demostración</h2><p class="mut">Cambia de perfil para ver cómo se ajustan menús, permisos y filtros.</p><label style="max-width:360px">Usuario activo<select onchange="setUser(this.value)">${so(S.vendedores.map(v=>[v.id,v.nombre+' · '+v.rol]),S.user)}</select></label></div>
<div class="card"><h2>Datos de la empresa e IVA</h2>${M?'':'<p class="mut">Solo el gerente comercial puede modificar estos datos.</p>'}<form onsubmit="return saveEmp(event)"><div class="grid2"><label>Razón social<input name="nombre" value="${esc(e.nombre)}" ${d}></label><label>CUIT<input name="nit" value="${esc(e.nit)}" ${d}></label><label>Dirección<input name="dir" value="${esc(e.dir)}" ${d}></label><label>Teléfono<input name="tel" value="${esc(e.tel)}" ${d}></label><label>Correo<input name="email" value="${esc(e.email)}" ${d}></label><label>IVA %<input name="iva" type="number" min="0" max="100" value="${S.iva}" ${d}></label></div>${M?'<button class="btn">Guardar datos</button>':''}</form></div>
<div class="card"><h2>Exportar e importar datos</h2><div class="btns" style="justify-content:flex-start;margin:0 0 10px"><button class="btn sec" onclick="$('#io').value=JSON.stringify(S,null,1);toast('Datos exportados abajo')">Exportar datos</button><button class="btn ghost" onclick="importData()">Importar</button></div><textarea class="big" id="io" placeholder="El JSON exportado aparece aquí. Pega un JSON para importar."></textarea></div>
<div class="card"><h2>Reiniciar demo</h2><p class="mut">Restaura los registros de ejemplo y borra tus cambios.</p><button class="btn danger" onclick="ask('¿Restaurar todos los datos de ejemplo? Se perderán los cambios actuales.',()=>{S=seed();ui.cli=null;ui.fv='';save();render();toast('Datos de ejemplo restaurados')},'Reiniciar')">Reiniciar datos de ejemplo</button></div>`};
function saveEmp(e){e.preventDefault();const f=e.target.elements;['nombre','nit','dir','tel','email'].forEach(k=>S.emp[k]=f[k].value.trim());S.iva=Math.min(100,Math.max(0,Number(f.iva.value)||0));save();toast('Datos guardados');return false}
function importData(){try{const o=JSON.parse($('#io').value);if(!o||!Array.isArray(o.clientes)||!Array.isArray(o.vendedores)||!Array.isArray(o.oportunidades))throw 0;['contactos','tareas','cotizaciones','productos','acts'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});o.emp=o.emp||S.emp;o.iva=o.iva||21;o.seq=o.seq||2000;o.user=o.vendedores.some(v=>v.id===o.user)?o.user:o.vendedores[0].id;S=o;ui.fv='';ui.cli=null;save();render();toast('Datos importados')}catch(x){toast('JSON no válido: no se importó nada')}}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
render();
</script>
