<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferretería El Tornillo · Inventario</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#2b2d31;--bg2:#232529;--card:#33363b;--line:#44484f;--fg:#ececec;--mut:#9aa0a8;--ac:#ff7a1a;--ok:#3ecf74;--warn:#ffc233;--bad:#ff5252}
*{box-sizing:border-box}
body{margin:0;font-family:Barlow,sans-serif;background:var(--bg);color:var(--fg);font-size:15px;display:flex;min-height:100vh}
aside{width:224px;background:var(--bg2);border-right:1px solid var(--line);padding:16px 10px;position:fixed;top:0;bottom:0;overflow:auto;z-index:5}
.logo{display:flex;gap:8px;align-items:center;font-weight:700;font-size:17px;padding:0 8px 14px}
.logo svg{flex:none}
.logo small{display:block;font-weight:400;color:var(--mut);font-size:12px}
nav button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:var(--fg);padding:10px;border-radius:8px;font:inherit;cursor:pointer;text-align:left;font-weight:500}
nav button:hover{background:var(--card)}
nav button.on{background:var(--ac);color:#1a1a1a;font-weight:700}
main{margin-left:224px;flex:1;padding:20px 24px;min-width:0}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin:0;font-size:26px;flex:1;min-width:140px}
.demo{background:#ff7a1a22;color:var(--ac);border:1px solid var(--ac);padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600}
input,select,textarea{background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
.top input{width:230px}
.btn{background:var(--ac);color:#1a1a1a;border:0;border-radius:7px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.s{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.btn.d{background:var(--bad);color:#fff}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:hover{filter:brightness(1.1)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:9px;padding:13px;cursor:pointer}
.kpi span{color:var(--mut);font-size:13px}
.kpi b{display:block;font-size:26px;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.card h3{margin:0 0 10px;font-size:16px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
th.so{cursor:pointer}
tr.cl{cursor:pointer}
tbody tr:hover{background:#3b3e44}
.tag{display:inline-block;padding:2px 9px;border-radius:5px;font-size:12px;font-weight:700}
.t-ok,.t-Entrada{background:var(--ok);color:#10281a}
.t-Bajo,.t-Ajuste{background:var(--warn);color:#2b2000}
.t-Agotado,.t-Salida{background:var(--bad);color:#fff}
.t-an{background:#666;color:#ddd}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar>*{flex:1;min-width:130px}
.bar .btn{flex:none}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.modal>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.modal h2{margin:0 0 12px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg label{font-size:13px;color:var(--mut);display:block}
.fg .w{grid-column:1/-1}
.err{color:var(--bad);font-size:13px;margin:8px 0}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.alert{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.alert small{color:var(--mut);display:block}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ac);color:#111;padding:10px 16px;border-radius:8px;font-weight:700;z-index:30}
.empty{color:var(--mut);padding:14px;text-align:center}
.confirm{background:#ff525222;border:1px solid var(--bad);padding:10px;border-radius:8px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.confirm span{flex:1}
pre{white-space:pre-wrap;background:var(--bg2);padding:10px;border-radius:8px;font-size:13px}
.menu{display:none}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.dl div{background:var(--bg2);padding:8px 10px;border-radius:7px}
.dl small{color:var(--mut);display:block;font-size:12px}
@media(max-width:820px){
body{display:block}
aside{position:static;width:auto;display:flex;flex-direction:column;padding:8px}
.logo{padding-bottom:4px}
nav{display:none;flex-direction:column}
nav.open{display:flex}
.menu{display:block;position:absolute;right:10px;top:12px}
main{margin:0;padding:14px}
.grid{grid-template-columns:1fr}
.top input{width:100%}
.fg{grid-template-columns:1fr}
aside{position:relative}
}
@media print{aside,.top,.noprint{display:none}main{margin:0}}
</style>
</head>
<body>
<aside>
<div class="logo"><svg width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#ff7a1a"/><path d="M16 5v5M12 10h8M13 10l1 14 2 3 2-3 1-14M13.5 14h5M14 18h4" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/></svg><div>El Tornillo<small>Inventario</small></div></div>
<button class="btn s sm menu" onclick="document.getElementById('nav').classList.toggle('open')">Menú</button>
<nav id="nav"></nav>
</aside>
<main>
<div class="top"><h1 id="ttl"></h1><input id="gs" placeholder="Buscar código…" aria-label="Buscar código"><span class="demo" id="rolb"></span><span class="demo">Datos de ejemplo</span></div>
<div id="v"></div>
</main>
<div id="mo"></div>
<script>
const KEY='ferreteria-el-tornillo-inventario';
const CATS=["Tornillería","Herramientas manuales","Herramientas eléctricas","Plomería","Electricidad","Pinturas","Adhesivos y selladores"];
const PROVS=["Distribuidora Norte","Herramientas del Centro","Eléctricos Mayoristas","Pinturas Andina","Plomex"];
const MOTIVOS=["Compra a proveedor","Venta mostrador","Devolución de cliente","Devolución a proveedor","Merma o daño","Conteo físico"];
const UNI=["pieza","caja","metro","litro","kg","bolsa"];
let S,view='dashboard',ui={},toastT;
const today=()=>new Date().toISOString().slice(0,10);
const dAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};
const uid=()=>Math.random().toString(36).slice(2,9);
function seed(){
const P=[["TOR-001","Tornillo para madera 8x1\" (caja 100)",0,0,"caja",42,69,60,20],["TOR-002","Tornillo hexagonal 1/4\" x 2\"",0,0,"pieza",3.5,6,300,100],["TOR-003","Tuerca hexagonal 3/8\"",0,0,"pieza",2.2,4.5,18,80],["TOR-004","Taquete plástico 6 mm (bolsa 50)",0,0,"bolsa",18,32,25,15],
["MAN-001","Martillo de uña 16 oz",1,1,"pieza",95,159,12,5],["MAN-002","Juego de destornilladores 6 pzas",1,1,"pieza",110,189,4,6],["MAN-003","Pinzas de presión 10\"",1,1,"pieza",88,149,9,4],["MAN-004","Flexómetro 5 m",1,1,"pieza",45,79,0,8],
["ELE-001","Taladro percutor 1/2\" 650 W",2,1,"pieza",980,1490,6,3],["ELE-002","Esmeriladora angular 4 1/2\"",2,1,"pieza",760,1190,2,3],["ELE-003","Disco de corte metal 4 1/2\"",2,1,"pieza",14,29,70,40],
["PLO-001","Tubo PVC hidráulico 1/2\" (3 m)",3,4,"pieza",38,65,40,20],["PLO-002","Llave mezcladora cocina",3,4,"pieza",420,690,5,3],["PLO-003","Cinta teflón 1/2\"",3,4,"pieza",6,14,5,30],
["ELC-001","Cable calibre 12 (rollo 100 m)",4,2,"pieza",820,1250,7,4],["ELC-002","Apagador sencillo blanco",4,2,"pieza",22,45,55,25],["ELC-003","Foco LED 9 W luz cálida",4,2,"pieza",18,39,90,50],["ELC-004","Extensión eléctrica 5 m",4,2,"pieza",75,129,10,6],
["PIN-001","Pintura vinílica blanca 19 L",5,3,"litro",890,1390,8,4],["PIN-002","Esmalte negro mate 1 L",5,3,"litro",125,210,3,6],["PIN-003","Brocha de cerda 3\"",5,3,"pieza",32,59,22,10],
["ADH-001","Silicón transparente 280 ml",6,0,"pieza",48,89,35,15],["ADH-002","Pegamento epóxico 2 tubos",6,0,"pieza",39,75,0,10],["ADH-003","Cinta de empaque 48 mm",6,0,"pieza",16,32,48,20]];
const productos=P.map((p,i)=>({id:"p"+i,codigo:p[0],nombre:p[1],categoria:CATS[p[2]],proveedor:PROVS[p[3]],unidad:p[4],costo:p[5],precio:p[6],existencias:p[7],minimo:p[8]}));
const prov=[["Distribuidora Norte","Marta Quiroga","555-0101","ventas@dnorte.example",3],["Herramientas del Centro","Iván Salgado","555-0102","pedidos@hcentro.example",5],["Eléctricos Mayoristas","Rosa Beltrán","555-0103","rosa@electricos.example",4],["Pinturas Andina","Hugo Paredes","555-0104","hugo@andina.example",6],["Plomex","Lucía Ferrer","555-0105","lucia@plomex.example",2]].map((p,i)=>({id:"v"+i,empresa:p[0],contacto:p[1],telefono:p[2],email:p[3],diasEntrega:p[4],notas:"Proveedor ficticio de ejemplo"}));
const desc=["Tornillos, tuercas y fijaciones","Martillos, pinzas y llaves","Taladros y esmeriladoras","Tubos, llaves y conexiones","Cables, apagadores y focos","Pinturas y esmaltes","Silicones, epóxicos y cintas"];
const categorias=CATS.map((c,i)=>({id:"c"+i,nombre:c,descripcion:desc[i]}));
const mv=[];let seedn=7;const rnd=n=>{seedn=(seedn*9301+49297)%233280;return Math.floor(seedn/233280*n)};
for(let i=0;i<30;i++){const p=productos[rnd(productos.length)];const tipo=["Entrada","Salida","Salida","Ajuste"][rnd(4)];const mot=tipo=="Entrada"?MOTIVOS[0]:tipo=="Salida"?MOTIVOS[1]:MOTIVOS[5];
mv.push({id:"m"+i,fecha:dAgo(i<4?0:rnd(14)),producto:p.id,tipo,cantidad:1+rnd(15),motivo:mot,nota:"",usuario:rnd(2)?"Administrador":"Vendedor",anulado:false,resultante:null})}
mv.sort((a,b)=>a.fecha<b.fecha?-1:1);
const run={};mv.forEach(m=>{const p=productos.find(x=>x.id==m.producto);run[m.producto]=run[m.producto]??p.existencias;m.resultante=null});
return{productos,movimientos:mv,proveedores:prov,categorias,cfg:{rol:"administrador",moneda:"$",umbral:10}}}
function load(){try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);return}}catch(e){}S=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();
const isAdm=()=>S.cfg.rol=="administrador";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>S.cfg.moneda+Number(n).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});
const prod=id=>S.productos.find(p=>p.id==id);
const estado=p=>p.existencias<=0?"Agotado":p.existencias<=p.minimo?"Bajo":"OK";
const tagE=e=>`<span class="tag t-${e}">${e}</span>`;
function toast(m){clearTimeout(toastT);document.querySelectorAll(".toast").forEach(e=>e.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);toastT=setTimeout(()=>t.remove(),2500)}
const PAGES=[["dashboard","Panel","M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"],["productos","Productos","M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"],["movimientos","Movimientos","M7 7h13l-3-3M17 17H4l3 3"],["proveedores","Proveedores","M3 7h11v9H3zM14 10h4l3 3v3h-7zM7 19a1.5 1.5 0 100-.1M17 19a1.5 1.5 0 100-.1"],["categorias","Categorías","M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"],["ajustes","Ajustes","M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v3M12 19v3M2 12h3M19 12h3"]];
function nav(){$("#nav").innerHTML=PAGES.map(p=>`<button class="${p[0]==view?"on":""}" onclick="go('${p[0]}')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${p[2]}"/></svg>${p[1]}</button>`).join("")}
function go(v,f){view=v;if(f)ui[v]=f;$("#nav").classList.remove("open");render()}
function render(){nav();$("#ttl").textContent=PAGES.find(p=>p[0]==view)[1];$("#rolb").textContent="Rol: "+S.cfg.rol;$("#v").innerHTML=({dashboard,productos,movimientos,proveedores,categorias,ajustes})[view]()}
function closeM(){$("#mo").innerHTML=""}
function modal(h){$("#mo").innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div>${h}</div></div>`}
function opts(a,s){return a.map(x=>`<option ${x==s?"selected":""}>${esc(x)}</option>`).join("")}
function inv(){return S.productos.reduce((s,p)=>s+p.existencias*p.costo,0)}
function sug(p){return Math.max(0,p.minimo*2-p.existencias)}
function dashboard(){
const low=S.productos.filter(p=>estado(p)!="OK"),ag=S.productos.filter(p=>estado(p)=="Agotado").length;
const hoy=S.movimientos.filter(m=>m.fecha==today()&&!m.anulado).length;
const k=[["Valor del inventario (costo)",money(inv()),"productos"],["Productos en catálogo",S.productos.length,"productos"],["Bajo stock mínimo",low.length,"productos','Bajo"],["Agotados",ag,"productos','Agotado"],["Movimientos de hoy",hoy,"movimientos"]];
const last=[...S.movimientos].sort((a,b)=>a.fecha<b.fecha?1:-1).slice(0,6);
return`<div class="kpis">${k.map(x=>`<div class="kpi" onclick="${x[2].includes("'")?`kf('${x[2].split("'")[0]}','${x[2].split("'")[2]}')`:`go('${x[2]}')`}"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("")}</div>
<div class="card" style="margin-bottom:14px"><h3>Alertas de stock bajo</h3>${low.length?low.map(p=>`<div class="alert"><div><b>${esc(p.codigo)}</b> ${esc(p.nombre)} ${tagE(estado(p))}<small>Existencias ${p.existencias}/${p.minimo} · Sugerido pedir: ${sug(p)} ${p.unidad} · ${esc(p.proveedor)}</small></div><button class="btn sm" onclick="movForm('${p.id}')">Registrar entrada</button></div>`).join(""):'<div class="empty">Sin alertas</div>'}</div>
<div class="grid"><div class="card"><h3>Entradas vs. salidas (14 días)</h3>${chart1()}</div><div class="card"><h3>Valor por categoría</h3>${chart2()}</div></div>
<div class="card"><h3>Últimos movimientos</h3><div class="tw"><table><thead><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cantidad</th></tr></thead><tbody>${last.map(m=>`<tr><td>${m.fecha}</td><td>${esc(prod(m.producto)?.codigo)} ${esc(prod(m.producto)?.nombre)}</td><td><span class="tag t-${m.tipo}">${m.tipo}</span></td><td>${m.cantidad}</td></tr>`).join("")}</tbody></table></div></div>`}
function kf(v,e){ui[v]={...(ui[v]||{}),est:e,q:"",cat:""};go(v)}
function chart1(){const days=[];for(let i=13;i>=0;i--)days.push(dAgo(i));
const d=days.map(x=>{let e=0,s=0;S.movimientos.forEach(m=>{if(m.fecha==x&&!m.anulado){if(m.tipo=="Entrada")e+=m.cantidad;if(m.tipo=="Salida")s+=m.cantidad}});return[x,e,s]});
const mx=Math.max(1,...d.flatMap(x=>[x[1],x[2]])),W=560,H=200,bw=W/14;
let g="";d.forEach((x,i)=>{const h1=x[1]/mx*(H-30),h2=x[2]/mx*(H-30);g+=`<rect x="${i*bw+4}" y="${H-20-h1}" width="${bw/2-5}" height="${h1}" fill="#3ecf74"><title>${x[0]} entradas ${x[1]}</title></rect><rect x="${i*bw+bw/2-1}" y="${H-20-h2}" width="${bw/2-5}" height="${h2}" fill="#ff7a1a"><title>${x[0]} salidas ${x[2]}</title></rect><text x="${i*bw+bw/2}" y="${H-6}" fill="#9aa0a8" font-size="10" text-anchor="middle">${x[0].slice(8)}</text>`});
return`<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="0" x2="${W}" y1="${H-20}" y2="${H-20}" stroke="#555"/>${g}</svg><small style="color:#9aa0a8"><span style="color:#3ecf74">■</span> Entradas &nbsp;<span style="color:#ff7a1a">■</span> Salidas (unidades, día del mes)</small>`}
function chart2(){const d=CATS.map(c=>[c,S.productos.filter(p=>p.categoria==c).reduce((s,p)=>s+p.existencias*p.costo,0)]);const cats=S.categorias.map(c=>c.nombre);const dd=cats.map(c=>[c,S.productos.filter(p=>p.categoria==c).reduce((s,p)=>s+p.existencias*p.costo,0)]);
const mx=Math.max(1,...dd.map(x=>x[1]));
return`<svg viewBox="0 0 560 ${dd.length*28+4}" width="100%">${dd.map((x,i)=>`<text x="0" y="${i*28+17}" fill="#ececec" font-size="12">${esc(x[0].slice(0,22))}</text><rect x="160" y="${i*28+4}" width="${x[1]/mx*300}" height="18" rx="3" fill="#ff7a1a"/><text x="${166+x[1]/mx*300}" y="${i*28+18}" fill="#ececec" font-size="11">${money(x[1]).replace(/\.\d+$/,"")}</text>`).join("")}</svg>`}
function sortArr(a,key,dir){return a.sort((x,y)=>{let u=x[key],v=y[key];if(typeof u=="string")return u.localeCompare(v)*dir;return(u-v)*dir})}
function productos(){
const u=ui.productos=ui.productos||{q:"",cat:"",est:"",sk:"codigo",sd:1};
let a=S.productos.filter(p=>(!u.q||(p.codigo+" "+p.nombre).toLowerCase().includes(u.q.toLowerCase()))&&(!u.cat||p.categoria==u.cat)&&(!u.est||estado(p)==u.est));
sortArr(a,u.sk,u.sd);
const th=(k,l)=>`<th class="so" onclick="srt('${k}')">${l}${u.sk==k?(u.sd>0?" ▲":" ▼"):""}</th>`;
return`<div class="bar"><input placeholder="Buscar por código o nombre" value="${esc(u.q)}" oninput="ui.productos.q=this.value;tb()"><select onchange="ui.productos.cat=this.value;tb()"><option value="">Todas las categorías</option>${opts(CATS,u.cat)}</select><select onchange="ui.productos.est=this.value;tb()"><option value="">Todo estado</option>${opts(["OK","Bajo","Agotado"],u.est)}</select>${isAdm()?'<button class="btn" onclick="prodForm()">+ Nuevo producto</button>':""}</div><div id="conf"></div><div class="card"><div class="tw" id="tbp"></div></div>`+setTimeout(tb)&&""}
function srt(k){const u=ui.productos;if(u.sk==k)u.sd*=-1;else{u.sk=k;u.sd=1}tb()}
function tb(){const u=ui.productos;let a=S.productos.filter(p=>(!u.q||(p.codigo+" "+p.nombre).toLowerCase().includes(u.q.toLowerCase()))&&(!u.cat||p.categoria==u.cat)&&(!u.est||estado(p)==u.est));sortArr(a,u.sk,u.sd);
const th=(k,l)=>`<th class="so" onclick="srt('${k}')">${l}${u.sk==k?(u.sd>0?" ▲":" ▼"):""}</th>`;
$("#tbp").innerHTML=`<table><thead><tr>${th("codigo","Código")}${th("nombre","Nombre")}${th("categoria","Categoría")}${th("existencias","Exist.")}${th("minimo","Mín.")}${th("costo","Costo")}${th("precio","Precio")}<th>Estado</th>${isAdm()?"<th></th>":""}</tr></thead><tbody>${a.map(p=>`<tr class="cl" onclick="ficha('${p.id}')"><td><b>${esc(p.codigo)}</b></td><td>${esc(p.nombre)}</td><td>${esc(p.categoria)}</td><td>${p.existencias}</td><td>${p.minimo}</td><td>${money(p.costo)}</td><td>${money(p.precio)}</td><td>${tagE(estado(p))}</td>${isAdm()?`<td onclick="event.stopPropagation()"><button class="btn s sm" onclick="prodForm('${p.id}')">Editar</button> <button class="btn d sm" onclick="askDel('productos','${p.id}')">Borrar</button></td>`:""}</tr>`).join("")||'<tr><td colspan="9" class="empty">Sin resultados</td></tr>'}</tbody></table>`}
function askDel(ent,id){const rec=S[ent].find(x=>x.id==id);const n=rec.nombre||rec.empresa;
if(ent=="categorias"&&S.productos.some(p=>p.categoria==rec.nombre)){toast("No se puede eliminar: tiene productos");return}
const c=$("#conf");if(!c)return;c.innerHTML=`<div class="confirm"><span>¿Eliminar <b>${esc(n)}</b>? No se puede deshacer.</span><button class="btn d sm" onclick="doDel('${ent}','${id}')">Sí, eliminar</button><button class="btn s sm" onclick="$('#conf').innerHTML=''">Cancelar</button></div>`;c.scrollIntoView({block:"center"})}
function doDel(ent,id){if(ent=="productos")S.movimientos=S.movimientos.filter(m=>m.producto!=id);S[ent]=S[ent].filter(x=>x.id!=id);save();toast("Eliminado");render()}
function prodForm(id){const p=id?prod(id):{codigo:"",nombre:"",categoria:S.categorias[0]?.nombre,proveedor:S.proveedores[0]?.empresa,unidad:"pieza",costo:"",precio:"",existencias:0,minimo:S.cfg.umbral};
const inp=(k,l,t="text",w="")=>`<div class="${w}"><label>${l}<input id="f_${k}" type="${t}" ${t=="number"?'min="0" step="any"':""} value="${esc(p[k])}"></label></div>`;
modal(`<h2>${id?"Editar":"Nuevo"} producto</h2><div class="fg">${inp("codigo","Código")}${inp("nombre","Nombre")}<div><label>Categoría<select id="f_categoria">${opts(S.categorias.map(c=>c.nombre),p.categoria)}</select></label></div><div><label>Proveedor<select id="f_proveedor">${opts(S.proveedores.map(c=>c.empresa),p.proveedor)}</select></label></div><div><label>Unidad<select id="f_unidad">${opts(UNI,p.unidad)}</select></label></div>${inp("costo","Costo unitario","number")}${inp("precio","Precio de venta","number")}${inp("existencias",id?"Existencias":"Existencias iniciales","number")}${inp("minimo","Stock mínimo","number")}</div><div class="err" id="er"></div><div class="acts"><button class="btn s" onclick="closeM()">Cancelar</button><button class="btn" onclick="prodSave('${id||""}')">Guardar</button></div>`)}
function prodSave(id){const g=k=>$("#f_"+k).value.trim();const o={codigo:g("codigo").toUpperCase(),nombre:g("nombre"),categoria:g("categoria"),proveedor:g("proveedor"),unidad:g("unidad"),costo:parseFloat(g("costo")),precio:parseFloat(g("precio")),existencias:parseFloat(g("existencias")),minimo:parseFloat(g("minimo"))};
let e="";if(!o.codigo||!o.nombre)e="Código y nombre son obligatorios.";else if(S.productos.some(p=>p.codigo==o.codigo&&p.id!=id))e="El código ya existe.";else if([o.costo,o.precio,o.existencias,o.minimo].some(n=>isNaN(n)||n<0)||!(o.costo>0)||!(o.precio>0))e="Costo y precio deben ser mayores a 0; existencias y mínimo no negativos.";
if(e){$("#er").textContent=e;return}
if(id)Object.assign(prod(id),o);else S.productos.push({id:"p"+uid(),...o});save();closeM();toast("Producto guardado");render()}
function ficha(id){const p=prod(id);if(!p)return;const h=S.movimientos.filter(m=>m.producto==id).sort((a,b)=>a.fecha<b.fecha?1:-1);const mg=p.precio-p.costo;
modal(`<h2>${esc(p.codigo)} · ${esc(p.nombre)}</h2><div class="dl"><div><small>Estado</small>${tagE(estado(p))}</div><div><small>Categoría</small>${esc(p.categoria)}</div><div><small>Proveedor</small>${esc(p.proveedor)}</div><div><small>Existencias</small>${p.existencias} ${p.unidad}</div><div><small>Mínimo</small>${p.minimo}</div><div><small>Costo / Precio</small>${money(p.costo)} / ${money(p.precio)}</div><div><small>Margen</small>${(mg/p.precio*100).toFixed(1)}% (${money(mg)})</div><div><small>Valor en stock</small>${money(p.existencias*p.costo)}</div></div><h3>Historial</h3><div class="tw"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Cant.</th><th>Motivo</th></tr></thead><tbody>${h.map(m=>`<tr><td>${m.fecha}</td><td><span class="tag t-${m.anulado?"an":m.tipo}">${m.anulado?"Anulado":m.tipo}</span></td><td>${m.cantidad}</td><td>${esc(m.motivo)}</td></tr>`).join("")||'<tr><td colspan="4" class="empty">Sin movimientos</td></tr>'}</tbody></table></div><div class="acts"><button class="btn" onclick="movForm('${p.id}')">Registrar movimiento</button><button class="btn s" onclick="closeM()">Cerrar</button></div>`)}
function movForm(pid){modal(`<h2>Registrar movimiento</h2><div class="fg"><div><label>Tipo<select id="m_tipo" onchange="mtip()">${opts(["Entrada","Salida","Ajuste"],"Entrada")}</select></label></div><div><label>Fecha<input id="m_fecha" type="date" value="${today()}"></label></div><div class="w"><label>Buscar producto por código<input id="m_q" placeholder="Código o nombre" oninput="mfilt()"></label></div><div class="w"><label>Producto<select id="m_prod"></select></label></div><div><label><span id="m_cl">Cantidad</span><input id="m_cant" type="number" min="0" step="any"></label></div><div><label>Motivo<select id="m_mot">${opts(MOTIVOS,MOTIVOS[0])}</select></label></div><div class="w"><label>Nota<textarea id="m_nota" rows="2"></textarea></label></div></div><div class="err" id="er"></div><div class="acts"><button class="btn s" onclick="closeM()">Cancelar</button><button class="btn" onclick="movSave()">Guardar</button></div>`);mfilt(pid);if(pid)$("#m_prod").value=pid}
function mfilt(sel){const q=($("#m_q").value||"").toLowerCase();const cur=sel||$("#m_prod").value;const a=S.productos.filter(p=>(p.codigo+" "+p.nombre).toLowerCase().includes(q));$("#m_prod").innerHTML=a.map(p=>`<option value="${p.id}">${esc(p.codigo)} · ${esc(p.nombre)} (${p.existencias})</option>`).join("");if(a.some(p=>p.id==cur))$("#m_prod").value=cur}
function mtip(){const t=$("#m_tipo").value;$("#m_cl").textContent=t=="Ajuste"?"Existencias contadas":"Cantidad";$("#m_mot").value=t=="Entrada"?MOTIVOS[0]:t=="Salida"?MOTIVOS[1]:MOTIVOS[5]}
function movSave(){const tipo=$("#m_tipo").value,p=prod($("#m_prod").value),c=parseFloat($("#m_cant").value),f=$("#m_fecha").value;let e="";
if(!p)e="Selecciona un producto.";else if(!f)e="Indica la fecha.";else if(isNaN(c)||c<0||(tipo!="Ajuste"&&c<=0))e="Cantidad inválida.";else if(tipo=="Salida"&&c>p.existencias)e="Salida mayor a las existencias disponibles ("+p.existencias+").";
if(e){$("#er").textContent=e;return}
const m={id:"m"+uid(),fecha:f,producto:p.id,tipo,cantidad:c,motivo:$("#m_mot").value,nota:$("#m_nota").value,usuario:isAdm()?"Administrador":"Vendedor",anulado:false};
if(tipo=="Entrada")p.existencias+=c;else if(tipo=="Salida")p.existencias-=c;else{m.delta=c-p.existencias;p.existencias=c}
m.resultante=p.existencias;S.movimientos.push(m);save();closeM();toast("Movimiento registrado");render()}
function delta(m){return m.tipo=="Entrada"?m.cantidad:m.tipo=="Salida"?-m.cantidad:(m.delta??0)}
function movimientos(){const u=ui.movimientos=ui.movimientos||{tipo:"",d1:"",d2:"",p:""};
return`<div class="bar"><button class="btn" onclick="movForm()">+ Registrar entrada / salida</button></div><div class="bar"><select onchange="ui.movimientos.tipo=this.value;mt()"><option value="">Todos los tipos</option>${opts(["Entrada","Salida","Ajuste"],u.tipo)}</select><input type="date" value="${u.d1}" onchange="ui.movimientos.d1=this.value;mt()" aria-label="Desde"><input type="date" value="${u.d2}" onchange="ui.movimientos.d2=this.value;mt()" aria-label="Hasta"><select onchange="ui.movimientos.p=this.value;mt()"><option value="">Todos los productos</option>${S.productos.map(p=>`<option value="${p.id}" ${p.id==u.p?"selected":""}>${esc(p.codigo)}</option>`).join("")}</select></div><div id="conf"></div><div class="card"><div class="tw" id="tbm"></div></div>`+(setTimeout(mt),"")}
function mt(){const u=ui.movimientos;const a=S.movimientos.filter(m=>(!u.tipo||m.tipo==u.tipo)&&(!u.d1||m.fecha>=u.d1)&&(!u.d2||m.fecha<=u.d2)&&(!u.p||m.producto==u.p)).sort((a,b)=>a.fecha<b.fecha?1:a.fecha>b.fecha?-1:0);
$("#tbm").innerHTML=`<table><thead><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cant.</th><th>Resultante</th><th>Motivo</th><th>Usuario</th>${isAdm()?"<th></th>":""}</tr></thead><tbody>${a.map(m=>{const p=prod(m.producto);return`<tr><td>${m.fecha}</td><td>${esc(p?.codigo)} ${esc(p?.nombre)}</td><td><span class="tag t-${m.anulado?"an":m.tipo}">${m.anulado?"Anulado":m.tipo}</span></td><td>${m.cantidad}</td><td>${m.resultante??"—"}</td><td>${esc(m.motivo)}</td><td>${m.usuario}</td>${isAdm()?`<td>${m.anulado?"":`<button class="btn d sm" onclick="askAnul('${m.id}')">Anular</button>`}</td>`:""}</tr>`}).join("")||'<tr><td colspan="8" class="empty">Sin movimientos</td></tr>'}</tbody></table>`}
function askAnul(id){$("#conf").innerHTML=`<div class="confirm"><span>¿Anular este movimiento? Se revertirá el stock.</span><button class="btn d sm" onclick="doAnul('${id}')">Sí, anular</button><button class="btn s sm" onclick="$('#conf').innerHTML=''">Cancelar</button></div>`}
function doAnul(id){const m=S.movimientos.find(x=>x.id==id),p=prod(m.producto);if(p){const n=p.existencias-delta(m);if(n<0){toast("No se puede anular: dejaría stock negativo");return}p.existencias=n}m.anulado=true;save();toast("Movimiento anulado");render()}
function proveedores(){const adm=isAdm();
const ped=S.proveedores.map(v=>{const it=S.productos.filter(p=>p.proveedor==v.empresa&&estado(p)!="OK");return{v,it,tot:it.reduce((s,p)=>s+sug(p)*p.costo,0)}}).filter(x=>x.it.length);
return`<div class="bar">${adm?'<button class="btn" onclick="provForm()">+ Nuevo proveedor</button>':""}</div><div id="conf"></div><div class="card" style="margin-bottom:14px"><h3>Directorio de proveedores</h3><div class="tw"><table><thead><tr><th>Empresa</th><th>Contacto</th><th>Teléfono</th><th>Correo</th><th>Entrega</th><th>Productos</th>${adm?"<th></th>":""}</tr></thead><tbody>${S.proveedores.map(v=>`<tr><td><b>${esc(v.empresa)}</b></td><td>${esc(v.contacto)}</td><td>${esc(v.telefono)}</td><td>${esc(v.email)}</td><td>${v.diasEntrega||"—"} d</td><td>${S.productos.filter(p=>p.proveedor==v.empresa).length}</td>${adm?`<td><button class="btn s sm" onclick="provForm('${v.id}')">Editar</button> <button class="btn d sm" onclick="askDel('proveedores','${v.id}')">Borrar</button></td>`:""}</tr>`).join("")}</tbody></table></div></div>
<div class="card"><h3>Sugerencia de pedido</h3>${ped.map(x=>`<div class="alert" style="align-items:flex-start"><div><b>${esc(x.v.empresa)}</b> · Total estimado ${money(x.tot)}<small>${x.it.map(p=>`${esc(p.codigo)} ${esc(p.nombre)}: ${sug(p)} ${p.unidad}`).join("<br>")}</small></div><div class="noprint"><button class="btn sm" onclick="cpy('${x.v.id}')">Copiar</button> <button class="btn s sm" onclick="prt('${x.v.id}')">Imprimir</button></div></div>`).join("")||'<div class="empty">No hay productos bajo mínimo</div>'}</div>`}
function ptxt(id){const v=S.proveedores.find(x=>x.id==id);const it=S.productos.filter(p=>p.proveedor==v.empresa&&estado(p)!="OK");return`Pedido a ${v.empresa} (${v.contacto})\nFecha: ${today()}\n\n`+it.map(p=>`- ${p.codigo} ${p.nombre}: ${sug(p)} ${p.unidad} (${money(sug(p)*p.costo)})`).join("\n")+`\n\nTotal estimado: ${money(it.reduce((s,p)=>s+sug(p)*p.costo,0))}`}
function cpy(id){const t=ptxt(id);if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast("Pedido copiado"),()=>shw(t));else shw(t)}
function shw(t){modal(`<h2>Pedido</h2><pre>${esc(t)}</pre><div class="acts"><button class="btn s" onclick="closeM()">Cerrar</button></div>`)}
function prt(id){modal(`<h2>Pedido</h2><pre>${esc(ptxt(id))}</pre><div class="acts noprint"><button class="btn" onclick="window.print()">Imprimir</button><button class="btn s" onclick="closeM()">Cerrar</button></div>`)}
function provForm(id){const p=id?S.proveedores.find(x=>x.id==id):{empresa:"",contacto:"",telefono:"",email:"",diasEntrega:"",notas:""};
const inp=(k,l,t="text")=>`<div><label>${l}<input id="f_${k}" type="${t}" value="${esc(p[k])}"></label></div>`;
modal(`<h2>${id?"Editar":"Nuevo"} proveedor</h2><div class="fg">${inp("empresa","Empresa")}${inp("contacto","Contacto")}${inp("telefono","Teléfono","tel")}${inp("email","Correo","email")}${inp("diasEntrega","Días de entrega","number")}<div class="w"><label>Notas<textarea id="f_notas" rows="2">${esc(p.notas)}</textarea></label></div></div><div class="err" id="er"></div><div class="acts"><button class="btn s" onclick="closeM()">Cancelar</button><button class="btn" onclick="provSave('${id||""}')">Guardar</button></div>`)}
function provSave(id){const g=k=>$("#f_"+k).value.trim();const o={empresa:g("empresa"),contacto:g("contacto"),telefono:g("telefono"),email:g("email"),diasEntrega:g("diasEntrega")===""?"":+g("diasEntrega"),notas:g("notas")};
if(!o.empresa||!o.contacto||!o.telefono){$("#er").textContent="Empresa, contacto y teléfono son obligatorios.";return}
if(o.email&&!/^\S+@\S+\.\S+$/.test(o.email)){$("#er").textContent="Correo no válido.";return}
if(id){const v=S.proveedores.find(x=>x.id==id);if(v.empresa!=o.empresa)S.productos.forEach(p=>{if(p.proveedor==v.empresa)p.proveedor=o.empresa});Object.assign(v,o)}else S.proveedores.push({id:"v"+uid(),...o});save();closeM();toast("Proveedor guardado");render()}
function categorias(){const adm=isAdm();return`<div class="bar">${adm?'<button class="btn" onclick="catForm()">+ Nueva categoría</button>':""}</div><div id="conf"></div><div class="card"><div class="tw"><table><thead><tr><th>Nombre</th><th>Descripción</th><th>Productos</th><th>Valor</th>${adm?"<th></th>":""}</tr></thead><tbody>${S.categorias.map(c=>{const ps=S.productos.filter(p=>p.categoria==c.nombre);return`<tr><td><b>${esc(c.nombre)}</b></td><td>${esc(c.descripcion)}</td><td>${ps.length}</td><td>${money(ps.reduce((s,p)=>s+p.existencias*p.costo,0))}</td>${adm?`<td><button class="btn s sm" onclick="catForm('${c.id}')">Editar</button> <button class="btn d sm" onclick="askDel('categorias','${c.id}')">Borrar</button></td>`:""}</tr>`}).join("")}</tbody></table></div></div>`}
function catForm(id){const c=id?S.categorias.find(x=>x.id==id):{nombre:"",descripcion:""};modal(`<h2>${id?"Editar":"Nueva"} categoría</h2><div class="fg"><div class="w"><label>Nombre<input id="f_nombre" value="${esc(c.nombre)}"></label></div><div class="w"><label>Descripción<textarea id="f_desc" rows="3">${esc(c.descripcion)}</textarea></label></div></div><div class="err" id="er"></div><div class="acts"><button class="btn s" onclick="closeM()">Cancelar</button><button class="btn" onclick="catSave('${id||""}')">Guardar</button></div>`)}
function catSave(id){const n=$("#f_nombre").value.trim(),d=$("#f_desc").value.trim();if(!n){$("#er").textContent="El nombre es obligatorio.";return}
if(S.categorias.some(c=>c.nombre.toLowerCase()==n.toLowerCase()&&c.id!=id)){$("#er").textContent="Ya existe esa categoría.";return}
if(id){const c=S.categorias.find(x=>x.id==id);S.productos.forEach(p=>{if(p.categoria==c.nombre)p.categoria=n});c.nombre=n;c.descripcion=d}else S.categorias.push({id:"c"+uid(),nombre:n,descripcion:d});save();closeM();toast("Categoría guardada");render()}
function ajustes(){const adm=isAdm();return`<div class="card" style="max-width:720px"><h3>Preferencias y rol</h3><div class="fg"><div><label>Rol activo<select onchange="S.cfg.rol=this.value;save();render()">${["administrador","vendedor"].map(r=>`<option ${r==S.cfg.rol?"selected":""}>${r}</option>`).join("")}</select></label></div><div><label>Moneda<select ${adm?"":"disabled"} onchange="S.cfg.moneda=this.value;save();render()">${["$","€","S/","Q"].map(r=>`<option ${r==S.cfg.moneda?"selected":""}>${r}</option>`).join("")}</select></label></div><div><label>Umbral mínimo por defecto<input type="number" min="0" ${adm?"":"disabled"} value="${S.cfg.umbral}" onchange="S.cfg.umbral=Math.max(0,+this.value||0);save();toast('Umbral guardado')"></label></div></div>
<div class="acts" style="justify-content:flex-start"><button class="btn" onclick="csv()">Exportar inventario a CSV</button><button class="btn s" onclick="expo()">Exportar datos (JSON)</button><button class="btn s" onclick="impo()">Importar</button>${adm?'<button class="btn d" onclick="askReset()">Restablecer datos de ejemplo</button>':""}</div><div id="conf"></div><div id="io"></div></div>`}
function expo(){$("#io").innerHTML=`<label style="color:#9aa0a8">Datos (JSON)</label><textarea id="jt" rows="8" readonly>${esc(JSON.stringify(S,null,1))}</textarea>`}
function impo(){$("#io").innerHTML=`<label style="color:#9aa0a8">Pega aquí el JSON a importar</label><textarea id="jt" rows="8"></textarea><div class="acts"><button class="btn" onclick="doImp()">Importar ahora</button></div>`}
function doImp(){try{const d=JSON.parse($("#jt").value);if(!d.productos||!d.movimientos||!d.proveedores||!d.categorias||!d.cfg)throw 0;S=d;save();toast("Datos importados");render()}catch(e){toast("JSON no válido")}}
function csv(){const r=[["Código","Nombre","Categoría","Proveedor","Unidad","Existencias","Mínimo","Costo","Precio","Estado"]].concat(S.productos.map(p=>[p.codigo,p.nombre,p.categoria,p.proveedor,p.unidad,p.existencias,p.minimo,p.costo,p.precio,estado(p)]));
const t=r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
try{const b=new Blob(["\ufeff"+t],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="inventario.csv";a.click()}catch(e){}
$("#io").innerHTML=`<label style="color:#9aa0a8">CSV</label><textarea rows="6" readonly>${esc(t)}</textarea>`}
function askReset(){$("#conf").innerHTML=`<div class="confirm"><span>¿Restablecer todos los datos de ejemplo? Se perderán tus cambios.</span><button class="btn d sm" onclick="S=seed();save();toast('Datos restablecidos');render()">Sí, restablecer</button><button class="btn s sm" onclick="$('#conf').innerHTML=''">Cancelar</button></div>`}
$("#gs").addEventListener("keydown",e=>{if(e.key!="Enter")return;const q=e.target.value.trim().toLowerCase();if(!q)return;const p=S.productos.find(x=>x.codigo.toLowerCase()==q)||S.productos.find(x=>x.codigo.toLowerCase().includes(q));if(p){e.target.value="";ficha(p.id)}else toast("Código no encontrado")});
(function fixSeed(){const byP={};S.movimientos.forEach(m=>{if(m.resultante===null){const p=prod(m.producto);if(!p)return;if(m.tipo=="Ajuste")m.delta=0;m.resultante=p.existencias}})})();
render();
</script>
</body>
</html>
