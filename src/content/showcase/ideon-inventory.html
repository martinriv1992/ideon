['ASE-001','Detergente en polvo 1 kg','Aseo','Paquete',7600,9900,100,400,260],['ASE-002','Jabón de baño x3','Aseo','Paquete',5200,7100,80,300,40],['ASE-003','Papel higiénico x12','Aseo','Paquete',13800,17900,120,500,600],['ASE-004','Cloro 1 L','Aseo','Litro',2900,4100,90,350,200],
['FER-001','Martillo de acero 16 oz','Ferretería','Unidad',18500,26900,20,80,45],['FER-002','Cinta métrica 5 m','Ferretería','Unidad',7400,10900,25,100,18],['FER-003','Caja de tornillos x100','Ferretería','Caja',9600,13900,30,120,70],['FER-004','Taladro inalámbrico 12 V','Ferretería','Unidad',148000,199000,5,20,12],
['PAP-001','Resma papel carta 500 h','Papelería','Paquete',11800,15900,60,240,130],['PAP-002','Cuaderno cuadriculado 100 h','Papelería','Unidad',3100,4500,150,600,300],['PAP-003','Bolígrafo azul caja x50','Papelería','Caja',16200,21900,20,90,110],['PAP-004','Marcadores permanentes x12','Papelería','Caja',12400,16900,25,100,55],
['LAC-001','Leche entera 1 L','Lácteos','Litro',3300,4400,250,900,500],['LAC-002','Queso campesino 500 g','Lácteos','Unidad',8900,11900,60,240,50],['LAC-003','Yogurt natural 1 L','Lácteos','Unidad',5600,7500,70,280,140],['LAC-004','Mantequilla 250 g','Lácteos','Unidad',6200,8300,40,160,80]];
D.productos=PR.map((p,i)=>({id:i+1,sku:p[0],codigo_barras:'770'+String(1000000000+i*7919),nombre:p[1],categoria:p[2],unidad:p[3],costo:p[4],precio:p[5],stock_minimo:p[6],stock_maximo:p[7]}));
const mv=[];const add=(f,t,pi,o,d,c,mo,doc,rs)=>mv.push({fecha:f,tipo:t,producto:pi+1,bodega_origen:o,bodega_destino:d,cantidad:c,motivo:mo,responsable:rs,documento:doc});

for(let k=0;k<6;k++){const pi=pool[(k*3+4)%20],q=PR[pi][8],dl=k%2?-(1+k):(2+k),b=pi%4+1,f=ago(5+k*9);
add(f,'Ajuste',pi,dl<0?b:0,dl>0?b:0,Math.abs(dl),'Ajuste por conteo','AJ-'+(70+k),us[(k+1)%4]);
D.ajustes.push({id:k+1,fecha:f,bodega:b,producto:pi+1,stock_sistema:q,conteo_fisico:q+dl,motivo:'Conteo cíclico trimestral: diferencia verificada en estantería',responsable:us[(k+1)%4]})}
mv.sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0);D.movimientos=mv.map((m,i)=>({id:i+1,...m}));

const es=['Recibida','Recibida','Recibida','Recibida parcial','Enviada','Enviada','Enviada','Borrador','Borrador'];

function barChart(){const ms=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);ms.push({k:iso(d).slice(0,7),l:MES[d.getMonth()],i:0,o:0})}
S.movimientos.forEach(m=>{const x=ms.find(a=>a.k===m.fecha.slice(0,7));if(x){const[i,o]=flow(m,0);x.i+=i;x.o+=o}});
const mx=Math.max(1,...ms.flatMap(a=>[a.i,a.o]));let s=`<svg viewBox="0 0 520 230" width="100%" role="img" aria-label="Entradas contra salidas por mes"><line x1="10" x2="510" y1="190" y2="190" stroke="#E2E5EF"/>`;
ms.forEach((a,j)=>{const x=30+j*82,h1=a.i/mx*150,h2=a.o/mx*150;s+=`<rect x="${x}" y="${190-h1}" width="28" height="${h1}" rx="4" fill="#4338CA"/><rect x="${x+32}" y="${190-h2}" width="28" height="${h2}" rx="4" fill="#A5B4FC"/><text x="${x+14}" y="${186-h1}" font-size="10" text-anchor="middle" fill="#394056">${nf(a.i)}</text><text x="${x+46}" y="${186-h2}" font-size="10" text-anchor="middle" fill="#394056">${nf(a.o)}</text><text x="${x+30}" y="210" font-size="12" text-anchor="middle" fill="#6B7388">${a.l}</text>`});
return s+`</svg><div class="leg"><span><i style="background:#4338CA"></i>Entradas (unid.)</span><span><i style="background:#A5B4FC"></i>Salidas (unid.)</span></div>`}
const COL=['#4338CA','#818CF8','#0EA5E9','#14B8A6','#F59E0B','#EF4444'];
function donut(items){const t=items.reduce((a,b)=>a+b[1],0)||1,C=2*Math.PI*60;let acc=0,s=`<svg viewBox="0 0 180 180" width="170" height="170" role="img" aria-label="Valor por bodega"><g transform="rotate(-90 90 90)">`;
items.forEach((it,i)=>{const l=it[1]/t*C;s+=`<circle cx="90" cy="90" r="60" fill="none" stroke="${COL[i%6]}" stroke-width="26" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-acc}"/>`;acc+=l});
s+=`</g><text x="90" y="86" text-anchor="middle" font-size="11" fill="#6B7388">Total</text><text x="90" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2433">${cop(t).replace(/\s/g,' ')}</text></svg>`;
return`<div class="dn">${s}<div style="display:grid;gap:6px">${items.map((it,i)=>`<div class="leg"><span><i style="background:${COL[i%6]}"></i><b style="color:#1F2433">${esc(it[0])}</b> ${Math.round(it[1]/t*100)}%</span></div>`).join('')}</div></div>`}
function hbars(items,fmt){if(!items.length)return'<p class="sub">Sin datos para graficar</p>';const mx=Math.max(1,...items.map(i=>i[1])),H=items.length*28+6;
return`<svg viewBox="0 0 520 ${H}" width="100%" role="img" aria-label="Gráfico de barras horizontales">${items.map((it,i)=>{const w=Math.max(2,it[1]/mx*270),y=i*28+4;return`<text x="0" y="${y+15}" font-size="12" fill="#394056">${esc(it[0].length>22?it[0].slice(0,21)+'…':it[0])}</text><rect x="160" y="${y+3}" width="${w}" height="16" rx="4" fill="${COL[0]}" opacity="${1-i*.04}"/><text x="${166+w}" y="${y+16}" font-size="11" fill="#6B7388">${fmt(it[1])}</text>`}).join('')}</svg>`}

const MOT={Entrada:['Compra','Devolución'],Salida:['Venta','Merma','Devolución'],Traslado:['Traslado']};
const opts=(a,sv)=>a.map(x=>{const[v,l]=Array.isArray(x)?x:[x,x];return`<option value="${esc(v)}"${String(v)===String(sv)?' selected':''}>${esc(l)}</option>`}).join('');
const movForm=()=>`<section class="card"><h2>Registrar movimiento</h2><div class="g2"><label class="fl"><span>Fecha *</span><input id="m_f" type="date" value="${TODAY}" max="${TODAY}"></label><label class="fl"><span>Tipo *</span><select id="m_t" onchange="A.mt()"><option>Entrada</option><option>Salida</option><option>Traslado</option></select></label><label class="fl"><span>Producto *</span><select id="m_p" onchange="A.mt()">${opts(opP())}</select></label><label class="fl"><span>Cantidad *</span><input id="m_c" type="number" min="1" step="1" value="1"></label><label class="fl" id="w_o"><span>Bodega origen *</span><select id="m_o" onchange="A.mt()">${opts(opB())}</select></label><label class="fl" id="w_d"><span>Bodega destino *</span><select id="m_d">${opts(opB())}</select></label><label class="fl"><span>Motivo *</span><select id="m_m"></select></label><label class="fl"><span>Responsable *</span><input id="m_r" value="${esc(me())}"></label><label class="fl f"><span>Documento de referencia</span><input id="m_x" placeholder="Ej. FC-2201"></label></div><div id="er" class="err"></div><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="b p" onclick="A.msave()">Registrar movimiento de inventario</button><span id="disp" class="sub" style="margin:0"></span></div></section>`;
A.mt=()=>{const t=$('#m_t').value;$('#w_o').style.display=t==='Entrada'?'none':'';$('#w_d').style.display=t==='Salida'?'none':'';const cur=$('#m_m').value;$('#m_m').innerHTML=opts(MOT[t],cur);if(t!=='Entrada')$('#disp').textContent='Disponible en origen: '+nf(stk(+$('#m_p').value,+$('#m_o').value))+' u.';else $('#disp').textContent=''};
A.msave=()=>{const t=$('#m_t').value,p=+$('#m_p').value,c=+$('#m_c').value,o=+$('#m_o').value,d=+$('#m_d').value,r=$('#m_r').value.trim(),f=$('#m_f').value;
if(!f)return err('La fecha es obligatoria');if(!(c>0)||!Number.isInteger(c))return err('La cantidad debe ser un entero mayor a 0');if(!r)return err('El responsable es obligatorio');
if(t==='Traslado'&&o===d)return err('La bodega origen y destino deben ser distintas');
if(t!=='Entrada'&&stk(p,o)<c)return err(`Stock insuficiente en ${B(o).nombre}: disponible ${nf(stk(p,o))} u.`);
S.movimientos.push({id:++S.seq,fecha:f,tipo:t,producto:p,bodega_origen:t==='Entrada'?0:o,bodega_destino:t==='Salida'?0:d,cantidad:c,motivo:$('#m_m').value,responsable:r,documento:$('#m_x').value.trim()});save();render();toast('Movimiento registrado y existencias actualizadas')};
V.movimientos=()=>`<h1>Movimientos</h1><p class="sub">Entradas, salidas y traslados entre bodegas.</p>${can('mov')?movForm():`<div class="note">El rol ${S.role} solo puede consultar el historial de movimientos.</div>`}<section class="card"><h2>Historial de movimientos</h2><div class="fb">${sel('mt',['Entrada','Salida','Traslado','Ajuste'],'Todos los tipos')}${sel('mb',opB(),'Todas las bodegas')}${sel('mp',opP(),'Todos los productos')}${inp('md1','date','Desde')}${inp('md2','date','Hasta')}<span style="flex:1"></span><button class="b" onclick="A.mcsv()">Exportar CSV</button></div><div id="tbl"></div></section>`;
const getM=()=>S.movimientos.filter(m=>(!fv('mt')||m.tipo===fv('mt'))&&(!fv('mb')||m.bodega_origen==fv('mb')||m.bodega_destino==fv('mb'))&&(!fv('mp')||m.producto==fv('mp'))&&(!fv('md1')||m.fecha>=fv('md1'))&&(!fv('md2')||m.fecha<=fv('md2'))).sort((a,b)=>a.fecha<b.fecha?1:a.fecha>b.fecha?-1:b.id-a.id);
T.movimientos=()=>{const r=getM();return`<p class="sub">${r.length} movimientos${r.length>100?' (se muestran los 100 más recientes)':''}</p>`+tbl(['<th>Fecha</th>','<th>Tipo</th>','<th>Producto</th>','<th>Origen</th>','<th>Destino</th>','<th class="r">Cant.</th>','<th>Motivo</th>','<th>Responsable</th>','<th>Documento</th>'],r.slice(0,100).map(m=>`<tr><td>${m.fecha}</td><td><span class="bd ${m.tipo==='Entrada'?'ok':m.tipo==='Salida'?'bajo':m.tipo==='Ajuste'?'sobre':'i'}">${m.tipo}</span></td><td>${esc(P(m.producto).nombre)}</td><td>${m.bodega_origen?esc(B(m.bodega_origen).nombre):'—'}</td><td>${m.bodega_destino?esc(B(m.bodega_destino).nombre):'—'}</td><td class="r">${nf(m.cantidad)}</td><td>${m.motivo}</td><td>${esc(m.responsable)}</td><td>${esc(m.documento||'—')}</td></tr>`))};
A.mcsv=()=>csv('movimientos',['Fecha','Tipo','SKU','Producto','Origen','Destino','Cantidad','Motivo','Responsable','Documento'],getM().map(m=>[m.fecha,m.tipo,P(m.producto).sku,P(m.producto).nombre,m.bodega_origen?B(m.bodega_origen).nombre:'',m.bodega_destino?B(m.bodega_destino).nombre:'',m.cantidad,m.motivo,m.responsable,m.documento]));

V.kardex=()=>{if(!fv('kp'))ui.f.kp=String(S.productos[0].id);return`<h1>Kardex</h1><p class="sub">Movimientos cronológicos con saldo corrido por producto.</p><section class="card"><div class="fb"><select data-f="kp" aria-label="Producto">${opts(opP(),fv('kp'))}</select>${sel('kb',opB(),'Todas las bodegas')}<span style="flex:1"></span><button class="b" onclick="A.kcsv()">Exportar CSV</button></div><div id="tbl"></div></section>`};
function kdx(){const pid=+fv('kp'),b=+fv('kb'),p=P(pid);let s=0;const rows=[];
S.movimientos.filter(m=>m.producto===pid).sort((a,c)=>a.fecha<c.fecha?-1:a.fecha>c.fecha?1:a.id-c.id).forEach(m=>{
if(m.bodega_destino&&(!b||m.bodega_destino===b)){s+=m.cantidad;rows.push([m.fecha,m.documento||'—',m.tipo,B(m.bodega_destino).nombre,m.cantidad,'',s,p.costo])}
if(m.bodega_origen&&(!b||m.bodega_origen===b)){s-=m.cantidad;rows.push([m.fecha,m.documento||'—',m.tipo,B(m.bodega_origen).nombre,'',m.cantidad,s,p.costo])}});
return{rows,saldo:s,p}}
T.kardex=()=>{const k=kdx();return`<p class="sub"><b>${esc(k.p.nombre)}</b> · Saldo ${nf(k.saldo)} ${k.p.unidad.toLowerCase()}(s) · Valor ${cop(k.saldo*k.p.costo)}</p>`+tbl(['<th>Fecha</th>','<th>Documento</th>','<th>Tipo</th>','<th>Bodega</th>','<th class="r">Entrada</th>','<th class="r">Salida</th>','<th class="r">Saldo</th>','<th class="r">Costo unit.</th>'],k.rows.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td>${r[2]}</td><td>${esc(r[3])}</td><td class="r" style="color:var(--ok)">${r[4]===''?'':nf(r[4])}</td><td class="r" style="color:var(--lo)">${r[5]===''?'':nf(r[5])}</td><td class="r"><b>${nf(r[6])}</b></td><td class="r">${cop(r[7])}</td></tr>`))};
A.kcsv=()=>csv('kardex-'+P(+fv('kp')).sku,['Fecha','Documento','Tipo','Bodega','Entrada','Salida','Saldo','Costo'],kdx().rows);

V.proveedores=()=>`<h1>Proveedores</h1><p class="sub">Directorio de proveedores y volumen de compra.</p><section class="card"><div class="fb">${inp('vq','search','Buscar proveedor o NIT')}<span style="flex:1"></span>${can('prov')?'<button class="b p" onclick="A.vnew()">+ Nuevo proveedor</button>':''}</div><div id="tbl"></div></section>`;
T.proveedores=()=>{const q=fv('vq').toLowerCase();return tbl(['<th>Razón social</th>','<th>NIT</th>','<th>Contacto</th>','<th>Teléfono</th>','<th>Correo</th>','<th>Plazo</th>','<th class="r">Total comprado</th>','<th></th>'],S.proveedores.filter(v=>!q||(v.razon_social+v.nit).toLowerCase().includes(q)).map(v=>`<tr><td><b>${esc(v.razon_social)}</b></td><td>${esc(v.nit)}</td><td>${esc(v.contacto)}</td><td>${esc(v.telefono||'—')}</td><td>${esc(v.email||'—')}</td><td>${v.plazo_pago}</td><td class="r">${cop(S.ordenes.filter(o=>o.proveedor===v.id&&o.estado!=='Borrador').reduce((a,o)=>a+ordTot(o),0))}</td><td>${can('prov')?`<button class="b s" onclick="A.vedit(${v.id})">Editar</button><button class="b s d" onclick="A.vdel(${v.id})">Eliminar</button>`:''}</td></tr>`))};
const vf=()=>[ff('razon_social','Razón social','text',1),ff('nit','NIT','text',1),ff('contacto','Contacto','text',1),ff('telefono','Teléfono','phone'),ff('email','Correo','email'),ff('plazo_pago','Plazo de pago','select',1,['Contado','15 días','30 días','60 días'])];
const vSave=id=>o=>{if(S.proveedores.some(v=>v.id!==id&&v.nit===o.nit))return'Ya existe un proveedor con ese NIT';upsert(S.proveedores,id,o,id?'Proveedor actualizado':'Proveedor creado')};
A.vnew=()=>openForm('Nuevo proveedor',vf(),{plazo_pago:'30 días'},vSave(0));
A.vedit=id=>openForm('Editar proveedor',vf(),PV(id),vSave(id));
A.vdel=id=>{if(S.ordenes.some(o=>o.proveedor===id))return toast('No se puede eliminar: el proveedor tiene órdenes de compra');ask(`¿Eliminar a <b>${esc(PV(id).razon_social)}</b>?`,()=>{S.proveedores=S.proveedores.filter(v=>v.id!==id);save();render();toast('Proveedor eliminado')})};

V.ordenes=()=>`<h1>Órdenes de compra</h1><p class="sub">Del borrador a la recepción de mercancía en bodega.</p><section class="card"><div class="fb">${sel('oe',['Borrador','Enviada','Recibida parcial','Recibida'],'Todos los estados')}${sel('op',S.proveedores.map(v=>[v.id,v.razon_social]),'Todos los proveedores')}<span style="flex:1"></span>${can('ord')?'<button class="b p" onclick="A.onew()">+ Nueva orden</button>':''}</div><div id="tbl"></div></section>`;
const EB={Borrador:'n',Enviada:'i','Recibida parcial':'sobre',Recibida:'ok'};
T.ordenes=()=>tbl(['<th>Número</th>','<th>Proveedor</th>','<th>Fecha</th>','<th class="r">Total</th>','<th>Bodega destino</th>','<th>Estado</th>','<th></th>'],S.ordenes.filter(o=>(!fv('oe')||o.estado===fv('oe'))&&(!fv('op')||o.proveedor==fv('op'))).sort((a,b)=>b.id-a.id).map(o=>`<tr><td><b>${o.numero}</b></td><td>${esc(PV(o.proveedor).razon_social)}</td><td>${o.fecha}</td><td class="r">${cop(ordTot(o))}</td><td>${esc(B(o.bodega_destino).nombre)}</td><td><span class="bd ${EB[o.estado]}">${o.estado}</span></td><td><button class="b s" onclick="A.over(${o.id})">${can('recv')&&(o.estado==='Enviada'||o.estado==='Recibida parcial')?'Recibir':'Detalle'}</button>${o.estado==='Borrador'&&can('ord')?`<button class="b s" onclick="A.oedit(${o.id})">Editar</button><button class="b s p" onclick="A.osend(${o.id})">Enviar</button><button class="b s d" onclick="A.odel(${o.id})">Eliminar</button>`:''}</td></tr>`));
function ordForm(){const d=ui.od;return`<h3>${d.id?'Editar orden '+esc(d.numero):'Nueva orden de compra'}</h3><div class="g2"><label class="fl"><span>Proveedor *</span><select onchange="A.oh('proveedor',this.value)">${opts(S.proveedores.map(v=>[v.id,v.razon_social]),d.proveedor)}</select></label><label class="fl"><span>Bodega destino *</span><select onchange="A.oh('bodega_destino',this.value)">${opts(opB(),d.bodega_destino)}</select></label><label class="fl"><span>Fecha *</span><input type="date" value="${d.fecha}" onchange="A.oh('fecha',this.value)"></label><label class="fl"><span>Notas</span><input value="${esc(d.notas)}" oninput="A.oh('notas',this.value)"></label></div><h2 style="margin-top:16px">Líneas de producto</h2><div id="ol">${ordLines()}</div><button class="b s" onclick="A.ola()">+ Agregar línea</button><div style="text-align:right;font-size:16px;margin-top:10px">Total: <b id="ot">${cop(ordTot(d))}</b></div><div id="er" class="err"></div><div class="ac"><button class="b g" onclick="X()">Cancelar</button><button class="b" onclick="A.osave(0)">Guardar borrador</button><button class="b p" onclick="A.osave(1)">Enviar orden</button></div>`}
const ordLines=()=>ui.od.lineas.map((l,i)=>`<div style="display:grid;grid-template-columns:3fr 1fr 1.3fr 1.3fr auto;gap:6px;margin-bottom:6px;align-items:center"><select onchange="A.olp(${i},this.value)">${opts(opP(),l.producto)}</select><input type="number" min="1" step="1" value="${l.cantidad}" oninput="A.olq(${i},'cantidad',this.value)" aria-label="Cantidad"><input type="number" min="0" step="any" value="${l.costo}" oninput="A.olq(${i},'costo',this.value)" aria-label="Costo unitario"><b id="sub${i}" style="text-align:right">${cop(l.cantidad*l.costo)}</b><button class="b s d" onclick="A.old(${i})" aria-label="Quitar línea">✕</button></div>`).join('');
const ordOpen=d=>{ui.od=d;M(ordForm(),1)};
A.onew=()=>ordOpen({id:0,proveedor:S.proveedores[0].id,bodega_destino:S.bodegas[0].id,fecha:TODAY,notas:'',lineas:[{producto:S.productos[0].id,cantidad:10,costo:S.productos[0].costo,recibida:0}]});
A.oc=pid=>{const p=P(pid);ordOpen({id:0,proveedor:S.proveedores[0].id,bodega_destino:S.bodegas[0].id,fecha:TODAY,notas:'Reposición por alerta de stock bajo',lineas:[{producto:pid,cantidad:Math.max(1,p.stock_maximo-tot(pid)),costo:p.costo,recibida:0}]})};
A.oedit=id=>ordOpen(JSON.parse(JSON.stringify(S.ordenes.find(o=>o.id===id))));
A.oh=(k,v)=>{ui.od[k]=(k==='proveedor'||k==='bodega_destino')?+v:v};
A.ola=()=>{ui.od.lineas.push({producto:S.productos[0].id,cantidad:10,costo:S.productos[0].costo,recibida:0});$('#ol').innerHTML=ordLines();$('#ot').textContent=cop(ordTot(ui.od))};
A.olp=(i,v)=>{const l=ui.od.lineas[i];l.producto=+v;l.costo=P(v).costo;$('#ol').innerHTML=ordLines();$('#ot').textContent=cop(ordTot(ui.od))};
A.olq=(i,k,v)=>{const l=ui.od.lineas[i];l[k]=+v||0;$('#sub'+i).textContent=cop(l.cantidad*l.costo);$('#ot').textContent=cop(ordTot(ui.od))};
A.old=i=>{ui.od.lineas.splice(i,1);$('#ol').innerHTML=ordLines();$('#ot').textContent=cop(ordTot(ui.od))};
A.osave=send=>{const d=ui.od;if(!d.fecha)return err('La fecha es obligatoria');if(!d.lineas.length)return err('Agrega al menos una línea');if(d.lineas.some(l=>!(l.cantidad>0)||!Number.isInteger(l.cantidad)||l.costo<0))return err('Cada línea requiere una cantidad entera mayor a 0 y un costo válido');
if(d.id){Object.assign(S.ordenes.find(o=>o.id===d.id),{proveedor:d.proveedor,bodega_destino:d.bodega_destino,fecha:d.fecha,notas:d.notas,lineas:d.lineas,estado:send?'Enviada':'Borrador'})}
else S.ordenes.push({id:++S.seq,numero:'OC-'+String(S.ordenes.reduce((m,o)=>Math.max(m,parseInt(o.numero.slice(3))||0),0)+1).padStart(4,'0'),proveedor:d.proveedor,bodega_destino:d.bodega_destino,fecha:d.fecha,estado:send?'Enviada':'Borrador',notas:d.notas,responsable:me(),lineas:d.lineas});
save();X();render();toast(send?'Orden enviada al proveedor':'Borrador guardado')};
A.osend=id=>{S.ordenes.find(o=>o.id===id).estado='Enviada';save();render();toast('Orden enviada')};
A.odel=id=>ask('¿Eliminar este borrador de orden de compra?',()=>{S.ordenes=S.ordenes.filter(o=>o.id!==id);save();render();toast('Borrador eliminado')});
A.over=id=>{const o=S.ordenes.find(x=>x.id===id),rc=can('recv')&&(o.estado==='Enviada'||o.estado==='Recibida parcial');
M(`<h3>${o.numero} <span class="bd ${EB[o.estado]}">${o.estado}</span></h3><p class="sub">${esc(PV(o.proveedor).razon_social)} · Destino: ${esc(B(o.bodega_destino).nombre)} · ${o.fecha}${o.notas?' · '+esc(o.notas):''}</p>`+tbl(['<th>Producto</th>','<th class="r">Pedida</th>','<th class="r">Recibida</th>','<th class="r">Pendiente</th>','<th class="r">Costo</th>',rc?'<th>Recibir ahora</th>':''],o.lineas.map((l,i)=>`<tr><td>${esc(P(l.producto).nombre)}</td><td class="r">${nf(l.cantidad)}</td><td class="r">${nf(l.recibida)}</td><td class="r">${nf(l.cantidad-l.recibida)}</td><td class="r">${cop(l.costo)}</td>${rc?`<td><input id="rc${i}" type="number" min="0" max="${l.cantidad-l.recibida}" value="${l.cantidad-l.recibida}" style="width:90px"></td>`:''}</tr>`))+`<p style="text-align:right">Total: <b>${cop(ordTot(o))}</b></p><div id="er" class="err"></div><div class="ac"><button class="b g" onclick="X()">Cerrar</button>${rc?`<button class="b p" onclick="A.orec(${id})">Confirmar recepción</button>`:''}</div>`,1)};
A.orec=id=>{const o=S.ordenes.find(x=>x.id===id),q=o.lineas.map((l,i)=>+$('#rc'+i).value||0);
if(q.some((x,i)=>x<0||!Number.isInteger(x)||x>o.lineas[i].cantidad-o.lineas[i].recibida))return err('Las cantidades deben ser enteras y no superar lo pendiente');if(!q.some(x=>x>0))return err('Ingresa al menos una cantidad recibida');
o.lineas.forEach((l,i)=>{if(q[i]>0){l.recibida+=q[i];S.movimientos.push({id:++S.seq,fecha:TODAY,tipo:'Entrada',producto:l.producto,bodega_origen:0,bodega_destino:o.bodega_destino,cantidad:q[i],motivo:'Compra',responsable:me(),documento:o.numero})}});
o.estado=o.lineas.every(l=>l.recibida>=l.cantidad)?'Recibida':'Recibida parcial';save();X();render();toast('Recepción registrada: existencias actualizadas')};

V.ajustes=()=>{if(!fv('ab'))ui.f.ab=String(S.bodegas[0].id);const h=S.ajustes.slice().sort((a,b)=>a.fecha<b.fecha?1:a.fecha>b.fecha?-1:b.id-a.id);
return`<h1>Ajustes de inventario</h1><p class="sub">Conteo físico contra stock del sistema.</p>${can('aj')?`<section class="card"><h2>Conteo físico</h2><div class="g2"><label class="fl"><span>Bodega *</span><select data-f="ab">${opts(opB(),fv('ab'))}</select></label><label class="fl"><span>Responsable *</span><input id="a_r" value="${esc(me())}"></label><label class="fl f"><span>Motivo del ajuste *</span><textarea id="a_m" style="min-height:60px;font-family:inherit;font-size:14px" placeholder="Ej. Conteo cíclico mensual, mercancía dañada…"></textarea></label></div><div id="tbl" style="margin-top:12px"></div><div id="er" class="err"></div><div class="ac"><button class="b p" onclick="A.aap()">Aplicar ajuste</button></div></section>`:`<div class="note">Solo administrador y bodeguero pueden realizar conteos.</div>`}<section class="card"><h2>Historial de ajustes</h2>${tbl(['<th>Fecha</th>','<th>Bodega</th>','<th>Producto</th>','<th class="r">Sistema</th>','<th class="r">Conteo</th>','<th class="r">Diferencia</th>','<th class="r">Valor</th>','<th>Responsable</th>','<th>Motivo</th>'],h.map(a=>{const d=a.conteo_fisico-a.stock_sistema;return`<tr><td>${a.fecha}</td><td>${esc(B(a.bodega).nombre)}</td><td>${esc(P(a.producto).nombre)}</td><td class="r">${nf(a.stock_sistema)}</td><td class="r">${nf(a.conteo_fisico)}</td><td class="r" style="color:${d<0?'var(--lo)':'var(--ok)'}">${d>0?'+':''}${d}</td><td class="r">${cop(d*P(a.producto).costo)}</td><td>${esc(a.responsable)}</td><td style="white-space:normal;min-width:200px">${esc(a.motivo)}</td></tr>`}))}</section>`};
T.ajustes=()=>{const b=+fv('ab');return tbl(['<th>Producto</th>','<th class="r">Stock sistema</th>','<th>Conteo físico</th>','<th class="r">Diferencia</th>','<th class="r">Valor diferencia</th>'],S.productos.map(p=>`<tr><td>${esc(p.sku)} · ${esc(p.nombre)}</td><td class="r">${nf(stk(p.id,b))}</td><td><input type="number" min="0" step="1" id="c${p.id}" oninput="A.cnt(${p.id})" style="width:100px"></td><td class="r" id="cd${p.id}">—</td><td class="r" id="cv${p.id}">—</td></tr>`))};
A.cnt=pid=>{const v=$('#c'+pid).value,b=+fv('ab');if(v===''){$('#cd'+pid).textContent='—';$('#cv'+pid).textContent='—';return}const d=+v-stk(pid,b);$('#cd'+pid).innerHTML=`<b style="color:${d<0?'var(--lo)':d>0?'var(--ok)':'inherit'}">${d>0?'+':''}${d}</b>`;$('#cv'+pid).textContent=cop(d*P(pid).costo)};
A.aap=()=>{const b=+fv('ab'),m=$('#a_m').value.trim(),r=$('#a_r').value.trim();if(!m)return err('El motivo del ajuste es obligatorio');if(!r)return err('El responsable es obligatorio');
const ch=[];for(const p of S.productos){const v=$('#c'+p.id).value;if(v==='')continue;const c=+v;if(!Number.isInteger(c)||c<0)return err('Conteo no válido en '+p.nombre);const s=stk(p.id,b);if(c!==s)ch.push({p,s,c})}
if(!ch.length)return err('No hay diferencias para aplicar: ingresa conteos distintos al stock del sistema');
ch.forEach(x=>{const d=x.c-x.s;S.movimientos.push({id:++S.seq,fecha:TODAY,tipo:'Ajuste',producto:x.p.id,bodega_origen:d<0?b:0,bodega_destino:d>0?b:0,cantidad:Math.abs(d),motivo:'Ajuste por conteo',responsable:r,documento:'AJ-'+S.seq});S.ajustes.push({id:++S.seq,fecha:TODAY,bodega:b,producto:x.p.id,stock_sistema:x.s,conteo_fisico:x.c,motivo:m,responsable:r})});
save();render();toast(ch.length+' ajuste(s) aplicado(s); stock igual al conteo')};

V.reportes=()=>`<h1>Reportes</h1><p class="sub">Filtra por fecha, bodega y categoría y exporta a CSV.</p><section class="card"><div class="fb">${sel('rt',[['val','Existencias valorizadas'],['mov','Movimientos'],['rot','Rotación'],['sin','Sin movimiento 60 días']],'Existencias valorizadas')}${inp('rd1','date','Desde')}${inp('rd2','date','Hasta')}${sel('rb',opB(),'Todas las bodegas')}${sel('rc',S.categorias.map(c=>c.nombre),'Todas las categorías')}<span style="flex:1"></span><button class="b" onclick="A.rcsv()">Exportar CSV</button></div><div id="tbl"></div></section>`;
function rep(){const t=fv('rt')||'val',b=+fv('rb'),d1=fv('rd1'),d2=fv('rd2'),ps=S.productos.filter(p=>!fv('rc')||p.categoria===fv('rc'));
const mv=S.movimientos.filter(m=>(!d1||m.fecha>=d1)&&(!d2||m.fecha<=d2));
const agg=p=>{let i=0,o=0,oc=0;mv.forEach(m=>{if(m.producto===p.id){const f=flow(m,b);i+=f[0];o+=f[1];if(m.tipo==='Salida'||(b&&m.bodega_origen==b))oc+=0}});return{i,o}};
const q=p=>b?stk(p.id,b):tot(p.id);
if(t==='val'){const r=ps.map(p=>[p.sku,p.nombre,p.categoria,q(p),p.costo,q(p)*p.costo]);return{head:['SKU','Producto','Categoría','Cantidad','Costo','Valor'],rows:r,fm:[0,0,0,1,2,2],ch:r.map(x=>[x[1],x[5]]),cf:cop,ti:'Valor de inventario por producto'}}
if(t==='mov'){const r=ps.map(p=>{const a=agg(p);return[p.sku,p.nombre,a.i,a.o,a.i-a.o]});return{head:['SKU','Producto','Entradas','Salidas','Neto'],rows:r,fm:[0,0,1,1,1],ch:r.map(x=>[x[1],x[2]+x[3]]),cf:n=>nf(n)+' u.',ti:'Volumen movido (entradas + salidas)'}}
if(t==='rot'){const r=ps.map(p=>{const a=agg(p),v=q(p)*p.costo;return[p.sku,p.nombre,a.o,a.o*p.costo,v,v?+(a.o*p.costo/v).toFixed(2):0]});return{head:['SKU','Producto','Unid. salidas','Costo salidas','Valor stock','Rotación (x)'],rows:r,fm:[0,0,1,2,2,0],ch:r.map(x=>[x[1],x[5]]),cf:n=>n.toFixed(2)+'x',ti:'Rotación por producto (costo de salidas / valor del stock)'}}
const ref=d2||TODAY;const r=ps.filter(p=>q(p)>0).map(p=>{const l=lastMov(p.id,b);return[p.sku,p.nombre,p.categoria,l||'—',l?dd(ref,l):999,q(p),q(p)*p.costo]}).filter(x=>x[4]>60).sort((a,c)=>c[4]-a[4]);
return{head:['SKU','Producto','Categoría','Último movimiento','Días','Stock','Valor'],rows:r,fm:[0,0,0,0,1,1,2],ch:r.map(x=>[x[1],x[6]]),cf:cop,ti:'Valor detenido por producto sin movimiento'}}
T.reportes=()=>{const r=rep(),f=[x=>esc(x),nf,cop];const top=r.ch.sort((a,b)=>b[1]-a[1]).slice(0,10).filter(x=>x[1]>0);
return`<div class="grid2"><div>`+tbl(r.head.map((h,i)=>`<th class="${r.fm[i]?'r':''}">${h}</th>`),r.rows.map(x=>`<tr>${x.map((c,i)=>`<td class="${r.fm[i]?'r':''}">${f[r.fm[i]===2?2:r.fm[i]===1?1:0](c)}</td>`).join('')}</tr>`))+`<p class="sub" style="margin-top:8px">${r.rows.length} filas</p></div><div><h2>${r.ti}</h2>${hbars(top,r.cf)}</div></div>`};
A.rcsv=()=>{const r=rep();csv('reporte-'+(fv('rt')||'val'),r.head,r.rows)};

V.usuarios=()=>`<h1>Usuarios y roles</h1><p class="sub">Gestión de accesos de la demostración.</p><section class="card"><h2>Rol de demostración</h2><p class="sub">Cambia de rol aquí o en la barra superior: el menú y las acciones se adaptan al instante. Rol actual: <b>${S.role}</b> (${me()}).</p><div class="tabs">${['administrador','bodeguero','compras'].map(r=>`<button class="${S.role===r?'on':''}" onclick="A.role('${r}')">${r[0].toUpperCase()+r.slice(1)}</button>`).join('')}</div></section><section class="card"><div class="fb"><span style="flex:1"></span><button class="b p" onclick="A.unew()">+ Nuevo usuario</button></div><div id="tbl"></div></section>`;
T.usuarios=()=>tbl(['<th>Nombre</th>','<th>Correo</th>','<th>Rol</th>','<th>Bodega asignada</th>','<th>Estado</th>','<th></th>'],S.usuarios.map(u=>`<tr><td><b>${esc(u.nombre)}</b></td><td>${esc(u.email)}</td><td>${u.rol}</td><td>${u.bodega?esc(B(u.bodega).nombre):'Todas'}</td><td><span class="bd ${u.estado==='Activo'?'ok':'n'}">${u.estado}</span></td><td><button class="b s" onclick="A.uedit(${u.id})">Editar</button><button class="b s" onclick="A.utog(${u.id})">${u.estado==='Activo'?'Desactivar':'Activar'}</button></td></tr>`));
const uf=()=>[ff('nombre','Nombre','text',1),ff('email','Correo','email',1),ff('rol','Rol','select',1,['administrador','bodeguero','compras']),ff('bodega','Bodega asignada','select',0,opB()),ff('estado','Estado','select',1,['Activo','Inactivo'])];
const uSave=id=>o=>{o.bodega=+o.bodega||0;upsert(S.usuarios,id,o,id?'Usuario actualizado':'Usuario creado')};
A.unew=()=>openForm('Nuevo usuario',uf(),{rol:'bodeguero',estado:'Activo'},uSave(0));
A.uedit=id=>openForm('Editar usuario',uf(),S.usuarios.find(u=>u.id===id),uSave(id));
A.utog=id=>{const u=S.usuarios.find(x=>x.id===id);if(u.estado==='Activo'&&u.rol==='administrador'&&S.usuarios.filter(x=>x.rol==='administrador'&&x.estado==='Activo').length<2)return toast('Debe quedar al menos un administrador activo');u.estado=u.estado==='Activo'?'Inactivo':'Activo';save();render();toast('Estado actualizado')};

V.config=()=>`<h1>Configuración</h1><p class="sub">Respaldo e intercambio de datos de la aplicación.</p><section class="card"><h2>Exportar / importar datos</h2><textarea id="ex" placeholder="Pulsa «Exportar datos» para generar el JSON, o pega aquí un JSON para importar" spellcheck="false"></textarea><div id="er" class="err"></div><div class="ac" style="justify-content:flex-start"><button class="b p" onclick="A.exp()">Exportar datos</button><button class="b" onclick="A.imp()">Importar</button><button class="b d" onclick="A.rst()">Restaurar datos de ejemplo</button></div></section>`;
A.exp=()=>{$('#ex').value=JSON.stringify(S,null,1);toast('Datos exportados en el cuadro de texto')};
A.imp=()=>{try{const j=JSON.parse($('#ex').value);for(const k of['productos','categorias','bodegas','movimientos','proveedores','ordenes','ajustes','usuarios'])if(!Array.isArray(j[k]))return err('JSON inválido: falta la lista «'+k+'»');ask('Se reemplazarán todos los datos actuales por los importados. ¿Continuar?',()=>{S=j;S.role=S.role||'administrador';S.seq=S.seq||5000;save();render();toast('Datos importados')})}catch(e){err('No se pudo leer el JSON: '+e.message)}};
A.rst=()=>ask('Se borrarán los cambios y se restaurarán los datos de ejemplo. ¿Continuar?',()=>{S=seed();save();render();toast('Datos de ejemplo restaurados')});
A.role=r=>{S.role=r;save();render()};

function render(){route=(location.hash||'#dashboard').slice(1);const n=NAV.find(x=>x[0]===route);if(!n||!n[3].includes(S.role[0])){route='dashboard'}
$('#nav').innerHTML=NAV.filter(n=>n[3].includes(S.role[0])).map(n=>`<a href="#${n[0]}" class="${n[0]===route?'on':''}"><svg viewBox="0 0 24 24"><path d="${IC[n[2]]}"/></svg>${n[1]}</a>`).join('');
$('#rs').value=S.role;$('#main').innerHTML=V[route]();refT();if($('#m_t'))A.mt();$('#side').classList.remove('open');window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{X();render()});
render();
</script>
</body>
