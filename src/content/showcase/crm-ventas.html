<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nativa Distribuciones · CRM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#F7F4EC;--fg:#2F3A24;--ac:#6B7A3A;--ac2:#56632d;--card:#fffdf8;--bd:#e3dcc9;--mut:#7a7f6c;--red:#b83a2e;--amb:#c98a12;--ok:#3f7d3a}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito Sans',system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:14px;display:flex;min-height:100vh}
aside{width:224px;background:var(--fg);color:#efeadb;padding:16px 10px;position:fixed;top:0;bottom:0;overflow:auto;z-index:20}
aside h1{font-size:16px;margin:4px 8px 2px;color:#fff}
aside small{display:block;margin:0 8px 14px;color:#b9bfa2;font-size:11px}
aside button{display:block;width:100%;text-align:left;background:none;border:0;color:#d9dcc6;padding:9px 12px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;margin-bottom:2px}
aside button.on,aside button:hover{background:var(--ac);color:#fff}
main{margin-left:224px;flex:1;padding:22px;min-width:0}
.top{display:none}
h2{margin:0 0 14px;font-size:22px}
h3{margin:0 0 10px;font-size:15px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.k4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi b{display:block;font-size:24px;color:var(--ac2)}
.kpi span{color:var(--mut);font-size:12px;font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;color:var(--mut);letter-spacing:.04em}
.tw{overflow-x:auto}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 13px;font:inherit;font-weight:700;cursor:pointer}
.btn:hover{background:var(--ac2)}
.btn.s{padding:4px 9px;font-size:12px}
.btn.g{background:#ece6d3;color:var(--fg)}
.btn.d{background:var(--red)}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--fg);width:100%}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.bar input,.bar select{width:auto;flex:1;min-width:120px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#e9e5cf;color:var(--ac2)}
.tag.r{background:#f6d9d5;color:var(--red)}.tag.a{background:#faebc8;color:#8a5d00}.tag.o{background:#d8ecd3;color:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(30,35,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:50}
.mb{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:620px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg label{font-size:12px;font-weight:700;display:block}
.fg .w{grid-column:1/-1}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:230px;gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:#efe9d6;border-radius:10px;padding:8px}
.col h4{margin:2px 0 8px;font-size:12px;text-transform:uppercase}
.oc{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:6px;font-size:12px}
.tabs button{margin-right:4px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.red{background:#fbeceb}.amb{background:#fdf5e0}
.demo{background:#efe9d6;border-radius:8px;padding:6px 10px;font-size:12px;margin-bottom:12px}
.doc{background:#fff;padding:22px;border:1px solid var(--bd);border-radius:8px}
.toast{position:fixed;bottom:16px;right:16px;background:var(--fg);color:#fff;padding:10px 16px;border-radius:8px;z-index:99}
a.l{color:var(--ac2);cursor:pointer;font-weight:700}
@media(max-width:800px){body{display:block}aside{position:static;width:auto;display:none;padding:8px}aside.open{display:block}main{margin:0;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;background:var(--fg);color:#fff;padding:10px 14px}.fg{grid-template-columns:1fr}}
@media print{aside,.top,.noprint,.toast{display:none!important}main{margin:0}body{background:#fff}.modal{position:static;background:none;padding:0}.mb{max-width:none}}
</style>
</head>
<body>
<div class="top"><b>Nativa · CRM</b><button class="btn" onclick="document.getElementById('side').classList.toggle('open')">Menú</button></div>
<aside id="side"></aside>
<main id="main"></main>
<div id="mod"></div>
<script>
const KEY='nativa-distribuciones-crm';
const ETAPAS=['nuevo','contactado','interesado','cotizado','negociación','ganado','perdido'];
const CANALES=['Llamada','WhatsApp','Correo','Visita'];
const LISTAS=['Público','Mayorista','Distribuidor','Especial'];
const PAGES=[['dashboard','Panel'],['contactos','Contactos'],['oportunidades','Embudo'],['seguimientos','Seguimientos'],['interacciones','Interacciones'],['cotizaciones','Cotizaciones'],['productos','Productos'],['cadencias','Cadencias'],['ajustes','Ajustes']];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cop=n=>'$'+Math.round(n||0).toLocaleString('es-CO');
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const addD=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return iso(x)};
const HOY=iso(new Date());
let S,view='dashboard',ui={tab:'Vencidos',fe:'',ficha:null,q:{}};
function seed(){
const eq=['Laura Gómez','Andrés Pineda','Camila Torres','Jorge Ramírez'];
const emp=['Tienda La Esquina','Supermercado El Ahorro','Restaurante Sabor Andino','Hotel Mirador Demo','Panadería Trigo Dorado','Café Montaña','Revendedor Hermanos Soto','Tienda Doña Rosa','Supermercado Central Demo','Restaurante Brasa Verde'];
const nom=['Marta Quiroga','Luis Herrera','Paola Ríos','Sergio Mejía','Ana Lucía Vega','Camilo Duarte','Diego Soto','Rosa Cárdenas','Iván Peña','Elena Ortiz'];
const tn=['Tienda de barrio','Supermercado','Restaurante','Hotel','Panadería','Cafetería','Revendedor','Tienda de barrio','Supermercado','Restaurante'];
const fu=['Referido','Feria','Redes sociales','Llamada en frío','Sitio web','Visita'];
const ci=['Medellín','Bogotá','Cali','Pereira','Bucaramanga'];
const lp=['Público','Mayorista','Distribuidor','Especial'];
const contactos=nom.map((n,i)=>({id:i+1,nombre:n,empresa:emp[i],tipo_negocio:tn[i],fuente:fu[i%6],ciudad:ci[i%5],telefono:'300 555 01'+String(10+i),correo:'contacto'+(i+1)+'@ejemplo.test',responsable:eq[i%4],lista_precios:lp[i%4]}));
const ti=['Pedido mensual abarrotes','Surtido de aceites','Contrato lácteos','Pedido de granos','Línea de aseo','Abastecimiento hotel','Reventa bebidas','Pedido semanal','Compra por volumen','Cuenta restaurante','Reposición panadería','Café y azúcar'];
const oportunidades=ti.map((t,i)=>({id:i+1,titulo:t,contacto:emp[i%10],etapa:ETAPAS[(i*3+i%2)%7],valor:(2+i*3%11)*1100000,cierre_estimado:addD(HOY,5+i*4),responsable:eq[i%4],motivo_perdida:'',notas:''}));
oportunidades.forEach(o=>{if(o.etapa==='perdido')o.motivo_perdida='Precio superior al de la competencia'});
const ta=['Llamar para confirmar pedido','Enviar catálogo por WhatsApp','Visitar punto de venta','Enviar cotización por correo'];
const seguimientos=Array.from({length:12},(_,i)=>({id:i+1,contacto:emp[i%10],tarea:ta[i%4],fecha:addD(HOY,i-4),canal:CANALES[i%4],estado:i%5===4?'hecho':'pendiente',responsable:eq[i%4]}));
const res=['Interesado en lista mayorista','Pidió muestras','Solicitó cotización','Confirmó visita','Sin respuesta, reintentar','Negocia plazos de pago','Comparando precios'];
const interacciones=Array.from({length:14},(_,i)=>({id:i+1,contacto:emp[i%10],tipo:CANALES[i%4],fecha:addD(HOY,-i-1),resumen:res[i%7],responsable:eq[i%4]}));
const productos=[['ABA-001','Arroz blanco 500 g','Granos','Paquete',3200],['ABA-002','Frijol cargamanto 500 g','Granos','Paquete',6500],['ACE-001','Aceite vegetal 1 L','Aceites','Unidad',14500],['ACE-002','Aceite de girasol 3 L','Aceites','Unidad',38000],['LAC-001','Leche entera 1 L','Lácteos','Caja',54000],['LAC-002','Queso campesino 500 g','Lácteos','Unidad',12800],['BEB-001','Gaseosa cola 1.5 L','Bebidas','Caja',46000],['BEB-002','Agua sin gas 600 ml','Bebidas','Caja',28000],['ASE-001','Detergente en polvo 2 kg','Aseo','Bulto',24000],['ASE-002','Jabón de barra x3','Aseo','Paquete',7800],['ABA-003','Azúcar 1 kg','Abarrotes','Bulto',4300],['ABA-004','Sal refinada 500 g','Abarrotes','Paquete',1800]].map((p,i)=>({id:i+1,sku:p[0],nombre:p[1],categoria:p[2],unidad:p[3],precio_publico:p[4],precio_mayorista:Math.round(p[4]*.92),precio_distribuidor:Math.round(p[4]*.86),precio_especial:Math.round(p[4]*.8),umbral:10}));
const est=['borrador','enviada','enviada','aceptada','rechazada','enviada','vencida','borrador'];
const cotizaciones=est.map((e,i)=>({id:i+1,numero:'COT-'+String(i+1).padStart(4,'0'),cliente:emp[i],fecha:addD(HOY,-i*2-(e==='enviada'?0:1)),lista_precios:lp[i%4],desc_publico:0,desc_volumen:i%2?3:0,desc_adicional:0,envio:15000,impuestos:19,validez_dias:e==='enviada'?[8,10,12][i%3]:15,estado:e,condiciones:'Pago a 30 días. Precios sujetos a disponibilidad.',notas:'',items:[{pid:1+i%12,cant:10+i*5},{pid:1+(i+3)%12,cant:5+i*2}],oportunidad:i+1,responsable:eq[i%4]}));
const cadencias=[{id:1,nombre:'Prospecto nuevo',descripcion:'Primer contacto en dos semanas.',pasos:'0|WhatsApp|Enviar saludo y catálogo\n3|Llamada|Llamar para conocer necesidades\n10|Correo|Enviar propuesta'},{id:2,nombre:'Post-cotización',descripcion:'Seguimiento tras enviar cotización.',pasos:'1|WhatsApp|Confirmar recepción\n4|Llamada|Resolver dudas\n7|Visita|Visitar y cerrar'},{id:3,nombre:'Reactivación',descripcion:'Clientes inactivos.',pasos:'0|Llamada|Retomar contacto\n5|WhatsApp|Enviar promoción'}];
return{contactos,oportunidades,seguimientos,interacciones,cotizaciones,productos,cadencias,equipo:eq.map((n,i)=>({id:i+1,nombre:n,rol:i===3?'gerente':'asesor'})),ajustes:{prefijo:'COT-',proximo:9,validez:15,iva:19,condiciones:'Pago a 30 días. Precios sujetos a disponibilidad.'},rol:'gerente',usuario:'Jorge Ramírez',nid:100};}
function load(){try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);return}}catch(e){}S=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function nid(){return ++S.nid}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
function autoVence(){S.cotizaciones.forEach(c=>{if(c.estado==='enviada'&&addD(c.fecha,+c.validez_dias)<HOY)c.estado='vencida'})}
function mine(arr){return S.rol==='gerente'?arr:arr.filter(x=>x.responsable===S.usuario)}
function totales(c){let sub=0,vol=false;(c.items||[]).forEach(it=>{const p=S.productos.find(x=>x.id==it.pid);if(!p)return;const pr=precio(p,c.lista_precios);sub+=pr*it.cant;if(it.cant>=(p.umbral||10))vol=true});
const pub=sub*(c.desc_publico||0)/100,v=(sub-pub)*(c.desc_volumen||0)/100,a=(sub-pub-v)*(c.desc_adicional||0)/100;const base=sub-pub-v-a+(+c.envio||0);const iva=base*(c.impuestos||0)/100;return{sub,pub,v,a,iva,total:base+iva}}
function precio(p,l){return l==='Mayorista'?p.precio_mayorista:l==='Distribuidor'?(p.precio_distribuidor||p.precio_publico):l==='Especial'?(p.precio_especial||p.precio_distribuidor||p.precio_publico):p.precio_publico}
function nav(){$('#side').innerHTML='<h1>Nativa Distribuciones</h1><small>CRM · datos de ejemplo</small>'+PAGES.map(p=>`<button class="${view===p[0]?'on':''}" onclick="go('${p[0]}')">${p[1]}</button>`).join('')+`<small style="margin-top:12px">Rol: ${S.rol} · ${esc(S.usuario)}</small>`}
function go(v,f){view=v;ui.ficha=null;if(f!==undefined)ui.fe=f;$('#side').classList.remove('open');render()}
function render(){autoVence();save();nav();const m=$('#main');const f={dashboard,contactos,oportunidades,seguimientos,interacciones,cotizaciones,productos,cadencias,ajustes}[view];m.innerHTML=(ui.ficha&&view==='contactos')?ficha():f();window.scrollTo(0,0)}
function sel(opts,val,id,extra){return `<select id="${id}" ${extra||''}>`+opts.map(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return `<option value="${esc(v)}" ${v==val?'selected':''}>${esc(l)}</option>`}).join('')+'</select>'}
function names(){return S.equipo.map(e=>e.nombre)}
function search(k){return `<input placeholder="Buscar…" value="${esc(ui.q[k]||'')}" oninput="ui.q['${k}']=this.value;partial()">`}
function partial(){const p=document.activeElement,id=p&&p.selectionStart;render2()}
function render2(){const m=$('#main');const pos=document.activeElement.selectionStart;const f={contactos,oportunidades,seguimientos,interacciones,cotizaciones,productos}[view];if(!f)return;m.innerHTML=f();const i=m.querySelector('input[placeholder="Buscar…"]');if(i){i.focus();i.setSelectionRange(pos,pos)}}
function dashboard(){const op=mine(S.oportunidades),abiertas=op.filter(o=>!['ganado','perdido'].includes(o.etapa));const g=op.filter(o=>o.etapa==='ganado').length,p=op.filter(o=>o.etapa==='perdido').length;
const cots=S.cotizaciones.filter(c=>S.rol==='gerente'||c.responsable===S.usuario);const seg=mine(S.seguimientos).filter(s=>s.estado==='pendiente');const venc=seg.filter(s=>s.fecha<HOY);
const maxc=Math.max(1,...ETAPAS.map(e=>op.filter(o=>o.etapa===e).length));
const bars=ETAPAS.map((e,i)=>{const l=op.filter(o=>o.etapa===e),h=l.length/maxc*130;return `<g style="cursor:pointer" onclick="go('oportunidades','${e}')"><rect x="${i*62+8}" y="${150-h}" width="46" height="${h}" rx="6" fill="${e==='perdido'?'#b83a2e':e==='ganado'?'#3f7d3a':'#6B7A3A'}"/><text x="${i*62+31}" y="${144-h}" text-anchor="middle" font-size="12" font-weight="700" fill="#2F3A24">${l.length}</text><text x="${i*62+31}" y="166" text-anchor="middle" font-size="9" fill="#2F3A24">${e.slice(0,10)}</text><text x="${i*62+31}" y="178" text-anchor="middle" font-size="8" fill="#7a7f6c">${(l.reduce((a,o)=>a+o.valor,0)/1e6).toFixed(1)}M</text></g>`}).join('');
const sl=seg.filter(s=>s.fecha<=HOY).sort((a,b)=>a.fecha.localeCompare(b.fecha));
const pv=cots.filter(c=>c.estado==='enviada'&&addD(c.fecha,+c.validez_dias)<=addD(HOY,5));
return `<h2>Panel</h2><div class="demo">Datos de ejemplo ficticios · Vista: ${S.rol==='gerente'?'todo el equipo':esc(S.usuario)}</div>
<div class="grid k4"><div class="card kpi"><span>Valor del embudo</span><b>${cop(abiertas.reduce((a,o)=>a+o.valor,0))}</b></div><div class="card kpi"><span>Tasa de cierre</span><b>${g+p?Math.round(g/(g+p)*100):0}%</b></div><div class="card kpi"><span>Cotizaciones abiertas</span><b>${cots.filter(c=>['borrador','enviada'].includes(c.estado)).length}</b></div><div class="card kpi"><span>Seguimientos vencidos</span><b style="color:var(--red)">${venc.length}</b></div></div>
<div class="card"><h3>Embudo por etapa (cantidad y valor)</h3><svg viewBox="0 0 440 185" style="width:100%;max-height:260px">${bars}</svg></div>
<div class="card"><h3>Seguimientos de hoy y vencidos</h3>${sl.map(s=>`<div class="row ${s.fecha<HOY?'red':'amb'}"><span><b>${esc(s.contacto)}</b> · ${esc(s.tarea)} <span class="tag ${s.fecha<HOY?'r':'a'}">${s.fecha}</span></span><span><button class="btn s" onclick="completar(${s.id})">Hecho</button> <button class="btn s g" onclick="repro(${s.id})">Reprogramar</button> <button class="btn s g" onclick="abrirC('${esc(s.contacto).replace(/'/g,"\\'")}')">Contacto</button></span></div>`).join('')||'<p>Sin pendientes.</p>'}</div>
<div class="card"><h3>Cotizaciones por vencer (5 días)</h3>${pv.map(c=>`<div class="row"><span><b>${c.numero}</b> · ${esc(c.cliente)} · vence ${addD(c.fecha,+c.validez_dias)}</span><button class="btn s" onclick="verCot(${c.id})">Dar seguimiento</button></div>`).join('')||'<p>Ninguna por vencer.</p>'}</div>`}
function abrirC(n){const c=S.contactos.find(x=>x.empresa===n||x.nombre===n);if(c){view='contactos';ui.ficha=c.id;render()}else toast('Contacto no encontrado')}
function modal(h){$('#mod').innerHTML=`<div class="modal"><div class="mb">${h}</div></div>`}
function close(){$('#mod').innerHTML=''}
function confirmar(msg,fn){window._cf=fn;modal(`<h3>${esc(msg)}</h3><div class="bar"><button class="btn d" onclick="close();_cf()">Confirmar</button><button class="btn g" onclick="close()">Cancelar</button></div>`)}
function form(title,fields,vals,onsave){window._sv=onsave;modal(`<h3>${title}</h3><div class="fg">${fields.map(f=>`<div class="${f.w?'w':''}"><label>${f.l}${f.req?' *':''}</label>${f.t==='select'?sel(f.o,vals[f.k],'f_'+f.k):f.t==='textarea'?`<textarea id="f_${f.k}" rows="3">${esc(vals[f.k])}</textarea>`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${esc(vals[f.k])}">`}</div>`).join('')}</div><div class="bar" style="margin-top:12px"><button class="btn" onclick="submitF()">Guardar</button><button class="btn g" onclick="close()">Cancelar</button></div>`);window._ff=fields}
function submitF(){const o={};for(const f of _ff){let v=document.getElementById('f_'+f.k).value;if(f.req&&!String(v).trim()){toast('Falta: '+f.l);return}if(f.t==='number')v=+v;o[f.k]=v}close();_sv(o)}
const contactNames=()=>S.contactos.map(c=>c.empresa);
function contactos(){const q=(ui.q.contactos||'').toLowerCase();const f=ui.fc||{};let l=mine(S.contactos).filter(c=>(!q||(c.nombre+c.empresa+c.ciudad).toLowerCase().includes(q))&&(!f.t||c.tipo_negocio===f.t)&&(!f.c||c.ciudad===f.c)&&(!f.l||c.lista_precios===f.l));
const tipos=[...new Set(S.contactos.map(c=>c.tipo_negocio))],cs=[...new Set(S.contactos.map(c=>c.ciudad))];
return `<h2>Contactos</h2><div class="demo">Datos de ejemplo ficticios</div><div class="bar">${search('contactos')}<select onchange="ui.fc={...ui.fc,t:this.value};render2()"><option value="">Tipo</option>${tipos.map(t=>`<option ${f.t==t?'selected':''}>${t}</option>`).join('')}</select><select onchange="ui.fc={...ui.fc,c:this.value};render2()"><option value="">Ciudad</option>${cs.map(t=>`<option ${f.c==t?'selected':''}>${t}</option>`).join('')}</select><select onchange="ui.fc={...ui.fc,l:this.value};render2()"><option value="">Lista</option>${LISTAS.map(t=>`<option ${f.l==t?'selected':''}>${t}</option>`).join('')}</select><button class="btn" onclick="editC()">+ Contacto</button></div>
<div class="card tw"><table><tr><th>Nombre</th><th>Empresa</th><th>Tipo</th><th>Ciudad</th><th>Lista</th><th>Responsable</th><th></th></tr>${l.map(c=>`<tr><td><a class="l" onclick="ui.ficha=${c.id};render()">${esc(c.nombre)}</a></td><td>${esc(c.empresa)}</td><td>${c.tipo_negocio}</td><td>${esc(c.ciudad)}</td><td>${c.lista_precios}</td><td>${esc(c.responsable)}</td><td><button class="btn s g" onclick="editC(${c.id})">Editar</button> <button class="btn s d" onclick="delC(${c.id})">Eliminar</button></td></tr>`).join('')||'<tr><td colspan=7>Sin resultados</td></tr>'}</table></div>`}
function editC(id){const c=id?S.contactos.find(x=>x.id===id):{responsable:S.usuario,tipo_negocio:'Tienda de barrio',fuente:'Referido',lista_precios:'Público'};
form(id?'Editar contacto':'Nuevo contacto',[{k:'nombre',l:'Nombre',req:1},{k:'empresa',l:'Empresa / negocio',req:1},{k:'tipo_negocio',l:'Tipo de negocio',t:'select',o:['Tienda de barrio','Supermercado','Restaurante','Hotel','Panadería','Cafetería','Revendedor']},{k:'fuente',l:'Fuente',t:'select',o:['Referido','Feria','Redes sociales','Llamada en frío','Sitio web','Visita']},{k:'ciudad',l:'Ciudad',req:1},{k:'telefono',l:'Teléfono',t:'tel',req:1},{k:'correo',l:'Correo',t:'email'},{k:'responsable',l:'Responsable',t:'select',o:names()},{k:'lista_precios',l:'Lista de precios',t:'select',o:LISTAS}],c,o=>{if(S.rol!=='gerente')o.responsable=id?c.responsable:S.usuario;if(id)Object.assign(c,o);else S.contactos.push({id:nid(),...o});render();toast('Contacto guardado')})}

<div class="grid k4"><div class="card"><h3>Oportunidades</h3>${S.oportunidades.filter(o=>o.contacto===e).map(o=>`<div class="row">${esc(o.titulo)} <span class="tag">${o.etapa}</span> ${cop(o.valor)}</div>`).join('')||'—'}</div><div class="card"><h3>Cotizaciones</h3>${S.cotizaciones.filter(o=>o.cliente===e).map(o=>`<div class="row"><a class="l" onclick="verCot(${o.id})">${o.numero}</a> <span class="tag">${o.estado}</span> ${cop(totales(o).total)}</div>`).join('')||'—'}</div><div class="card"><h3>Seguimientos pendientes</h3>${S.seguimientos.filter(o=>o.contacto===e&&o.estado==='pendiente').map(o=>`<div class="row">${esc(o.tarea)} <span class="tag ${o.fecha<HOY?'r':''}">${o.fecha}</span></div>`).join('')||'—'}</div></div>
<div class="card"><h3>Línea de tiempo</h3>${S.interacciones.filter(o=>o.contacto===e).sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(o=>`<div class="row"><span><span class="tag">${o.tipo}</span> ${esc(o.resumen)}</span><small>${o.fecha}</small></div>`).join('')||'Sin interacciones.'}</div>`}
function oppFilter(){const f=ui.fo||{};let l=mine(S.oportunidades);const q=(ui.q.op||'').toLowerCase();return l.filter(o=>(!ui.fe||o.etapa===ui.fe)&&(!f.r||o.responsable===f.r)&&(!f.min||o.valor>=f.min)&&(!f.max||o.valor<=f.max)&&(!q||(o.titulo+o.contacto).toLowerCase().includes(q)))}
function oportunidades(){const l=oppFilter(),f=ui.fo||{};
const kan=ETAPAS.map((e,i)=>{const it=mine(S.oportunidades).filter(o=>o.etapa===e);return `<div class="col"><h4>${e} (${it.length}) · ${cop(it.reduce((a,o)=>a+o.valor,0))}</h4>${it.map(o=>`<div class="oc"><b>${esc(o.titulo)}</b><br>${esc(o.contacto)}<br>${cop(o.valor)} · ${esc(o.responsable)}<div class="bar" style="margin:6px 0 0;flex-wrap:nowrap"><button class="btn s g" ${i==0?'disabled':''} onclick="mover(${o.id},-1)">◀</button>${sel(ETAPAS,o.etapa,'e'+o.id,`onchange="cambiaEtapa(${o.id},this.value)" style="padding:3px"`)}<button class="btn s g" ${i==6?'disabled':''} onclick="mover(${o.id},1)">▶</button></div></div>`).join('')}</div>`}).join('');
return `<h2>Embudo</h2><div class="demo">Datos de ejemplo ficticios</div><div class="kan">${kan}</div><div class="card" style="margin-top:14px"><div class="bar">${search('op')}<select onchange="ui.fe=this.value;render2()"><option value="">Etapa</option>${ETAPAS.map(e=>`<option ${ui.fe==e?'selected':''}>${e}</option>`).join('')}</select><select onchange="ui.fo={...ui.fo,r:this.value};render2()"><option value="">Responsable</option>${names().map(e=>`<option ${f.r==e?'selected':''}>${e}</option>`).join('')}</select><input type="number" placeholder="Valor mín." value="${f.min||''}" onchange="ui.fo={...ui.fo,min:+this.value};render2()"><input type="number" placeholder="Valor máx." value="${f.max||''}" onchange="ui.fo={...ui.fo,max:+this.value};render2()"><button class="btn" onclick="editO()">+ Oportunidad</button></div>
<div class="tw"><table><tr><th>Título</th><th>Contacto</th><th>Etapa</th><th>Valor</th><th>Cierre</th><th>Resp.</th><th></th></tr>${l.map(o=>`<tr><td>${esc(o.titulo)}</td><td>${esc(o.contacto)}</td><td><span class="tag">${o.etapa}</span></td><td>${cop(o.valor)}</td><td>${o.cierre_estimado||''}</td><td>${esc(o.responsable)}</td><td><button class="btn s g" onclick="editO(${o.id})">Editar</button> <button class="btn s d" onclick="delO(${o.id})">Eliminar</button></td></tr>`).join('')||'<tr><td colspan=7>Sin resultados</td></tr>'}</table></div></div>`}
function mover(id,d){const o=S.oportunidades.find(x=>x.id===id);cambiaEtapa(id,ETAPAS[ETAPAS.indexOf(o.etapa)+d])}
function cambiaEtapa(id,e){const o=S.oportunidades.find(x=>x.id===id);if(!e||e===o.etapa){render();return}
if(e==='perdido'){form('Motivo de pérdida',[{k:'m',l:'Motivo',req:1,w:1}],{m:''},v=>{o.etapa='perdido';o.motivo_perdida=v.m;render()});return}o.etapa=e;render()}
function editO(id,contacto){const o=id?S.oportunidades.find(x=>x.id===id):{contacto:contacto||S.contactos[0].empresa,etapa:'nuevo',valor:0,responsable:S.usuario,cierre_estimado:addD(HOY,30),cad:''};
const fl=[{k:'titulo',l:'Título',req:1,w:1},{k:'contacto',l:'Contacto',t:'select',o:contactNames()},{k:'etapa',l:'Etapa',t:'select',o:ETAPAS},{k:'valor',l:'Valor estimado (COP)',t:'number',req:1},{k:'cierre_estimado',l:'Cierre estimado',t:'date'},{k:'responsable',l:'Responsable',t:'select',o:S.rol==='gerente'?names():[o.responsable]},{k:'notas',l:'Notas',t:'textarea',w:1}];
if(!id)fl.push({k:'cad',l:'Aplicar cadencia',t:'select',o:[['','Ninguna'],...S.cadencias.map(c=>[c.id,c.nombre])]});
form(id?'Editar oportunidad':'Nueva oportunidad',fl,o,v=>{const cad=v.cad;delete v.cad;if(v.etapa==='perdido'&&!o.motivo_perdida)v.motivo_perdida='Sin especificar';if(id)Object.assign(o,v);else{S.oportunidades.push({id:nid(),motivo_perdida:'',...v});if(cad)aplicarCad(+cad,v.contacto,v.responsable)}render();toast('Oportunidad guardada')})}
function aplicarCad(cid,contacto,resp){const c=S.cadencias.find(x=>x.id===cid);if(!c)return;pasos(c).forEach(p=>S.seguimientos.push({id:nid(),contacto,tarea:p.tarea,fecha:addD(HOY,p.dia),canal:p.canal,estado:'pendiente',responsable:resp}))}
function pasos(c){return c.pasos.split('\n').map(l=>l.split('|')).filter(p=>p.length>=3).map(p=>({dia:+p[0]||0,canal:p[1].trim(),tarea:p.slice(2).join('|').trim()}))}
function delO(id){confirmar('¿Eliminar oportunidad?',()=>{S.oportunidades=S.oportunidades.filter(o=>o.id!==id);render()})}
function seguimientos(){const t=ui.tab,q=(ui.q.sg||'').toLowerCase();let l=mine(S.seguimientos).filter(s=>!q||(s.contacto+s.tarea).toLowerCase().includes(q));
l=l.filter(s=>t==='Hechos'?s.estado==='hecho':s.estado==='pendiente'&&(t==='Vencidos'?s.fecha<HOY:t==='Hoy'?s.fecha===HOY:s.fecha>HOY)).sort((a,b)=>a.fecha.localeCompare(b.fecha));
return `<h2>Seguimientos</h2><div class="demo">Datos de ejemplo ficticios</div><div class="bar tabs">${['Vencidos','Hoy','Próximos','Hechos'].map(x=>`<button class="btn s ${t===x?'':'g'}" onclick="ui.tab='${x}';render()">${x}</button>`).join('')}${search('sg')}<button class="btn" onclick="editS()">+ Seguimiento</button></div><div class="card tw"><table><tr><th>Fecha</th><th>Contacto</th><th>Tarea</th><th>Canal</th><th>Resp.</th><th></th></tr>${l.map(s=>`<tr class="${s.estado==='pendiente'?s.fecha<HOY?'red':s.fecha===HOY?'amb':'':''}"><td>${s.fecha}</td><td>${esc(s.contacto)}</td><td>${esc(s.tarea)}</td><td>${s.canal}</td><td>${esc(s.responsable)}</td><td>${s.estado==='pendiente'?`<button class="btn s" onclick="completar(${s.id})">Completar</button> <button class="btn s g" onclick="repro(${s.id})">Reprogramar</button> `:''}<button class="btn s g" onclick="editS(${s.id})">Editar</button> <button class="btn s d" onclick="delS(${s.id})">Eliminar</button></td></tr>`).join('')||'<tr><td colspan=6>Nada en esta pestaña</td></tr>'}</table></div>`}
function editS(id,contacto){const s=id?S.seguimientos.find(x=>x.id===id):{contacto:contacto||S.contactos[0].empresa,tarea:'',fecha:addD(HOY,1),canal:'Llamada',estado:'pendiente',responsable:S.usuario};
form(id?'Editar seguimiento':'Nuevo seguimiento',[{k:'contacto',l:'Contacto',t:'select',o:contactNames()},{k:'tarea',l:'Tarea',req:1},{k:'fecha',l:'Fecha',t:'date',req:1},{k:'canal',l:'Canal',t:'select',o:CANALES},{k:'estado',l:'Estado',t:'select',o:['pendiente','hecho']},{k:'responsable',l:'Responsable',t:'select',o:S.rol==='gerente'?names():[s.responsable]}],s,v=>{if(id)Object.assign(s,v);else S.seguimientos.push({id:nid(),...v});render();toast('Seguimiento guardado')})}
function delS(id){confirmar('¿Eliminar seguimiento?',()=>{S.seguimientos=S.seguimientos.filter(s=>s.id!==id);render()})}
function repro(id){const s=S.seguimientos.find(x=>x.id===id);form('Reprogramar',[{k:'fecha',l:'Nueva fecha',t:'date',req:1}],{fecha:addD(HOY,1)},v=>{s.fecha=v.fecha;render()})}
function completar(id){const s=S.seguimientos.find(x=>x.id===id);s.estado='hecho';save();modal(`<h3>Seguimiento completado</h3><p>¿Registrar la interacción resultante en el historial de ${esc(s.contacto)}?</p><div class="bar"><button class="btn" onclick="close();editI(0,'${s.contacto.replace(/'/g,"\\'")}','${s.canal}')">Registrar</button><button class="btn g" onclick="close();render()">Ahora no</button></div>`);}
function interacciones(){const f=ui.fi||{},q=(ui.q.in||'').toLowerCase();const l=mine(S.interacciones).filter(i=>(!f.t||i.tipo===f.t)&&(!f.c||i.contacto===f.c)&&(!q||(i.contacto+i.resumen).toLowerCase().includes(q))).sort((a,b)=>b.fecha.localeCompare(a.fecha));
return `<h2>Interacciones</h2><div class="demo">Datos de ejemplo ficticios</div><div class="bar">${search('in')}<select onchange="ui.fi={...ui.fi,t:this.value};render2()"><option value="">Tipo</option>${CANALES.map(e=>`<option ${f.t==e?'selected':''}>${e}</option>`).join('')}</select><select onchange="ui.fi={...ui.fi,c:this.value};render2()"><option value="">Contacto</option>${contactNames().map(e=>`<option ${f.c==e?'selected':''}>${esc(e)}</option>`).join('')}</select><button class="btn" onclick="editI()">+ Interacción</button></div><div class="card tw"><table><tr><th>Fecha</th><th>Contacto</th><th>Tipo</th><th>Resumen</th><th>Resp.</th><th></th></tr>${l.map(i=>`<tr><td>${i.fecha}</td><td>${esc(i.contacto)}</td><td><span class="tag">${i.tipo}</span></td><td>${esc(i.resumen)}</td><td>${esc(i.responsable)}</td><td><button class="btn s g" onclick="editI(${i.id})">Editar</button> <button class="btn s d" onclick="delI(${i.id})">Eliminar</button></td></tr>`).join('')||'<tr><td colspan=6>Sin resultados</td></tr>'}</table></div>`}
function editI(id,contacto,tipo){const i=id?S.interacciones.find(x=>x.id===id):{contacto:contacto||S.contactos[0].empresa,tipo:tipo||'Llamada',fecha:HOY,resumen:'',responsable:S.usuario,next:''};
const fl=[{k:'contacto',l:'Contacto',t:'select',o:contactNames()},{k:'tipo',l:'Tipo',t:'select',o:CANALES},{k:'fecha',l:'Fecha',t:'date',req:1},{k:'responsable',l:'Responsable',t:'select',o:S.rol==='gerente'?names():[i.responsable]},{k:'resumen',l:'Resumen y resultado',t:'textarea',req:1,w:1}];if(!id)fl.push({k:'next',l:'Programar siguiente seguimiento (fecha, opcional)',t:'date',w:1});
form(id?'Editar interacción':'Registrar interacción',fl,i,v=>{const nx=v.next;delete v.next;if(id)Object.assign(i,v);else{S.interacciones.push({id:nid(),...v});if(nx)S.seguimientos.push({id:nid(),contacto:v.contacto,tarea:'Seguimiento tras '+v.tipo.toLowerCase(),fecha:nx,canal:v.tipo,estado:'pendiente',responsable:v.responsable})}render();toast('Interacción guardada')})}
function delI(id){confirmar('¿Eliminar interacción?',()=>{S.interacciones=S.interacciones.filter(s=>s.id!==id);render()})}
function cotizaciones(){const q=(ui.q.ct||'').toLowerCase(),f=ui.fk||'';const l=S.cotizaciones.filter(c=>(S.rol==='gerente'||c.responsable===S.usuario)&&(!f||c.estado===f)&&(!q||(c.numero+c.cliente).toLowerCase().includes(q)));
return `<h2>Cotizaciones</h2><div class="demo">Datos de ejemplo ficticios</div><div class="bar">${search('ct')}<select onchange="ui.fk=this.value;render2()"><option value="">Estado</option>${['borrador','enviada','aceptada','rechazada','vencida'].map(e=>`<option ${f==e?'selected':''}>${e}</option>`).join('')}</select><button class="btn" onclick="buildCot()">Crear cotización</button></div><div class="card tw"><table><tr><th>N.º</th><th>Cliente</th><th>Fecha</th><th>Total</th><th>Vence</th><th>Estado</th><th></th></tr>${l.map(c=>`<tr><td><a class="l" onclick="verCot(${c.id})">${c.numero}</a></td><td>${esc(c.cliente)}</td><td>${c.fecha}</td><td>${cop(totales(c).total)}</td><td>${addD(c.fecha,+c.validez_dias)}</td><td>${sel(['borrador','enviada','aceptada','rechazada','vencida'],c.estado,'x'+c.id,`onchange="estadoCot(${c.id},this.value)" style="padding:3px"`)}</td><td><button class="btn s g" onclick="buildCot(${c.id})">Editar</button> <button class="btn s d" onclick="delK(${c.id})">Eliminar</button></td></tr>`).join('')||'<tr><td colspan=7>Sin resultados</td></tr>'}</table></div>`}
function estadoCot(id,e){const c=S.cotizaciones.find(x=>x.id===id);c.estado=e;const o=S.oportunidades.find(x=>x.id===c.oportunidad);
if(e==='aceptada'&&o){o.etapa='ganado';toast('Oportunidad marcada como ganada')}
if(e==='rechazada'&&o&&o.etapa!=='perdido'){save();modal(`<h3>Cotización rechazada</h3><p>¿Marcar la oportunidad "${esc(o.titulo)}" como perdida?</p><div class="bar"><button class="btn" onclick="close();cambiaEtapa(${o.id},'perdido')">Sí, indicar motivo</button><button class="btn g" onclick="close();render()">No</button></div>`);return}render()}
function delK(id){confirmar('¿Eliminar cotización?',()=>{S.cotizaciones=S.cotizaciones.filter(s=>s.id!==id);render()})}
let CQ=null;
function buildCot(id,cliente,opp){const c=id?S.cotizaciones.find(x=>x.id===id):null;const ct=S.contactos.find(x=>x.empresa===cliente);
CQ=c?JSON.parse(JSON.stringify(c)):{cliente:cliente||S.contactos[0].empresa,fecha:HOY,lista_precios:ct?ct.lista_precios:'Público',desc_publico:0,desc_volumen:0,desc_adicional:0,envio:0,impuestos:S.ajustes.iva,validez_dias:S.ajustes.validez,estado:'borrador',condiciones:S.ajustes.condiciones,notas:'',items:[],oportunidad:opp||null,responsable:S.usuario};CQ._id=id;drawCQ()}
function drawCQ(){const t=totales(CQ),c=CQ;const opps=S.oportunidades.filter(o=>o.contacto===c.cliente);
modal(`<h3>${c._id?'Editar':'Constructor de'} cotización</h3><div class="fg"><div><label>Cliente</label>${sel(contactNames(),c.cliente,'q_cliente','onchange="cq()"')}</div><div><label>Lista de precios</label>${sel(LISTAS,c.lista_precios,'q_lista','onchange="cq()"')}</div><div class="w"><label>Oportunidad asociada</label>${sel([['','Ninguna'],...opps.map(o=>[o.id,o.titulo])],c.oportunidad||'','q_op','onchange="cq()"')}</div></div>
<h3 style="margin-top:12px">Ítems</h3>${c.items.map((it,i)=>{const p=S.productos.find(x=>x.id==it.pid);return `<div class="row"><span>${p?esc(p.nombre):'?'} · ${cop(p?precio(p,c.lista_precios):0)}</span><span><input type="number" min="1" value="${it.cant}" style="width:70px" onchange="CQ.items[${i}].cant=+this.value;cq(1)"> <button class="btn s d" onclick="CQ.items.splice(${i},1);cq(1)">✕</button></span></div>`}).join('')}
<div class="bar" style="margin-top:8px">${sel(S.productos.map(p=>[p.id,p.sku+' · '+p.nombre]),'', 'q_add')}<button class="btn s" onclick="CQ.items.push({pid:+document.getElementById('q_add').value,cant:1});cq(1)">+ Añadir</button></div>
<div class="fg"><div><label>Desc. s/ público %</label><input id="q_dp" type="number" value="${c.desc_publico}" onchange="cq()"></div><div><label>Desc. volumen %</label><input id="q_dv" type="number" value="${c.desc_volumen}" onchange="cq()"></div><div><label>Desc. adicional %</label><input id="q_da" type="number" value="${c.desc_adicional}" onchange="cq()"></div><div><label>Envío COP</label><input id="q_env" type="number" value="${c.envio}" onchange="cq()"></div><div><label>IVA %</label><input id="q_iva" type="number" value="${c.impuestos}" onchange="cq()"></div><div><label>Validez (días)</label><input id="q_val" type="number" value="${c.validez_dias}" onchange="cq()"></div><div class="w"><label>Condiciones</label><textarea id="q_con" rows="2" onchange="cq()">${esc(c.condiciones)}</textarea></div><div class="w"><label>Notas</label><textarea id="q_not" rows="2" onchange="cq()">${esc(c.notas)}</textarea></div></div>
<div class="card" style="margin-top:10px">Subtotal: ${cop(t.sub)}<br>Desc. público: −${cop(t.pub)} · Volumen: −${cop(t.v)} · Adicional: −${cop(t.a)}<br>Envío: ${cop(c.envio)} · IVA: ${cop(t.iva)}<br><b style="font-size:18px">Total: ${cop(t.total)}</b></div>
<div class="bar"><button class="btn" onclick="cq();saveCot()">Guardar</button><button class="btn g" onclick="close()">Cancelar</button></div>`)}
function cq(redraw){const g=i=>document.getElementById(i);if(g('q_cliente')){CQ.cliente=g('q_cliente').value;CQ.lista_precios=g('q_lista').value;CQ.oportunidad=+g('q_op').value||null;CQ.desc_publico=+g('q_dp').value;CQ.desc_volumen=+g('q_dv').value;CQ.desc_adicional=+g('q_da').value;CQ.envio=+g('q_env').value;CQ.impuestos=+g('q_iva').value;CQ.validez_dias=+g('q_val').value;CQ.condiciones=g('q_con').value;CQ.notas=g('q_not').value}drawCQ()}
function saveCot(){if(!CQ.items.length){toast('Agrega al menos un ítem');drawCQ();return}const id=CQ._id;delete CQ._id;
if(id){Object.assign(S.cotizaciones.find(x=>x.id===id),CQ)}else{CQ.id=nid();CQ.numero=S.ajustes.prefijo+String(S.ajustes.proximo).padStart(4,'0');S.ajustes.proximo++;S.cotizaciones.push(CQ);const o=S.oportunidades.find(x=>x.id===CQ.oportunidad);if(o&&ETAPAS.indexOf(o.etapa)<3)o.etapa='cotizado'}
close();view='cotizaciones';render();toast('Cotización guardada')}
function verCot(id){const c=S.cotizaciones.find(x=>x.id===id),t=totales(c);const txt=`*Nativa Distribuciones* – Cotización ${c.numero}\nCliente: ${c.cliente}\n`+c.items.map(it=>{const p=S.productos.find(x=>x.id==it.pid);return p?`• ${it.cant} x ${p.nombre}: ${cop(precio(p,c.lista_precios)*it.cant)}`:''}).join('\n')+`\nEnvío: ${cop(c.envio)}\nIVA ${c.impuestos}%: ${cop(t.iva)}\n*Total: ${cop(t.total)}*\nVálida hasta ${addD(c.fecha,+c.validez_dias)}\n${c.condiciones||''}`;window._wa=txt;
modal(`<div class="doc"><h3 style="color:var(--ac2)">Nativa Distribuciones</h3><small>Documento de ejemplo · Cali, Colombia (ficticio)</small><h3>${c.numero} · ${c.fecha}</h3><p>Cliente: <b>${esc(c.cliente)}</b> · Lista ${c.lista_precios}</p><table><tr><th>Ítem</th><th>Cant.</th><th>Precio</th><th>Total</th></tr>${c.items.map(it=>{const p=S.productos.find(x=>x.id==it.pid);if(!p)return'';const pr=precio(p,c.lista_precios);return `<tr><td>${esc(p.nombre)}</td><td>${it.cant}</td><td>${cop(pr)}</td><td>${cop(pr*it.cant)}</td></tr>`}).join('')}</table><p>Subtotal ${cop(t.sub)}<br>Descuentos −${cop(t.pub+t.v+t.a)}<br>Envío ${cop(c.envio)}<br>IVA (${c.impuestos}%) ${cop(t.iva)}<br><b style="font-size:17px">Total ${cop(t.total)}</b></p><p>Válida hasta ${addD(c.fecha,+c.validez_dias)} (${c.validez_dias} días)</p><p><b>Condiciones:</b> ${esc(c.condiciones)}</p>${c.notas?`<p>${esc(c.notas)}</p>`:''}</div><div class="bar noprint" style="margin-top:10px"><button class="btn" onclick="window.print()">Imprimir</button><button class="btn g" onclick="copiar()">Copiar texto WhatsApp</button><button class="btn g" onclick="close()">Cerrar</button></div>`)}
function copiar(){try{navigator.clipboard.writeText(_wa).then(()=>toast('Texto copiado'),()=>fb())}catch(e){fb()}}
function fb(){const t=document.createElement('textarea');t.value=_wa;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Texto copiado')}catch(e){}t.remove()}
function productos(){const q=(ui.q.pr||'').toLowerCase();const l=S.productos.filter(p=>!q||(p.sku+p.nombre+p.categoria).toLowerCase().includes(q));
return `<h2>Productos</h2><div class="demo">Datos de ejemplo ficticios</div><div class="bar">${search('pr')}<button class="btn" onclick="editP()">+ Producto</button></div><div class="card tw"><table><tr><th>SKU</th><th>Nombre</th><th>Categoría</th><th>Unidad</th><th>Público</th><th>Mayorista</th><th>Distrib.</th><th>Especial</th><th></th></tr>${l.map(p=>`<tr><td>${esc(p.sku)}</td><td>${esc(p.nombre)}</td><td>${p.categoria}</td><td>${p.unidad}</td><td>${cop(p.precio_publico)}</td><td>${cop(p.precio_mayorista)}</td><td>${cop(p.precio_distribuidor)}</td><td>${cop(p.precio_especial)}</td><td><button class="btn s g" onclick="editP(${p.id})">Editar</button> <button class="btn s d" onclick="delP(${p.id})">Eliminar</button></td></tr>`).join('')}</table></div>`}
function editP(id){const p=id?S.productos.find(x=>x.id===id):{categoria:'Abarrotes',unidad:'Unidad',umbral:10,precio_publico:0,precio_mayorista:0,precio_distribuidor:0,precio_especial:0};
form(id?'Editar producto':'Nuevo producto',[{k:'sku',l:'SKU',req:1},{k:'nombre',l:'Nombre',req:1},{k:'categoria',l:'Categoría',t:'select',o:['Abarrotes','Granos','Aceites','Lácteos','Bebidas','Aseo']},{k:'unidad',l:'Unidad',t:'select',o:['Unidad','Caja','Bulto','Paquete']},{k:'precio_publico',l:'Precio público',t:'number',req:1},{k:'precio_mayorista',l:'Precio mayorista',t:'number'},{k:'precio_distribuidor',l:'Precio distribuidor',t:'number'},{k:'precio_especial',l:'Precio especial',t:'number'},{k:'umbral',l:'Umbral de volumen',t:'number'}],p,v=>{if(id)Object.assign(p,v);else S.productos.push({id:nid(),...v});render()})}
function delP(id){confirmar('¿Eliminar producto?',()=>{S.productos=S.productos.filter(p=>p.id!==id);render()})}
function cadencias(){return `<h2>Cadencias</h2><div class="demo">Datos de ejemplo ficticios</div><div class="bar"><button class="btn" onclick="editCad()">+ Cadencia</button></div><div class="grid k4">${S.cadencias.map(c=>`<div class="card"><h3>${esc(c.nombre)}</h3><p>${esc(c.descripcion)}</p>${pasos(c).map(p=>`<div class="row">Día ${p.dia} · <span class="tag">${p.canal}</span> ${esc(p.tarea)}</div>`).join('')}<div class="bar" style="margin-top:8px"><button class="btn s g" onclick="editCad(${c.id})">Editar</button><button class="btn s d" onclick="delCad(${c.id})">Eliminar</button></div></div>`).join('')}</div>`}
function editCad(id){const c=id?S.cadencias.find(x=>x.id===id):{nombre:'',descripcion:'',pasos:'0|Llamada|Primer contacto'};
form(id?'Editar cadencia':'Nueva cadencia',[{k:'nombre',l:'Nombre',req:1,w:1},{k:'descripcion',l:'Descripción',w:1},{k:'pasos',l:'Pasos: una línea por paso con formato día|canal|tarea (canal: Llamada, WhatsApp, Correo o Visita)',t:'textarea',req:1,w:1}],c,v=>{if(id)Object.assign(c,v);else S.cadencias.push({id:nid(),...v});render()})}
function delCad(id){confirmar('¿Eliminar cadencia?',()=>{S.cadencias=S.cadencias.filter(c=>c.id!==id);render()})}
function ajustes(){const a=S.ajustes;return `<h2>Ajustes</h2><div class="card"><h3>Rol activo (simula permisos)</h3><div class="bar">${sel(['asesor','gerente'],S.rol,'a_rol','onchange="cambiaRol()"')}${sel(names(),S.usuario,'a_usr','onchange="cambiaRol()"')}</div><small>El asesor solo ve lo suyo; el gerente ve todo el equipo y reasigna.</small></div>
<div class="card"><h3>Equipo comercial</h3>${S.equipo.map(e=>`<div class="row"><span>${esc(e.nombre)} <span class="tag">${e.rol}</span></span><span><button class="btn s g" onclick="editE(${e.id})">Editar</button> <button class="btn s d" onclick="delE(${e.id})">Eliminar</button></span></div>`).join('')}<div class="bar" style="margin-top:8px"><button class="btn" onclick="editE()">+ Miembro</button></div></div>
<div class="card"><h3>Cotizaciones</h3><div class="fg"><div><label>Prefijo</label><input id="s_pre" value="${esc(a.prefijo)}"></div><div><label>Próximo número</label><input id="s_nx" type="number" value="${a.proximo}"></div><div><label>Validez por defecto (días)</label><input id="s_va" type="number" value="${a.validez}"></div><div><label>IVA por defecto %</label><input id="s_iv" type="number" value="${a.iva}"></div><div class="w"><label>Condiciones predeterminadas</label><textarea id="s_co" rows="2">${esc(a.condiciones)}</textarea></div></div><button class="btn" style="margin-top:8px" onclick="saveAj()">Guardar</button></div>
<div class="card"><h3>Datos</h3><button class="btn" onclick="document.getElementById('ex').value=JSON.stringify(S,null,1)">Exportar datos</button> <button class="btn g" onclick="imp()">Importar</button> <button class="btn d" onclick="confirmar('¿Restablecer datos de ejemplo?',()=>{S=seed();render()})">Restablecer ejemplo</button><textarea id="ex" rows="7" style="margin-top:8px" placeholder="JSON de exportación / pegar para importar"></textarea></div>`}
function cambiaRol(){S.rol=document.getElementById('a_rol').value;S.usuario=document.getElementById('a_usr').value;render()}
function saveAj(){const g=i=>document.getElementById(i).value;S.ajustes={prefijo:g('s_pre'),proximo:+g('s_nx')||1,validez:+g('s_va')||15,iva:+g('s_iv')||0,condiciones:g('s_co')};save();toast('Ajustes guardados')}
function imp(){try{const o=JSON.parse(document.getElementById('ex').value);if(!o.contactos||!o.ajustes)throw 0;S=o;render();toast('Datos importados')}catch(e){toast('JSON no válido')}}
function editE(id){const e=id?S.equipo.find(x=>x.id===id):{nombre:'',rol:'asesor'};form(id?'Editar miembro':'Nuevo miembro',[{k:'nombre',l:'Nombre',req:1},{k:'rol',l:'Rol',t:'select',o:['asesor','gerente']}],e,v=>{if(id)Object.assign(e,v);else S.equipo.push({id:nid(),...v});render()})}
function delE(id){if(S.equipo.length<2){toast('Debe quedar al menos un miembro');return}confirmar('¿Eliminar miembro del equipo?',()=>{S.equipo=S.equipo.filter(e=>e.id!==id);if(!names().includes(S.usuario))S.usuario=S.equipo[0].nombre;render()})}
load();render();
</script>
</body>
</html>
