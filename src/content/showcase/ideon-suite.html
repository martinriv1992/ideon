<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ideon Business Suite · Comercializadora Norte</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F6F8F7;--fg:#2B2F33;--ac:#0E9F6E;--ac2:#0b7f58;--mut:#6b7378;--bd:#e3e8e6;--bad:#d64545;--warn:#b97a06;--info:#2f6fb5}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100vh}
.side{width:244px;background:#232a2e;color:#d9e2de;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;padding:18px 12px;z-index:30;overflow:auto;transition:transform .25s}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 16px;border-bottom:1px solid #38424a;margin-bottom:12px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#12c08a,#0a7a55);display:grid;place-items:center;color:#fff;font-weight:700}
.brand b{display:block;color:#fff;font-size:14px}.brand small{color:#93a39c;font-size:11px}
.ni{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;padding:9px 10px;border-radius:9px;cursor:pointer;text-align:left;margin-bottom:2px}
.ni:hover{background:#2f383d}.ni.on{background:var(--ac);color:#fff}
.ni svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sf{margin-top:auto;padding:14px 8px 0;border-top:1px solid #38424a;font-size:12px}
.sf select{width:100%;margin-top:6px;background:#2f383d;color:#fff;border:1px solid #46525a;border-radius:8px;padding:7px}
.top{display:none;position:fixed;top:0;left:0;right:0;height:52px;background:#232a2e;color:#fff;align-items:center;gap:12px;padding:0 14px;z-index:20}
.top button{background:none;border:0;color:#fff;font-size:24px;cursor:pointer}
main{margin-left:244px;flex:1;padding:24px 28px 60px;min-width:0}
.demo{background:#e6f6ef;border:1px solid #bfe6d4;color:#0b6b4b;padding:7px 12px;border-radius:9px;font-size:12px;margin-bottom:16px}
.ph{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:0;font-size:24px;letter-spacing:-.4px}.ph p{margin:3px 0 0;color:var(--mut)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--bd);background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:#b9c4bf}.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}.btn.p:hover{background:var(--ac2)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}.btn.sm{padding:4px 9px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(20,40,30,.04);margin-bottom:18px}
.card h2{margin:0 0 12px;font-size:16px}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px;border-left:4px solid var(--ac)}
.kpi.r{border-left-color:var(--bad)}.kpi.w{border-left-color:#e0a21a}.kpi.i{border-left-color:var(--info)}
.kl{color:var(--mut);font-size:12px;font-weight:500}.kpi b{display:block;font-size:24px;letter-spacing:-.5px;margin:4px 0}.kpi small{color:var(--mut)}
.g2{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}.g2>.card{min-width:0}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #eef1f0;vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}tr:hover td{background:#fafcfb}
td .btn{margin-right:4px}.ac{white-space:nowrap}
.bd{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;background:#eceff0;color:#56606a}
.bd.ok{background:#dcf5ea;color:#0a7a55}.bd.warn{background:#fdf0d3;color:#8a5b00}.bd.bad{background:#fde1e1;color:#b32d2d}.bd.info{background:#e1ecf9;color:#25588f}
.fb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end}
.fb label,.fm label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px;font-weight:500}
input,select,textarea{border:1px solid #d3dbd8;border-radius:8px;padding:8px 10px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #b5e8d3;border-color:var(--ac)}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fm .w{grid-column:1/-1}.fm input,.fm select,.fm textarea{width:100%;color:var(--fg)}
.er{color:var(--bad);font-size:12px;margin-top:8px;min-height:16px}
#modal{position:fixed;inset:0;background:rgba(25,35,32,.5);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
#modal.show{display:flex}
.mbox{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mbox.lg{max-width:820px}.mbox.sm{max-width:420px}.mbox h3{margin:0 0 14px;font-size:18px}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;bottom:20px;right:20px;background:#232a2e;color:#fff;padding:11px 16px;border-radius:10px;opacity:0;transform:translateY(10px);transition:.25s;z-index:80;pointer-events:none;max-width:320px}
#toast.show{opacity:1;transform:none}
.chart{width:100%;height:auto}.chart text{font-size:11px;fill:#6b7378}.lg2{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px;flex-wrap:wrap}
.lg2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.bar{height:8px;background:#e8efec;border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#12c08a,#0E9F6E)}
.tp{padding:9px 0;border-bottom:1px solid #eef1f0}.tp .r{display:flex;justify-content:space-between;gap:8px}
.al{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #eef1f0;align-items:center}
.al a{color:var(--ac2);cursor:pointer;font-weight:600;font-size:12px;white-space:nowrap}
.pos{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px;max-height:560px;overflow:auto}
.pc{border:1px solid var(--bd);border-radius:11px;padding:10px;text-align:left;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.pc:hover:not(:disabled){border-color:var(--ac);background:#f3fbf7}.pc:disabled{opacity:.5;cursor:not-allowed}
.pc b{font-size:13px}.pc small{color:var(--mut)}.pc .pr{font-weight:700;color:var(--ac2)}
.cl{display:grid;grid-template-columns:1fr 70px 80px 26px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #eef1f0}
.cl input{width:100%;padding:5px}.tot{margin-top:12px;background:#f4f8f6;border-radius:11px;padding:12px}
.tot div{display:flex;justify-content:space-between;padding:2px 0}.tot .t{font-size:20px;font-weight:700;border-top:1px solid #d6e2dc;margin-top:6px;padding-top:8px}
.lrow{display:grid;grid-template-columns:1fr 70px 100px 60px 90px 28px;gap:6px;align-items:center;margin-bottom:6px}
.lrow.oc{grid-template-columns:1fr 70px 110px 90px 28px}.lrow input,.lrow select{width:100%;padding:6px}
.ib{border:0;background:none;color:var(--bad);font-size:18px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.chip{background:#eef5f2;border-radius:9px;padding:6px 10px;font-size:12px}.chip b{display:block;font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}.tabs button{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:7px 16px;cursor:pointer}.tabs .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.doc{border:1px solid var(--bd);border-radius:12px;padding:22px;background:#fff}
.dh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ac);padding-bottom:12px;margin-bottom:12px}
.dh h2{margin:0;font-size:18px}.dh p{margin:4px 0 0;color:var(--mut);font-size:12px}.dn{text-align:right}.dn b{display:block;color:var(--ac2);letter-spacing:1px}.dn span{font-size:20px;font-weight:700}.dn small{display:block;color:var(--mut)}
.dt{margin-left:auto;width:260px;margin-top:10px}.dt div{display:flex;justify-content:space-between;padding:2px 0}.dt .t{font-weight:700;font-size:16px;border-top:1px solid var(--bd);padding-top:5px}
.note{color:var(--mut);font-size:12px;margin-top:10px}
textarea.js{width:100%;height:150px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
@media(max-width:900px){.side{transform:translateX(-100%)}.side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}.top{display:flex}main{margin:0;padding:68px 14px 50px}.g2,.pos{grid-template-columns:1fr}.fm{grid-template-columns:1fr}.lrow,.lrow.oc{grid-template-columns:1fr 1fr}.lrow .ib{justify-self:end}}
@media print{body.mo #app,#toast{display:none!important}body.mo #modal{position:static;background:none;display:block;padding:0}body.mo .mbox{box-shadow:none;max-width:none;padding:0}.noprint{display:none!important}.doc{border:0}}
</style>
</head>
<body>
<div id="app">
<div class="top"><button data-act="menu" aria-label="Menú">☰</button><b>Comercializadora Norte</b></div>
<aside class="side" id="side"></aside>
<main id="main"></main>
</div>
<div id="modal"></div>
<div id="toast"></div>
<script>
const KEY='ideon-business-suite-comercializadora-norte';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n||0).toLocaleString('es-CO');
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);
const pad=n=>String(n).padStart(4,'0');
const fd=s=>s?s.split('-').reverse().join('/'):'—';
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const VEND=['Laura Gómez','Andrés Pérez','Marta Ríos'];
const PAGOS=['Efectivo','Tarjeta','Transferencia','Crédito'];
const CATP=['Abarrotes','Aseo','Bebidas','Papelería','Ferretería'];
const CATG=['Arriendo','Nómina','Servicios','Transporte','Marketing','Otros'];
const CIU=['Barranquilla','Cartagena','Santa Marta','Montería','Valledupar'];
const PLAZO={'Contado':0,'15 días':15,'30 días':30,'45 días':45};
const sum=(a,f)=>a.reduce((x,y)=>x+(typeof f==='function'?f(y):y[f]||0),0);
const by=(a,id)=>a.find(x=>x.id==id);
let S,page='dashboard',CB=null,E=null;
const uid=()=>++S.seq.id;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const cli=id=>by(S.clientes,id);
const cname=id=>id?(cli(id)?cli(id).nombre:'(cliente eliminado)'):'Mostrador';
const low=p=>p.stock<p.stockMinimo;
const estF=f=>f.tipo==='Factura'&&f.saldo>0.5&&f.vencimiento<today()?'Vencida':f.estado;
const BC={Pagada:'ok',Pendiente:'warn',Vencida:'bad',Borrador:'',Enviada:'info',Aceptada:'ok',Rechazada:'bad',Pedida:'warn',Recibida:'ok'};
const bd=(t,c)=>`<span class="bd ${c??BC[t]??''}">${esc(t)}</span>`;
const opt=(l,s)=>l.map(o=>`<option value="${esc(o)}"${o==s?' selected':''}>${esc(o)}</option>`).join('');
const optI=(a,s,k='nombre')=>a.map(o=>`<option value="${o.id}"${o.id==s?' selected':''}>${esc(o[k])}</option>`).join('');
function totals(l,desc){const sub=sum(l,x=>x.cant*x.precio);const d=Math.min(desc||0,sub);const base=sub-d;const iva=sum(l,x=>x.cant*x.precio*(x.iva||0)/100)*(sub?base/sub:0);return{sub,d,base,iva,total:base+iva}}
const mkLine=(p,c)=>({pid:p.id,nombre:p.nombre,cant:c,precio:p.precio,costo:p.costo,iva:S.cfg.iva});

function buildVenta(o){const t=totals(o.lineas,o.descuento),cr=o.formaPago==='Crédito';
const v={id:uid(),numero:'VTA-'+pad(++S.seq.vta),fecha:o.fecha,clienteId:o.clienteId,vendedor:o.vendedor,formaPago:o.formaPago,descuento:t.d,base:t.base,iva:t.iva,total:t.total,costo:sum(o.lineas,l=>l.cant*l.costo),lineas:o.lineas};
const f={id:uid(),numero:S.cfg.pFac+'-'+pad(++S.seq.fac),tipo:'Factura',clienteId:o.clienteId,emision:o.fecha,vencimiento:cr?addDays(o.fecha,30):o.fecha,estado:cr?'Pendiente':'Pagada',total:t.total,saldo:cr?t.total:0,lineas:o.lineas,descuento:t.d,ventaId:v.id,pagos:cr?[]:[{fecha:o.fecha,monto:t.total,medio:o.formaPago}]};
v.facturaId=f.id;S.ventas.push(v);S.facturas.push(f);return{v,f}}

function seed(){
let r=11;const rnd=()=>(r=r*16807%2147483647)/2147483647,ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)),pick=a=>a[ri(0,a.length-1)];
S={cfg:{nombre:'Comercializadora Norte S.A.S. (demo)',nit:'900.123.456-7',dir:'Calle 00 # 00-00, Barranquilla (dirección ficticia)',iva:19,pFac:'FAC',pCot:'COT',pOc:'OC'},user:'gerente',seq:{id:100,fac:0,cot:0,oc:0,vta:0},clientes:[],productos:[],proveedores:[],ventas:[],facturas:[],compras:[],gastos:[],movs:[]};
[['Distribuciones Caribe Sur S.A.S.','900.100.201-1','Barranquilla',8000000],['Minimercado Los Almendros','900.100.202-2','Cartagena',5000000],['Papelería El Estudiante','900.100.203-3','Santa Marta',3000000],['Ferretería Costa Norte','900.100.204-4','Barranquilla',6000000],['Hotel Brisa Demo','900.100.205-5','Cartagena',7000000],['Restaurante Sabor Ficticio','900.100.206-6','Montería',4000000],['Colegio Nuevo Horizonte','900.100.207-7','Valledupar',5000000],['Droguería Santa Lucía Demo','900.100.208-8','Santa Marta',3500000],['Cafetería La Ceiba','900.100.209-9','Barranquilla',2500000],['Tienda Doña Rosa','1.000.000.210','Montería',1500000]].forEach((c,i)=>S.clientes.push({id:uid(),nombre:c[0],documento:c[1],email:'compras'+(i+1)+'@ejemplo.com',telefono:'300 555 01'+pad(i*7+10).slice(2),ciudad:c[2],cupo:c[3]}));
[['ABA','Arroz Premium 500 g',1800],['ABA','Aceite de girasol 1 L',9200],['ABA','Azúcar refinada 1 kg',3400],['ABA','Lentejas 500 g',2900],['ABA','Pasta espagueti 250 g',1700],['ASE','Detergente en polvo 1 kg',8500],['ASE','Jabón de baño x3',5200],['ASE','Papel higiénico x12',14500],['ASE','Cloro 1 L',3100],['ASE','Desinfectante lavanda 1 L',5600],['BEB','Agua mineral 600 ml',1100],['BEB','Jugo de naranja 1 L',3900],['BEB','Gaseosa cola 1,5 L',3600],['BEB','Café molido 250 g',7800],['PAP','Cuaderno cuadriculado 100 h',3200],['PAP','Resma carta 500 h',13800],['PAP','Bolígrafo azul x12',6400],['PAP','Marcadores x6',7200],['FER','Martillo 16 oz',16500],['FER','Cinta métrica 5 m',8900]].forEach((p,i)=>{const mn=ri(10,25),cat=CATP[Math.floor(i/5)>3?4:Math.floor(i/5)];S.productos.push({id:uid(),sku:p[0]+'-'+pad(i+1).slice(1),nombre:p[1],categoria:i>=18?'Ferretería':cat,costo:p[2],precio:Math.round(p[2]*(1.22+rnd()*.18)/50)*50,stock:[3,8,13].includes(i)?ri(2,mn-1):ri(30,120),stockMinimo:mn})});
[['Alimentos del Caribe Demo S.A.S.','901.200.101-1','Julián Mora (ficticio)','30 días'],['Aseo Total Ficticio Ltda.','901.200.102-2','Paula Díaz (ficticia)','15 días'],['Bebidas Sol y Mar (demo)','901.200.103-3','Camilo Ruiz (ficticio)','Contado'],['Papeles del Norte Demo','901.200.104-4','Sandra Vega (ficticia)','45 días'],['Ferrosur Suministros Demo','901.200.105-5','Héctor Peña (ficticio)','30 días'],['Agroinsumos La Ceiba Demo','901.200.106-6','Luisa Mena (ficticia)','15 días']].forEach((p,i)=>S.proveedores.push({id:uid(),nombre:p[0],nit:p[1],contacto:p[2],telefono:'(605) 555-01'+(20+i),plazoPago:p[3]}));
const ds=Array.from({length:30},(_,i)=>i<3?0:ri(1,165)).sort((a,b)=>b-a);
ds.forEach((d,idx)=>{const fecha=addDays(today(),-d);const forced=idx===27||idx===5;const cid=forced||rnd()<.9?pick(S.clientes).id:null;const pg=forced?'Crédito':cid?pick(['Efectivo','Tarjeta','Transferencia','Crédito','Transferencia']):pick(['Efectivo','Tarjeta']);const lin=[],used=new Set(),n=ri(1,3);
while(lin.length<n){const p=pick(S.productos);if(used.has(p.id))continue;used.add(p.id);lin.push(mkLine(p,cid?ri(8,60):ri(1,5)))}
const sub=sum(lin,l=>l.cant*l.precio);const{v,f}=buildVenta({fecha,clienteId:cid,vendedor:pick(VEND),formaPago:pg,lineas:lin,descuento:rnd()<.25?Math.round(sub*.05):0});
lin.forEach(l=>S.movs.push({id:uid(),fecha,pid:l.pid,tipo:'venta',cant:-l.cant,motivo:'Venta '+v.numero}));
if(pg==='Crédito'&&idx!==27&&rnd()<.45){const ab=Math.round(f.total/2);f.saldo-=ab;f.pagos.push({fecha:d>4?addDays(fecha,3):fecha,monto:ab,medio:'Transferencia'})}});
['Aceptada','Enviada','Borrador','Rechazada','Enviada','Borrador'].forEach((es,i)=>{const lin=[mkLine(pick(S.productos),ri(10,40)),mkLine(pick(S.productos),ri(5,30))];const fecha=addDays(today(),-ri(2,40));S.facturas.push({id:uid(),numero:'COT-'+pad(++S.seq.cot),tipo:'Cotización',clienteId:pick(S.clientes).id,emision:fecha,vencimiento:addDays(fecha,15),estado:es,lineas:lin,descuento:0,total:totals(lin,0).total,saldo:0,pagos:[],convertida:null})});
for(let i=0;i<10;i++){const fecha=addDays(today(),-(165-i*16)),pr=S.proveedores[i%6],rec=i<8,lin=[],used=new Set();
while(lin.length<ri(1,3)){const p=pick(S.productos);if(used.has(p.id))continue;used.add(p.id);lin.push({pid:p.id,nombre:p.nombre,cant:ri(20,80),precio:p.costo,costo:p.costo})}
const total=sum(lin,l=>l.cant*l.costo),vence=addDays(fecha,PLAZO[pr.plazoPago]);let saldo=0,pagos=[];
if(rec){saldo=i<5?0:(i%2?total:Math.round(total/2));if(i<5)pagos.push({fecha:vence,monto:total,medio:'Transferencia'});else if(saldo<total)pagos.push({fecha:addDays(fecha,5),monto:total-saldo,medio:'Transferencia'});lin.forEach(l=>S.movs.push({id:uid(),fecha,pid:l.pid,tipo:'compra',cant:l.cant,motivo:'Compra OC-'+pad(i+1)}))}
S.compras.push({id:uid(),numero:'OC-'+pad(++S.seq.oc),fecha,proveedorId:pr.id,estado:rec?'Recibida':'Pedida',lineas:lin,total,saldo,vence:rec?vence:null,pagos})}
const base={Arriendo:[1100000,1300000],'Nómina':[2000000,2400000],Servicios:[300000,450000],Transporte:[200000,380000],Marketing:[150000,320000],Otros:[80000,200000]},nd=new Date(),dsc={Arriendo:'Arriendo bodega (ficticio)','Nómina':'Nómina del mes (ejemplo)',Servicios:'Energía, agua e internet',Transporte:'Fletes de distribución',Marketing:'Pauta digital y volantes',Otros:'Gastos varios de oficina'};

function bars(d,names,cols){const W=640,H=260,L=48,B=30,T=12,R=8;const max=Math.max(1,...d.flatMap(x=>x.v))*1.1;const n=Math.max(1,d.length),gw=(W-L-R)/n,k=d[0]?d[0].v.length:1,bw=Math.min(30,gw/(k+1));
const sh=v=>v>=1e6?(v/1e6).toFixed(1).replace('.0','')+' M':v>=1e3?Math.round(v/1e3)+' k':Math.round(v);
let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Gráfico de barras">`;
for(let i=0;i<=4;i++){const y=T+(H-T-B)*(1-i/4);s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#e5ebe8"/><text x="${L-6}" y="${y+4}" text-anchor="end">${sh(max*i/4)}</text>`}
d.forEach((x,i)=>{const x0=L+gw*i+(gw-bw*k)/2;x.v.forEach((v,j)=>{const h=(H-T-B)*v/max;s+=`<rect x="${x0+bw*j}" y="${H-B-h}" width="${bw-2}" height="${Math.max(h,0)}" rx="3" fill="${cols[j]}"><title>${esc(x.l)} · ${names[j]}: ${money(v)}</title></rect>`});s+=`<text x="${L+gw*i+gw/2}" y="${H-10}" text-anchor="middle">${esc(x.l.length>11?x.l.slice(0,10)+'…':x.l)}</text>`});
return s+'</svg><div class="lg2">'+names.map((x,j)=>`<span><i style="background:${cols[j]}"></i>${x}</span>`).join('')+'</div>'}

V.finanzas=()=>ph('Finanzas','Cuentas por cobrar, cuentas por pagar y gastos')+`<div class="tabs">${[['cxc','Cuentas por cobrar'],['cxp','Cuentas por pagar'],['gas','Gastos']].map(t=>`<button class="${F.ftab===t[0]?'on':''}" data-act="ftab" data-id="${t[0]}">${t[1]}</button>`).join('')}</div>`+(F.ftab==='cxc'?cxcV():F.ftab==='cxp'?cxpV():gasV());
function cxcV(){const a=S.facturas.filter(f=>f.tipo==='Factura'&&f.saldo>0.5).sort((x,y)=>x.vencimiento.localeCompare(y.vencimiento)),g={};a.forEach(f=>g[cname(f.clienteId)]=(g[cname(f.clienteId)]||0)+f.saldo);

function payM(id){const c=by(S.compras,id);openM(`<h3>Pago a proveedor · ${c.numero}</h3><p>${esc(pvn(c.proveedorId))} · Saldo: <b>${money(c.saldo)}</b></p><form data-form="pago" data-id="${id}"><div class="fm"><label>Monto (COP)<input type="number" name="monto" min="1" max="${Math.round(c.saldo)}" value="${Math.round(c.saldo)}" required></label><label>Fecha<input type="date" name="fecha" value="${today()}" required></label><label class="w">Medio<select name="medio">${opt(['Transferencia','Efectivo','Cheque'])}</select></label></div><div class="er" id="pger"></div><div class="mf"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn p">Registrar pago</button></div></form>`,'sm')}

function group(items,kf,vf){const ks=items.map(kf).sort();const span=ks.length?diff(ks[ks.length-1],ks[0]):0,g={};items.forEach(i=>{const k=span>31?kf(i).slice(0,7):kf(i);g[k]=(g[k]||0)+vf(i)});return Object.entries(g).sort().slice(-14).map(([k,v])=>({l:k.length===7?MES[+k.slice(5)-1]+' '+k.slice(2,4):k.slice(5).split('-').reverse().join('/'),v:[v]}))}
function repData(){const f=F.rep,inR=d=>(!f.d1||d>=f.d1)&&(!f.d2||d<=f.d2),t=f.tipo;let r;
if(t==='ventas'){const a=S.ventas.filter(v=>inR(v.fecha));r={cols:['Fecha','Número','Cliente','Pago','Total'],rows:a.map(v=>[v.fecha,v.numero,cname(v.clienteId),v.formaPago,Math.round(v.total)]),m:[4],sum:[['Ventas',a.length],['Total vendido',money(sum(a,'total'))],['Ticket promedio',money(a.length?sum(a,'total')/a.length:0)]],ch:group(a,v=>v.fecha,v=>v.total)}}
else if(t==='utilidad'){const a=S.ventas.filter(v=>inR(v.fecha)),ing=sum(a,'base'),co=sum(a,'costo');r={cols:['Fecha','Número','Ingreso neto','Costo','Utilidad','Margen %'],rows:a.map(v=>[v.fecha,v.numero,Math.round(v.base),Math.round(v.costo),Math.round(v.base-v.costo),v.base?Math.round((v.base-v.costo)/v.base*100):0]),m:[2,3,4],sum:[['Ingresos netos',money(ing)],['Costo vendido',money(co)],['Utilidad bruta',money(ing-co)],['Margen',(ing?Math.round((ing-co)/ing*100):0)+'%']],ch:group(a,v=>v.fecha,v=>v.base-v.costo)}}
else if(t==='gastos'){const a=S.gastos.filter(g=>inR(g.fecha));r={cols:['Fecha','Categoría','Descripción','Monto'],rows:a.map(g=>[g.fecha,g.categoria,g.descripcion||'',g.monto]),m:[3],sum:[['Registros',a.length],['Total gastos',money(sum(a,'monto'))]],ch:CATG.map(c=>({l:c,v:[sum(a.filter(g=>g.categoria===c),'monto')]}))}}
else if(t==='inventario'){const a=S.productos;r={cols:['SKU','Producto','Stock','Costo','Valor'],rows:a.map(p=>[p.sku,p.nombre,p.stock,p.costo,p.stock*p.costo]),m:[3,4],sum:[['Productos',a.length],['Unidades',sum(a,'stock')],['Valor del inventario',money(sum(a,p=>p.stock*p.costo))]],ch:a.slice().sort((x,y)=>y.stock*y.costo-x.stock*x.costo).slice(0,8).map(p=>({l:p.nombre,v:[p.stock*p.costo]}))}}
else{const a=S.facturas.filter(x=>x.tipo==='Factura'&&x.saldo>0.5),g={};a.forEach(x=>g[cname(x.clienteId)]=(g[cname(x.clienteId)]||0)+x.saldo);r={cols:['Factura','Cliente','Vence','Mora (días)','Saldo','Estado'],rows:a.map(x=>[x.numero,cname(x.clienteId),x.vencimiento,Math.max(0,diff(today(),x.vencimiento)),Math.round(x.saldo),estF(x)]),m:[4],sum:[['Facturas con saldo',a.length],['Cartera total',money(sum(a,'saldo'))],['Cartera vencida',money(sum(a.filter(x=>estF(x)==='Vencida'),'saldo'))]],ch:Object.entries(g).slice(0,8).map(([l,v])=>({l,v:[v]}))}}
return r}

proveedores:{t:'proveedor',f:[['nombre','Razón social','text',1],['nit','NIT','text',1],['contacto','Contacto','text'],['telefono','Teléfono','tel'],['plazoPago','Plazo de pago','select',1,Object.keys(PLAZO)]]},
gastos:{t:'gasto',f:[['fecha','Fecha','date',1],['categoria','Categoría','select',1,CATG],['descripcion','Descripción','textarea'],['monto','Monto (COP)','number',1]]}};
function formM(ent,id){const sc=SC[ent],r=id?by(S[ent],id):{};
openM(`<h3>${id?'Editar':'Nuevo'} ${sc.t}</h3><form data-form="crud" data-ent="${ent}" data-id="${id||''}"><div class="fm">${sc.f.map(f=>{let v=r[f[0]]??(f[0]==='fecha'?today():'');const i=f[2]==='select'?`<select name="${f[0]}">${opt(f[4],v)}</select>`:f[2]==='textarea'?`<textarea name="${f[0]}" rows="3">${esc(v)}</textarea>`:`<input type="${f[2]}" name="${f[0]}" value="${esc(v)}" ${f[3]?'required':''} ${f[2]==='number'?'min="0"':''}>`;return `<label class="${f[2]==='textarea'?'w':''}">${f[1]}${f[3]?' *':''}${i}</label>`}).join('')}</div><div class="er" id="crer"></div><div class="mf"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn p">Guardar</button></div></form>`)}

function csvDl(){const r=repData(),q=v=>'"'+String(v).replace(/"/g,'""')+'"',txt='\ufeff'+[r.cols,...r.rows].map(x=>x.map(q).join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download='reporte-'+F.rep.tipo+'-'+today()+'.csv';document.body.appendChild(a);a.click();a.remove();toast('CSV descargado')}
function recibir(id){const c=by(S.compras,id),pr=by(S.proveedores,c.proveedorId);c.lineas.forEach(l=>{const p=by(S.productos,l.pid);if(p){p.stock+=l.cant;p.costo=l.costo;S.movs.push({id:uid(),fecha:today(),pid:p.id,tipo:'compra',cant:l.cant,motivo:'Compra '+c.numero})}});c.estado='Recibida';c.saldo=c.total;c.vence=addDays(today(),PLAZO[pr?pr.plazoPago:'Contado']);save();render();toast('Compra recibida: stock y costos actualizados; cuenta por pagar creada')}

const ACT={
go:id=>{page=id;$('#side').classList.remove('open');render();scrollTo(0,0)},
menu:()=>$('#side').classList.toggle('open'),close:closeM,yes:()=>{const f=CB;CB=null;closeM();f&&f()},print:()=>window.print(),
new:(id,el)=>formM(el.dataset.ent),edit:(id,el)=>formM(el.dataset.ent,id),
del:(id,el)=>{const e=el.dataset.ent,r=by(S[e],id);let blk='';if(e==='clientes'&&S.facturas.some(f=>f.clienteId==id))blk='Este cliente tiene facturas o cotizaciones; no se puede eliminar.';if(e==='proveedores'&&S.compras.some(c=>c.proveedorId==id))blk='Este proveedor tiene compras registradas; no se puede eliminar.';
if(blk)return toast(blk);ask(`¿Eliminar ${SC[e].t} <b>${esc(r.nombre||r.descripcion||r.categoria)}</b>? Esta acción no se puede deshacer.`,()=>{S[e]=S[e].filter(x=>x.id!=id);save();render();toast('Registro eliminado')})},
padd:id=>{const p=by(S.productos,id),c=POS.cart.find(x=>x.pid==p.id);if(c){if(c.cant>=p.stock)return toast('No hay más stock disponible');c.cant++}else POS.cart.push({pid:p.id,cant:1});posGrid();posCart()},
prem:id=>{POS.cart.splice(+id,1);posGrid();posCart()},pclear:()=>{POS.cart=[];posGrid();posCart()},
pconf:()=>{const er=m=>$('#poser').textContent=m;if(!POS.cart.length)return er('Agrega al menos un producto al carrito.');const l=posLines(),d=posDesc(l);if(d>sum(l,x=>x.cant*x.precio))return er('El descuento no puede superar el subtotal.');
const r=crearVenta({clienteId:POS.cli||null,vendedor:POS.vend,formaPago:POS.pago,lineas:l,descuento:d});if(r.err)return er(r.err);POS.cart=[];POS.dv=0;toast('Venta '+r.v.numero+' registrada · '+r.f.numero);render();docM(r.f)},
vver:ACT_vver,fver:id=>docM(by(S.facturas,id)),
fpay:id=>{const f=by(S.facturas,id);f.pagos.push({fecha:today(),monto:f.saldo,medio:'Efectivo'});f.saldo=0;f.estado='Pagada';save();render();docM(f);toast('Factura marcada como pagada')},
edn:id=>openEd(id),'edit-qt':id=>openEd('qt',id),'edit-oc':id=>openEd('oc',id),
ladd:()=>{edSync();E.lineas.push(newLine(E.k));edHTML()},lrem:id=>{edSync();if(E.lineas.length<2)return toast('Debe quedar al menos una línea');E.lineas.splice(+id,1);edHTML()},
cdel:id=>ask('¿Eliminar esta cotización?',()=>{S.facturas=S.facturas.filter(x=>x.id!=id);save();render();toast('Cotización eliminada')}),
cconv:id=>convertM(id),
cconvgo:id=>{const f=by(S.facturas,id),r=crearVenta({clienteId:f.clienteId,vendedor:VEND[0],formaPago:$('#cvp').value,lineas:f.lineas.map(l=>({...l})),descuento:f.descuento||0});if(r.err)return $('#cver').textContent=r.err;f.estado='Aceptada';f.convertida=r.f.numero;save();render();docM(r.f);toast('Cotización convertida en venta y factura')},
ficha:fichaM,abono:abonoM,pmov:movM,pajuste:ajusteM,
over:id=>{const c=by(S.compras,id);openM(`<h3>Orden ${c.numero}</h3><p>${esc(pvn(c.proveedorId))} · ${fd(c.fecha)} · ${bd(c.estado)}${c.vence?' · vence '+fd(c.vence):''}</p>${tbl(['Producto','#Cant.','#Costo','#Subtotal'],c.lineas.map(l=>[esc(l.nombre),l.cant,money(l.costo),money(l.cant*l.costo)]))}<div class="dt"><div class="t"><span>Total</span><span>${money(c.total)}</span></div><div><span>Saldo por pagar</span><span>${money(c.saldo)}</span></div></div>${c.pagos.length?`<h4>Pagos</h4>${tbl(['Fecha','Medio','#Monto'],c.pagos.map(p=>[fd(p.fecha),p.medio,money(p.monto)]))}`:''}<div class="mf"><button class="btn" data-act="close">Cerrar</button></div>`,'lg')},
orec:id=>ask('Al marcar como recibida se suma el stock, se actualiza el costo y se crea la cuenta por pagar.',()=>recibir(id),'Marcar recibida'),
odel:id=>ask('¿Eliminar esta orden de compra?',()=>{S.compras=S.compras.filter(x=>x.id!=id);save();render();toast('Orden eliminada')}),
ftab:id=>{F.ftab=id;render()},cxppay:payM,repcsv:csvDl,
reset:()=>ask('Se borrarán todos los cambios y se restablecerán los datos de ejemplo.',()=>{seed();page='dashboard';render();toast('Datos de ejemplo restablecidos')},'Restablecer'),
import:()=>{try{const d=JSON.parse($('#impj').value);if(!d||!Array.isArray(d.clientes)||!Array.isArray(d.productos)||!d.cfg||!d.seq)throw 0;S=d;save();render();toast('Datos importados')}catch(e){$('#imper').textContent='El JSON no es válido o no corresponde a esta aplicación.'}}};

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el){if(e.target.id==='modal')closeM();return}const a=el.dataset.act;if(ACT[a])ACT[a](el.dataset.id,el,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='posq'){POS.q=t.value;posGrid();return}
if(t.dataset.f){const[a,b]=t.dataset.f.split('.');F[a][b]=t.type==='checkbox'?t.checked:t.value;const r=t.dataset.r;$('#'+r).innerHTML=LIST[r]()}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
if(d.p){POS[d.p]=t.value;if(d.p==='dv'||d.p==='dt')posTot()}
if(d.ci!==undefined){const c=POS.cart[+d.ci],p=by(S.productos,c.pid);let n=Math.max(1,parseInt(t.value)||1);if(n>p.stock){n=p.stock;toast('Máximo disponible: '+p.stock)}c.cant=n;t.value=n;$('#ls'+d.ci).textContent=money(n*p.precio);posTot();posGrid()}
if(d.ed)edChange(t);
if(d.user){S.user=t.value;save();render();toast('Usuario: '+ROLES[S.user][1])}
if(d.mv)movM(t.value);
if(d.cest){const f=by(S.facturas,d.cest);f.estado=t.value;save();render();docM(f);toast('Estado actualizado')}});
document.addEventListener('submit',e=>{e.preventDefault();const fm=e.target,k=fm.dataset.form,fd_=Object.fromEntries(new FormData(fm));const er=id=>m=>{$('#'+id).textContent=m};
if(k==='crud'){const ent=fm.dataset.ent,id=fm.dataset.id,sc=SC[ent],bad=er('crer'),o={};
for(const f of sc.f){let v=(fd_[f[0]]||'').trim();if(f[3]&&!v)return bad('Completa el campo: '+f[1]);if(f[2]==='number'){v=v===''?0:Number(v);if(v<0||isNaN(v))return bad('Valor inválido en '+f[1])}o[f[0]]=v}
if(ent==='productos'&&S.productos.some(p=>p.sku.toLowerCase()===o.sku.toLowerCase()&&p.id!=id))return bad('Ya existe un producto con ese SKU.');
if(id){const r=by(S[ent],id);if(ent==='productos'&&r.stock!==o.stock)S.movs.push({id:uid(),fecha:today(),pid:r.id,tipo:'ajuste',cant:o.stock-r.stock,motivo:'Edición de producto'});Object.assign(r,o)}else{o.id=uid();S[ent].push(o);if(ent==='productos'&&o.stock)S.movs.push({id:uid(),fecha:today(),pid:o.id,tipo:'ajuste',cant:o.stock,motivo:'Stock inicial'})}
save();closeM();render();toast('Guardado correctamente')}
else if(k==='ed'){edSync();const bad=er('eder'),qt=E.k==='qt';if(!E.date)return bad('Indica la fecha.');if(E.lineas.some(l=>!(l.cant>0)))return bad('Todas las cantidades deben ser mayores a cero.');
const lin=E.lineas.map(l=>({...l,costo:qt?l.costo:l.precio}));
if(qt){const t=totals(lin,0).total;if(E.id){const f=by(S.facturas,E.id);Object.assign(f,{clienteId:E.ent,vencimiento:E.date,estado:E.estado,lineas:lin,total:t})}else S.facturas.push({id:uid(),numero:S.cfg.pCot+'-'+pad(++S.seq.cot),tipo:'Cotización',clienteId:E.ent,emision:today(),vencimiento:E.date,estado:E.estado,lineas:lin,descuento:0,total:t,saldo:0,pagos:[],convertida:null})}
else{const t=sum(lin,l=>l.cant*l.costo);if(E.id)Object.assign(by(S.compras,E.id),{proveedorId:E.ent,fecha:E.date,lineas:lin,total:t});else S.compras.push({id:uid(),numero:S.cfg.pOc+'-'+pad(++S.seq.oc),fecha:E.date,proveedorId:E.ent,estado:'Pedida',lineas:lin,total:t,saldo:0,vence:null,pagos:[]})}
save();closeM();render();toast('Guardado correctamente')}
else if(k==='abono'){const f=by(S.facturas,fm.dataset.id),m=Number(fd_.monto);if(!(m>0)||m>f.saldo+.5)return er('aber')('El monto debe ser mayor a cero y no superar el saldo.');f.saldo=Math.max(0,f.saldo-m);f.pagos.push({fecha:fd_.fecha,monto:m,medio:fd_.medio});if(f.saldo<1){f.saldo=0;f.estado='Pagada'}save();closeM();render();toast(f.saldo?'Abono registrado':'Factura saldada y marcada como pagada')}
else if(k==='pago'){const c=by(S.compras,fm.dataset.id),m=Number(fd_.monto);if(!(m>0)||m>c.saldo+.5)return er('pger')('El monto debe ser mayor a cero y no superar el saldo.');c.saldo=Math.max(0,c.saldo-m);if(c.saldo<1)c.saldo=0;c.pagos.push({fecha:fd_.fecha,monto:m,medio:fd_.medio});save();closeM();render();toast('Pago registrado')}
else if(k==='ajuste'){const p=by(S.productos,fd_.pid),n=Number(fd_.cant),bad=er('ajer');if(isNaN(n)||n<0)return bad('Cantidad inválida.');let dlt=fd_.tipo==='in'?n:fd_.tipo==='out'?-n:n-p.stock;if(p.stock+dlt<0)return bad('La salida supera el stock disponible.');p.stock+=dlt;S.movs.push({id:uid(),fecha:today(),pid:p.id,tipo:'ajuste',cant:dlt,motivo:fd_.motivo.trim()});save();closeM();render();toast('Ajuste registrado')}
else if(k==='cfg'){Object.assign(S.cfg,{nombre:fd_.nombre.trim(),nit:fd_.nit.trim(),dir:fd_.dir.trim(),iva:Number(fd_.iva),pFac:fd_.pFac.trim().toUpperCase(),pCot:fd_.pCot.trim().toUpperCase(),pOc:fd_.pOc.trim().toUpperCase()});save();render();toast('Ajustes guardados')}});
render();
</script>
