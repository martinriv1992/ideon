<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA Distribution · Inventory</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F6F8FB;--fg:#0F1B33;--acc:#0FB5A6;--pri:#12307A;--mut:#64708a;--line:#e3e8f0;--card:#fff;--red:#d64550;--amb:#d98a0b;--grn:#1c9a5b;--sh:0 1px 2px rgba(15,27,51,.06),0 8px 24px rgba(15,27,51,.06)}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.demo{height:28px;background:var(--pri);color:#cfe0ff;font-size:12px;display:flex;align-items:center;justify-content:center;letter-spacing:.03em}
.app{display:flex;min-height:calc(100vh - 28px)}
aside{width:236px;background:#fff;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;align-self:flex-start;height:calc(100vh - 28px);display:flex;flex-direction:column;gap:4px;transition:width .2s;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:700;color:var(--pri);white-space:nowrap}
.brand small{display:block;font-weight:500;color:var(--mut);font-size:11px}
.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--mut);cursor:pointer;border:0;background:none;text-align:left;font-weight:500;white-space:nowrap;width:100%}
.nv:hover{background:#f0f4fa;color:var(--fg)}
.nv.on{background:var(--pri);color:#fff}
.nv svg{flex:none}
.nv .b{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.app.col aside{width:68px}
.app.col .nv span,.app.col .brand div{display:none}
.app.col .nv .b{display:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mainw{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;background:rgba(246,248,251,.9);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.top h1{font-size:20px;margin:0;flex:1}
main{padding:24px;max-width:1280px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#b8c3d6}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
select,input,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(15,181,166,.35);border-color:var(--acc)}
.top select{width:auto}
.menu{display:inline-flex}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:18px;border:1px solid #edf0f6}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi .l{color:var(--mut);font-size:12px;font-weight:500;display:flex;align-items:center;gap:8px}
.kpi .v{font-size:26px;font-weight:700;margin-top:6px;color:var(--pri)}
.kpi .s{font-size:12px;color:var(--mut)}
.kpi .ic{width:30px;height:30px;border-radius:9px;background:rgba(15,181,166,.12);color:var(--acc);display:grid;place-items:center}
.up{color:var(--grn)}.dn{color:var(--red)}
.two{grid-template-columns:1.6fr 1fr}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.bar>*{flex:1 1 150px}
.bar .grow{flex:2 1 220px}
.bar .btn{flex:0 0 auto}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid #f0f3f8;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.ok,.delivered{background:#e1f6ec;color:var(--grn)}
.low,.pending{background:#fff1d6;color:#9a6205}
.out,.cancelled{background:#fde4e6;color:var(--red)}
.preparing{background:#e3ecff;color:#2450b8}
.shipped{background:#e6e4fb;color:#4b3fb5}
.entry{background:#e1f6ec;color:var(--grn)}.exit{background:#fde4e6;color:var(--red)}.adjustment{background:#e3ecff;color:#2450b8}
.empty{text-align:center;color:var(--mut);padding:36px 12px}
.empty b{display:block;color:var(--fg);margin-bottom:4px}
.ov{position:fixed;inset:0;background:rgba(15,27,51,.5);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:5vh 12px;z-index:50}
.ov.show{display:flex}
#confirm{z-index:60;align-items:center}
.mdl{background:#fff;border-radius:18px;width:100%;max-width:640px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mdl.wide{max-width:900px}.mdl.sm{max-width:420px}
.mdl h3{margin:0 0 14px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px}
.f>span{font-size:12px;font-weight:600;color:var(--mut)}
.f em{font-size:11px;color:var(--mut);font-style:normal}
.f.full{grid-column:1/-1}
.err{color:var(--red);font-size:12px;min-height:0}
.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--red)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end;margin-top:16px}
.dl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.dl div span{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.dl div b{font-weight:600}
.meter{height:10px;background:#e8edf5;border-radius:9px;overflow:hidden;position:relative}
.meter i{display:block;height:100%;border-radius:9px;background:var(--acc)}
.meter i.low{background:var(--amb)}.meter i.out{background:var(--red)}
.ln{display:grid;grid-template-columns:2.4fr .7fr .8fr .7fr .9fr auto;gap:8px;align-items:center;margin-bottom:6px}
.ln.h{font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase}
.ln small{grid-column:1/-1;font-size:12px;color:var(--mut);margin-top:-4px}
.ln small.e{color:var(--red)}
.tot{margin-left:auto;width:260px;margin-top:12px}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .g{font-weight:700;font-size:16px;border-top:1px solid var(--line);margin-top:4px;padding-top:8px;color:var(--pri)}
.tl{display:flex;gap:0;margin:8px 0 16px;flex-wrap:wrap}
.tl div{flex:1;min-width:90px;text-align:center;font-size:12px;color:var(--mut);position:relative;padding-top:20px}
.tl div:before{content:"";position:absolute;top:4px;left:0;right:0;height:3px;background:#e1e7f0}
.tl div:after{content:"";position:absolute;top:0;left:calc(50% - 6px);width:12px;height:12px;border-radius:50%;background:#e1e7f0}
.tl .d{color:var(--fg)}.tl .d:before,.tl .d:after{background:var(--acc)}
.tl .c{color:var(--red)}.tl .c:before,.tl .c:after{background:var(--red)}
.al{display:grid;grid-template-columns:1.6fr repeat(4,.7fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #f0f3f8}
.al:last-child{border:0}
.al small{display:block;color:var(--mut);font-size:11px}
#toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:90}
#toast div{background:var(--fg);color:#fff;padding:11px 16px;border-radius:12px;box-shadow:var(--sh);max-width:340px;animation:in .2s}
#toast div.err{background:var(--red)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
#tip{position:fixed;background:var(--fg);color:#fff;padding:5px 9px;border-radius:8px;font-size:12px;pointer-events:none;display:none;z-index:99}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{font-size:11px;fill:#64708a}
svg.ch rect.bar{fill:var(--pri);transition:fill .15s}
svg.ch rect.bar:hover{fill:var(--acc)}
.ml{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #f0f3f8;align-items:center}
.ml:last-child{border:0}
.ml small{color:var(--mut);display:block;font-size:11px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f0f3f8}
.cols{grid-template-columns:1fr 1fr}
textarea.big{min-height:120px;font-family:ui-monospace,monospace;font-size:12px}
.note{background:#eef6ff;border:1px solid #d3e4fb;color:#244a86;padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:13px}
#bnav{display:none}
@media(max-width:900px){
aside{display:none}
#bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:30;overflow-x:auto;padding:4px}
#bnav .nv{flex-direction:column;gap:2px;font-size:10px;padding:6px 10px;width:auto;min-width:64px;align-items:center;position:relative}
#bnav .nv .b{position:absolute;top:2px;right:8px;margin:0;padding:0 5px}
main{padding:16px 14px 90px}
.top{padding:12px 14px}.menu{display:none}
.two,.cols{grid-template-columns:1fr}
.al{grid-template-columns:1fr 1fr}
#toast{bottom:78px}
}
@media(max-width:720px){
.fg,.dl{grid-template-columns:1fr}
.top .btn span{display:none}
table.rs,table.rs tbody,table.rs tr,table.rs td{display:block}
table.rs thead{display:none}
table.rs tr{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:10px;background:#fff}
table.rs td{display:flex;justify-content:space-between;gap:10px;border:0;padding:5px 0;text-align:right}
table.rs td:before{content:attr(data-l);color:var(--mut);font-size:11px;text-transform:uppercase;text-align:left;flex:none}
table.rs td:empty{display:none}
.ln{grid-template-columns:1fr 1fr}.ln.h{display:none}.ln select{grid-column:1/-1}
.tot{width:100%}
}
</style>
</head>
<body>
<div class="demo">Product demo · fictional data</div>
<div class="app" id="app">
<aside><div class="brand"><svg class="i" style="width:30px;height:30px;color:var(--acc)" viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M8 15V9l8 6V9"/></svg><div>NOVA Distribution<small>Inventory</small></div></div><div id="nav"></div></aside>
<div class="mainw">
<div class="top"><button class="btn ghost menu" data-a="side" aria-label="Toggle sidebar"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button><h1 id="title"></h1><select id="role" class="rolesel" aria-label="Role"><option value="admin">Role: Admin</option><option value="warehouse">Role: Warehouse</option><option value="sales">Role: Sales</option></select><button class="btn acc" data-a="ordNew"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Create order</span></button></div>
<main id="main"></main>
</div></div>
<nav id="bnav"></nav>
<div class="ov" id="modal"></div><div class="ov" id="confirm"></div><div id="toast"></div><div id="tip"></div>
<script>
const KEY='nova-distribution-inventory';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'}).format(n||0);
const r2=n=>Math.round(n*100)/100;
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>iso(new Date());
const nowS=()=>{const d=new Date();return iso(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const fd=s=>String(s).replace('T',' ');
const USER={admin:'Marta Vega (admin)',warehouse:'Iker Soto (warehouse)',sales:'Carla Nuño (sales)'};
const PERM={prodAdd:['admin','warehouse'],prodDel:['admin'],mv:['admin','warehouse'],cust:['admin','sales'],ordNew:['admin','sales'],ordCancel:['admin','sales'],ship:['admin','warehouse'],cat:['admin'],sys:['admin']};
const can=k=>PERM[k].includes(S.role);
const NEXT={Pending:'Preparing',Preparing:'Shipped',Shipped:'Delivered'};
const IC={dashboard:'M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z',products:'M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',inventory:'M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3',alerts:'M12 3l10 18H2zM12 10v5M12 18h.01',customers:'M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8M22 21v-2a4 4 0 00-3-3.9M16 3.1a4 4 0 010 7.8',orders:'M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4zM3 6h18M16 10a4 4 0 01-8 0',reports:'M4 20V10M10 20V4M16 20v-8M22 20H2',settings:'M12 15a3 3 0 100-6 3 3 0 000 6M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z'};
const ico=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;
const TITLES={dashboard:'Dashboard',products:'Products',inventory:'Inventory',alerts:'Alerts',customers:'Customers',orders:'Orders',reports:'Reports',settings:'Settings'};

function seed(){
let a=7;const R=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const ri=(x,y)=>x+Math.floor(R()*(y-x+1));
const st={seq:0,role:'admin',categories:[],suppliers:[],products:[],movements:[],customers:[],orders:[]};
const id=()=>++st.seq;
const cats=[['Beverages','Water, juices, soft drinks and cold coffee'],['Dairy','Milk, yogurt, butter and cheese'],['Pantry','Dry goods, oils and canned food'],['Snacks','Chips, nuts, cookies and chocolate'],['Frozen','Frozen vegetables, pizza and ice cream'],['Cleaning & Hygiene','Home cleaning and personal hygiene']];
st.categories=cats.map(c=>({id:id(),name:c[0],description:c[1]}));
const sups=[['Valle Verde Foods','Teresa Lamas','5'],['Norte Lácteos','Hugo Barrera','2'],['AquaPrima Drinks','Sara Beltrán','3'],['Crunchy Lab','Dani Quirós','7'],['FrostLine Iberia','Olga Ferrán','4'],['BrilloHogar Supplies','Nacho Prieto','6']];
st.suppliers=sups.map((s,i)=>({id:id(),name:s[0],contact:s[1],email:s[1].split(' ')[0].toLowerCase()+'@example.com',phone:'+34 600 11 '+(2000+i*137),leadTime:+s[2]}));
const si={Beverages:2,Dairy:1,Pantry:0,Snacks:3,Frozen:4,'Cleaning & Hygiene':5};
const code={Beverages:'BEV',Dairy:'DAI',Pantry:'PAN',Snacks:'SNK',Frozen:'FRZ','Cleaning & Hygiene':'CLN'};
const PR=[['Sparkling Water 6x1.5L','Beverages','pack',2.4],['Orange Juice 1L','Beverages','unit',1.1],['Iced Tea Peach 33cl','Beverages','box',7.8],['Cola Zero 33cl','Beverages','box',9.2],['Craft Lemonade 75cl','Beverages','unit',1.9],['Cold Brew Coffee 25cl','Beverages','pack',5.5],
['Whole Milk 1L (6)','Dairy','box',4.1],['Greek Yogurt 4-pack','Dairy','pack',1.9],['Butter 250g','Dairy','unit',1.85],['Mozzarella 1kg','Dairy','kg',5.9],['Oat Drink 1L','Dairy','unit',1.15],
['Basmati Rice 5kg','Pantry','unit',6.4],['Spaghetti 500g (12)','Pantry','box',9.6],['Olive Oil 1L','Pantry','litre',5.8],['Tomato Passata 700g (6)','Pantry','box',8.4],['Chickpeas Jar 400g (12)','Pantry','box',7.2],['Sea Salt 1kg','Pantry','unit',.6],['Wheat Flour 1kg','Pantry','kg',.55],
['Sea Salt Chips 150g (12)','Snacks','box',11.5],['Roasted Almonds 200g','Snacks','pack',3.2],['Oat Cookies 300g (10)','Snacks','box',10.4],['Dark Chocolate 100g (20)','Snacks','box',8.9],
['Garden Peas 1kg','Frozen','kg',1.7],['Margherita Pizza (8)','Frozen','box',14.2],['Vanilla Ice Cream 1L','Frozen','unit',2.6],['Fish Fingers 750g','Frozen','pack',4.4],
['Dish Soap 750ml','Cleaning & Hygiene','unit',1.3],['Laundry Detergent 3L','Cleaning & Hygiene','unit',6.9],['Paper Towels 6-roll','Cleaning & Hygiene','pack',3.4],['Hand Soap 500ml','Cleaning & Hygiene','unit',1.6]];
const mxs=[60,80,100,120,150];
st.products=PR.map((p,i)=>{const mx=mxs[ri(0,4)],mn=Math.round(mx*.25);let s=Math.round(mx*(.35+R()*.6));
if([3,11,19,25].includes(i))s=Math.max(1,mn-ri(1,4));if([7,16,27].includes(i))s=0;
return{id:id(),sku:code[p[1]]+'-'+(100+i),name:p[0],category:p[1],supplier:st.suppliers[si[p[1]]].id,unit:p[2],cost:p[3],price:r2(p[3]*(1.28+R()*.25)),stock:s,minStock:mn,maxStock:mx}});
const us=Object.values(USER);
let mv=[];
for(let i=0;i<40;i++){const p=st.products[ri(0,29)],r=R(),t=r<.45?'Entry':r<.85?'Exit':'Adjustment';
const q=t==='Adjustment'?(ri(-6,6)||2):ri(5,40);
mv.push({date:iso(addDays(new Date(),-ri(0,60)))+'T'+pad(ri(8,17))+':'+pad(ri(0,59)),productId:p.id,type:t,qty:q,after:ri(4,p.maxStock),reason:t==='Entry'?(R()<.8?'Purchase':'Return'):t==='Exit'?(R()<.7?'Sale':'Damage'):'Count correction',user:us[ri(0,2)],notes:''})}
mv.sort((x,y)=>x.date<y.date?-1:1).forEach(m=>{m.id=id();st.movements.push(m)});
const cu=[['Colmado La Esquina','Store','Ana Ruiz','Valencia','Immediate'],['Supermercados Brisa','Supermarket','Pablo Ferrer','Alicante','60 days'],['Restaurante El Olivo','Restaurant','Lucía Mora','Sevilla','30 days'],['Tienda Granel Norte','Store','Javier Ortiz','Bilbao','15 days'],['Hiper Mercado Sol','Supermarket','Elena Cano','Málaga','60 days'],['Bistró Casa Luna','Restaurant','Mario Díaz','Madrid','30 days'],['Ultramarinos Pepita','Store','Pepita Gil','Zaragoza','Immediate'],['SuperVecino Express','Supermarket','Rafa León','Murcia','30 days'],['Trattoria Il Sole','Restaurant','Giulia Bassi','Barcelona','15 days'],['Mini Market Aurora','Store','Nuria Pons','Girona','Immediate'],['Cantina Los Arcos','Restaurant','Tomás Vera','Granada','30 days'],['Mercado Central Demo','Supermarket','Irene Soler','Valladolid','60 days']];
st.customers=cu.map((c,i)=>({id:id(),name:c[0],type:c[1],contact:c[2],email:c[2].split(' ')[0].toLowerCase()+'@example.com',phone:'+34 600 55 '+(1000+i*211),city:c[3],paymentTerms:c[4]}));
const off=[58,55,50,46,42,38,33,29,25,21,17,13,10,7,5,3,2,1];
const stt=['Delivered','Delivered','Delivered','Delivered','Cancelled','Delivered','Delivered','Delivered','Cancelled','Delivered','Delivered','Delivered','Delivered','Shipped','Shipped','Preparing','Pending','Pending'];
const seq=['Pending','Preparing','Shipped','Delivered'];
off.forEach((o,i)=>{const n=ri(1,3),used=[],lines=[];
while(lines.length<n){const p=st.products[ri(0,29)];if(used.includes(p.id))continue;used.push(p.id);lines.push({pid:p.id,qty:ri(2,24),price:p.price,disc:[0,0,5,10][ri(0,3)]})}

function barChart(d){const W=640,H=250,L=48,B=30,T=14,mx=Math.max(1,...d.map(x=>x.v)),step=Math.pow(10,Math.floor(Math.log10(mx))),top=Math.ceil(mx/step)*step,ch=H-B-T,bw=(W-L)/d.length;
let s=`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly sales bar chart">`;
for(let i=0;i<=4;i++){const y=T+ch-ch*i/4;s+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="#e6ebf3"/><text x="${L-6}" y="${y+4}" text-anchor="end">${Math.round(top*i/4/100)/10}k</text>`}
d.forEach((x,i)=>{const h=ch*x.v/top,bx=L+i*bw+bw*.18;s+=`<rect class="bar" data-tip="${esc(x.tip)}" x="${bx}" y="${T+ch-h}" width="${bw*.64}" height="${Math.max(h,1)}" rx="5"/><text x="${bx+bw*.32}" y="${H-10}" text-anchor="middle">${x.l}</text>`});
return s+'</svg>'}
function hbars(it,empt){if(!it.length||!it.some(x=>x.v>0))return empty(empt||'No sales in this period');const mx=Math.max(...it.map(x=>x.v)),n=it.length;
let s=`<svg class="ch" viewBox="0 0 560 ${n*26+4}">`;
it.forEach((x,i)=>{const y=i*26+2,w=Math.max(2,290*x.v/mx);s+=`<text x="0" y="${y+16}">${esc(x.l.length>26?x.l.slice(0,25)+'…':x.l)}</text><rect class="bar" data-tip="${esc(x.l)}: ${eur(x.v)}" x="170" y="${y+3}" width="${w}" height="16" rx="4"/><text x="${176+w}" y="${y+16}">${eur(x.v)}</text>`});
return s+'</svg>'}

openModal(`<h3>Order ${o.number} ${badge(o.status)}<button class="btn ghost sm" data-a="close">✕</button></h3><p style="margin:0 0 8px;color:var(--mut)">${esc(cName(o.customer))} · ${o.date}</p><div class="tl">${tl}</div>
${tbl(['Product','Qty','Price','Disc.','Line total'],o.lines.map(l=>[esc(pName(l.pid)),l.qty,eur(l.price),l.disc+'%',eur(r2(l.qty*l.price*(1-l.disc/100)))]))}
<div class="tot"><div><span>Subtotal</span><span>${eur(o.subtotal)}</span></div><div><span>VAT 21%</span><span>${eur(o.vat)}</span></div><div class="g"><span>Total</span><span>${eur(o.total)}</span></div></div>
<div class="row end">${o.status!=='Cancelled'&&o.status!=='Delivered'?ab('ocan',o.id,'Cancel order','danger'):''}${NEXT[o.status]?`<button class="btn pri" data-a="oadv" data-id="${o.id}">Move to ${NEXT[o.status]}</button>`:''}</div>`,'wide')}
function lineRow(l){return`<div class="ln"><select name="lp">${S.products.map(p=>`<option value="${p.id}" ${p.id==l.pid?'selected':''}>${esc(p.name)} · ${p.sku}</option>`).join('')}</select><input name="lq" type="number" min="1" step="1" value="${l.qty}"><input name="lpr" type="number" min="0" step="0.01" value="${l.price}"><input name="ld" type="number" min="0" max="100" step="1" value="${l.disc}"><b class="lt"></b><button type="button" class="btn sm ghost" data-a="ldel">✕</button><small></small></div>`}
function oform(cid){if(!guard('ordNew'))return;if(!S.products.length||!S.customers.length)return toast('Create customers and products first.','err');const p=S.products.find(p=>avail(p.id)>0)||S.products[0];
openModal(`<h3>New order<button class="btn ghost sm" data-a="close">✕</button></h3><form data-form="order" novalidate>${fld('Customer','customer',cid||'',{type:'select',opts:[['','Select customer…']].concat(S.customers.map(c=>[c.id,c.name])),req:1})}<div style="margin-top:12px"><div class="ln h"><span>Product</span><span>Qty</span><span>Price</span><span>Disc %</span><span>Total</span><span></span></div><div id="lines">${lineRow({pid:p.id,qty:1,price:p.price,disc:0})}</div><button type="button" class="btn sm" data-a="ladd">+ Add line</button><small class="err" data-e="lines" style="display:block"></small></div><div class="tot"><div><span>Subtotal</span><span id="o1"></span></div><div><span>VAT 21%</span><span id="o2"></span></div><div class="g"><span>Total</span><span id="o3"></span></div></div><div class="row end"><button type="button" class="btn" data-a="close">Cancel</button><button class="btn pri">Create order</button></div></form>`,'wide');recalc()}
function readLines(){return[...document.querySelectorAll('#lines .ln')].map(r=>({r,pid:+r.querySelector('[name=lp]').value,qty:num(r.querySelector('[name=lq]').value),price:num(r.querySelector('[name=lpr]').value),disc:num(r.querySelector('[name=ld]').value)||0}))}
function recalc(){const ls=readLines(),use={};let ok=true;ls.forEach(l=>{use[l.pid]=(use[l.pid]||0)+(l.qty||0)});
ls.forEach(l=>{const a=avail(l.pid),sm=l.r.querySelector('small');let m='Available: '+a,e=false;
if(!(l.qty>0)||l.qty%1){m='Quantity must be a whole number above 0';e=true}else if(!(l.price>=0)||l.disc<0||l.disc>100){m='Check price and discount (0–100%)';e=true}else if(use[l.pid]>a){m='Only '+a+' available — reduce quantity (blocked)';e=true}
sm.textContent=m;sm.className=e?'e':'';if(e)ok=false;l.r.querySelector('.lt').textContent=eur(r2((l.qty||0)*(l.price||0)*(1-l.disc/100)))});
const t=calc(ls.map(l=>({qty:l.qty||0,price:l.price||0,disc:l.disc})));$('#o1').textContent=eur(t.subtotal);$('#o2').textContent=eur(t.vat);$('#o3').textContent=eur(t.total);return ok}

function reports(){return`<div class="card" style="margin-bottom:16px"><div class="bar" style="margin:0"><select data-f="rp"><option value="month" ${ui.rp==='month'?'selected':''}>This month</option><option value="last" ${ui.rp==='last'?'selected':''}>Last month</option><option value="90" ${ui.rp==='90'?'selected':''}>Last 90 days</option><option value="custom" ${ui.rp==='custom'?'selected':''}>Custom range</option></select>${ui.rp==='custom'?`<input type="date" data-f="rf" value="${ui.rf}" aria-label="From"><input type="date" data-f="rt" value="${ui.rt}" aria-label="To">`:''}</div></div><div id="res">${RES.reports()}</div>`}
function range(){const t=new Date();if(ui.rp==='month')return[iso(new Date(t.getFullYear(),t.getMonth(),1)),iso(t)];if(ui.rp==='last')return[iso(new Date(t.getFullYear(),t.getMonth()-1,1)),iso(new Date(t.getFullYear(),t.getMonth(),0))];if(ui.rp==='90')return[iso(addDays(t,-89)),iso(t)];return[ui.rf||iso(addDays(t,-29)),ui.rt||iso(t)]}
function salesData(){const[f,t]=range(),os=salesIn(f,t),bp={},bc={},bk={};S.products.forEach(p=>bp[p.id]={p,v:0,u:0});
os.forEach(o=>o.lines.forEach(l=>{const v=l.qty*l.price*(1-l.disc/100),p=prod(l.pid);if(bp[l.pid]){bp[l.pid].v+=v;bp[l.pid].u+=l.qty}bc[o.customer]=(bc[o.customer]||0)+v;if(p)bk[p.category]=(bk[p.category]||0)+v}));
return{f,t,os,bp:Object.values(bp),bc,bk}}

<div class="card" style="margin-top:16px"><h2>Movements by period <button class="btn sm" data-a="csv" data-id="moves">Export CSV</button></h2><div class="grid kpis">${chip('Entries',ent.length,ent.reduce((a,m)=>a+m.qty,0)+' units in')}${chip('Exits',ex.length,ex.reduce((a,m)=>a+m.qty,0)+' units out')}${chip('Adjustments',ad.length,'Net '+ad.reduce((a,m)=>a+m.qty,0)+' units')}</div>${mv.length?tbl(['Date','Product','Type','Qty','Reason','User'],mv.slice(0,30).map(m=>[fd(m.date),esc(pName(m.productId)),badge(m.type),sgn(m),esc(m.reason),esc(m.user)])):empty('No movements in this period')}</div>`}
function csv(rows,name){const t=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');const u=URL.createObjectURL(new Blob([t],{type:'text/csv'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),500)}

function advance(id){const o=ord(id),n=NEXT[o.status];if(!n)return;
if(n==='Shipped'){if(!guard('ship'))return;const need={};o.lines.forEach(l=>need[l.pid]=(need[l.pid]||0)+l.qty);
const bad=Object.keys(need).filter(k=>!prod(k)||prod(k).stock<need[k]);
if(bad.length){toast('Cannot ship: insufficient stock for '+bad.map(k=>pName(k)+' (need '+need[k]+', have '+(prod(k)?prod(k).stock:0)+')').join('; '),'err');return}
o.lines.forEach(l=>mov(prod(l.pid),'Exit',l.qty,'Sale','Order '+o.number))}
o.status=n;o.history.push({s:n,d:today()});closeModal();upd();toast('Order '+o.number+' → '+n)}
function cancelOrd(id){const o=ord(id);if(!guard('ordCancel'))return;if(o.status==='Delivered')return toast('Delivered orders cannot be cancelled.','err');
const sh=o.status==='Shipped';
confirmBox('Cancel order '+o.number+'?',sh?'This order was already shipped. Cancelling will restore stock through Entry movements (reason: Return).':'The order will be marked as cancelled. This cannot be undone.','Cancel order',()=>{
if(sh)o.lines.forEach(l=>{const p=prod(l.pid);if(p)mov(p,'Entry',l.qty,'Return','Order '+o.number+' cancelled')});
o.status='Cancelled';o.history.push({s:'Cancelled',d:today()});closeModal();upd();toast('Order cancelled'+(sh?' · stock restored':''))})}

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t){const v=t.dataset.id;A[t.dataset.a]&&A[t.dataset.a](v&&!isNaN(v)?+v:v,t);return}
if(e.target.id==='modal')closeModal()});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;FORMS[f.dataset.form]&&FORMS[f.dataset.form](f)});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.f;
if(k){ui[k]=t.value;if(k==='rp')return render();const r=$('#res');if(r&&RES[ui.view])r.innerHTML=RES[ui.view]();return}
if(t.closest('#lines'))recalc()});
document.addEventListener('change',e=>{const t=e.target;
if(t.classList.contains('rolesel')){S.role=t.value;upd();toast('Role: '+S.role);return}
if(t.name==='lp'){const r=t.closest('.ln');r.querySelector('[name=lpr]').value=prod(t.value).price;recalc()}
const f=t.form;if(f&&f.dataset.form==='mv'){if(t.name==='type'){f.reason.value=t.value==='Adjustment'?'Count correction':t.value==='Entry'?'Purchase':'Damage';f.quantity.closest('.f').firstChild.textContent=(t.value==='Adjustment'?'New count':'Quantity')+' *'}
if(t.name==='product'){const p=prod(t.value);$('#mvh').textContent=p?'Current stock: '+p.stock+' '+p.unit+' (min '+p.minStock+', max '+p.maxStock+')':''}}});
const tip=$('#tip');
document.addEventListener('pointermove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t){tip.textContent=t.dataset.tip;tip.style.display='block';tip.style.left=Math.min(e.clientX+12,innerWidth-190)+'px';tip.style.top=(e.clientY+14)+'px'}else tip.style.display='none'});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){A.cno();closeModal()}});
render();
</script>
</body>
</html>
